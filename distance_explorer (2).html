<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Distance Explorer · Smart Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#83358C;--pink:#F01A8C;--yellow:#FFF212;
  --purple-deep:#5C2563;--pink-dk:#B01268;--yellow-dk:#D6C900;
  --ink:#161016;--muted:#4A3A4D;--line:#E7D8EA;
  --ok:#2FBF6D;--ok-deep:#1D7A45;--no:#E0433A;
  --grid-purple:#C5A3D0;
  --font-display:'Fredoka','SB Display',Boulder,sans-serif;
  --font-text:'Nunito','SB Text',Bariol,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow-x:hidden;overflow-y:auto}
body{background:#E6DCEB;height:100%;height:100dvh;display:flex;flex-direction:column;font-family:var(--font-text);color:var(--ink)}
button{font:inherit;cursor:pointer}

/* ── Top bar ── */
.topbar{flex:0 0 auto;min-height:clamp(56px,8vh,76px);display:flex;align-items:center;gap:clamp(8px,1.6vw,16px);
  padding:clamp(6px,1.5vh,8px) clamp(10px,2vw,24px);border-bottom:3px solid var(--purple);background:var(--yellow);min-width:0}
.brand-logo{display:block;height:clamp(26px,4.6vh,34px);width:auto;max-width:clamp(48px,20vw,140px);object-fit:contain;overflow:hidden;white-space:nowrap;flex:0 1 auto;min-width:0}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(15px,2.8vh,26px);color:#5C2563;min-width:0}
h1 b{color:var(--pink)}

/* ── Layout ── */
.layout{flex:1;min-height:0;min-width:0;display:grid;
  grid-template-columns:minmax(0,3fr) minmax(340px,1fr);
  gap:14px;padding:14px clamp(12px,2vw,24px)}
.col{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;
  box-shadow:0 12px 25px -20px var(--purple-deep);min-height:0}
.stage-card{flex:1;display:flex;flex-direction:column;padding:12px;min-height:0}

/* ── Stage ── */
.stage{position:relative;flex:1;min-height:clamp(150px,26vh,600px);border-radius:15px;border:1px solid var(--line);overflow:hidden;background:#F5F0F9}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none;user-select:none}

/* ── Dynamic Banner ── */
.banner{flex:0 0 auto;align-self:center;position:relative;z-index:5;
  background:#fff;border:3px solid var(--purple);border-radius:20px;
  padding:clamp(5px,1vh,7px) clamp(14px,3vw,26px);font:700 clamp(13px,2.3vh,19px) var(--font-display);
  color:var(--purple-deep);box-shadow:0 4px 0 rgba(92,37,99,.14);
  width:max-content;max-width:94%;text-align:center;letter-spacing:0.4px;overflow-wrap:break-word;
  margin:2px auto 8px;transition:border-color .25s,color .25s}
.banner .q-badge{display:inline-flex;align-items:center;background:#EEDBF2;
  color:var(--purple-deep);padding:3px 12px;border-radius:12px;
  font-size:.82em;font-weight:800;letter-spacing:.3px;border:1px solid #D6B2DD;
  margin-right:10px;vertical-align:middle}
.banner.good{border-color:var(--ok);color:var(--ok-deep)}
.banner .target{color:var(--pink);font-weight:700}
.banner.pop{animation:bPop .3s cubic-bezier(.2,1.4,.35,1)}
@keyframes bPop{0%{opacity:0;transform:translateY(-6px) scale(.96)}60%{transform:translateY(1px) scale(1.01)}100%{opacity:1;transform:translateY(0) scale(1)}}

/* ── Right column ── */
.rightcol{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}

/* ── LCD Distance Display (from Distance Detective) ── */
.metercard{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0;
  padding:clamp(10px,1.8vh,16px);background:linear-gradient(170deg,#F7EFF9,#FFFFFF 60%)}
.lcd{border-radius:clamp(16px,3vh,24px);padding:clamp(14px,3vh,26px) clamp(12px,2.4vw,20px) clamp(12px,2.4vh,20px);text-align:center;position:relative;overflow:hidden;
  background:linear-gradient(165deg,rgba(242,225,248,.96),rgba(228,198,238,.86) 60%,rgba(238,212,245,.92));
  -webkit-backdrop-filter:blur(18px) saturate(1.25);backdrop-filter:blur(18px) saturate(1.25);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,1),inset 0 -14px 22px -16px rgba(131,53,140,.35),
    0 0 0 1px rgba(131,53,140,.08),0 14px 26px -12px rgba(92,37,99,.45)}
.lcd::before{content:'';position:absolute;left:6%;right:6%;top:0;height:46%;border-radius:0 0 60% 60%/0 0 100% 100%;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.lcd-label{font:700 clamp(9px,1.4vh,10px) var(--font-display);letter-spacing:.18em;color:#7E90C4;margin-bottom:clamp(4px,.8vh,6px)}
.lcd-val{font-family:var(--font-display);font-weight:700;font-size:clamp(36px,8.5vh,68px);line-height:1;color:var(--purple-deep);
  text-shadow:0 1px 0 rgba(255,255,255,.8);display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;
  gap:clamp(6px,1.2vw,10px);min-width:0}
.lcd-val small{font-size:clamp(16px,2.6vh,22px);color:var(--muted)}
.lcd-val .dl{font-size:clamp(16px,3.2vh,27px);color:var(--pink)}
.lcd-val .pop{display:inline-block;animation:scorePop .28s cubic-bezier(.34,1.56,.64,1)}
@keyframes scorePop{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(-3deg)}100%{transform:scale(1)}}
.lcd-sub{display:flex;gap:8px;justify-content:center;margin-top:clamp(6px,1.3vh,10px);flex-wrap:wrap}
.lcd-target{display:inline-block;background:linear-gradient(150deg,#83358C,#5C2563);color:#fff;
  border-radius:999px;padding:clamp(5px,.9vh,6px) clamp(12px,2.4vw,16px);font:700 clamp(12px,1.9vh,15px) var(--font-display);box-shadow:0 4px 0 #45194E}
.lcd-target b{color:#FFF212}
.lcd-target.pop{animation:scorePop .45s cubic-bezier(.34,1.56,.64,1)}

/* ── Controls card ── */
.ctrl{flex:0 0 auto;display:flex;flex-direction:column;gap:clamp(7px,1.3vh,10px);padding:clamp(10px,1.8vh,14px) clamp(12px,2vw,16px) clamp(12px,2vh,16px)}
.btn{border:none;border-radius:clamp(10px,2vh,14px);padding:clamp(9px,1.7vh,12px) clamp(12px,2vw,16px);font:700 clamp(13px,2.2vh,16px) var(--font-display);
  width:100%;cursor:pointer;transition:transform .16s cubic-bezier(.22,1.3,.35,1),filter .16s,box-shadow .16s;
  position:relative;overflow:hidden;
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
.btn::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.10) 40%,rgba(255,255,255,0) 60%)}
.btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.12)}
.btn:hover{filter:brightness(1.06);transform:translateY(-2px)}
.btn:active{transform:translateY(2px)}
.btn:disabled{filter:grayscale(.5) brightness(.92);cursor:default;transform:none}
.btn-pink{background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pink-dk)}
.btn-pink:active{box-shadow:0 2px 0 var(--pink-dk)}
.btn-yellow{background:var(--yellow);color:var(--ink);box-shadow:0 5px 0 var(--yellow-dk)}
.btn-yellow.big{min-height:clamp(42px,6vh,48px);font-size:clamp(16px,2.5vh,20px);box-shadow:0 6px 0 var(--yellow-dk)}
.btn-yellow.big:active{box-shadow:0 2px 0 var(--yellow-dk)}
.btn-ghost{background:#F0E8F2;color:var(--purple-deep);box-shadow:0 3px 0 #DCC6E4}
.btn-ghost:active{box-shadow:0 1px 0 #DCC6E4}

/* ── Progress dots ── */
.progress-dots{display:flex;gap:8px;justify-content:center;margin:8px 0}
.progress-dot{width:14px;height:14px;border-radius:50%;background:#E7D8EA;
  border:2px solid #D0B8D8;transition:background .3s,border-color .3s,transform .3s}
.progress-dot.done{background:var(--ok);border-color:var(--ok-deep);
  box-shadow:0 0 8px rgba(47,191,109,.5)}
.progress-dot.current{background:var(--pink);border-color:var(--pink-dk);
  box-shadow:0 0 8px rgba(240,26,140,.5);transform:scale(1.2)}

/* ── Overlay ── */
.ov{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.75);
  display:flex;padding:clamp(10px,3vh,20px);overflow-y:auto;overflow-x:hidden;
  transition:opacity .35s,visibility 0s}
.ov.hide{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
.ov-box{background:var(--yellow);border:clamp(3px,.7vh,5px) solid var(--purple);border-radius:clamp(18px,4vh,28px);
  padding:clamp(16px,4vh,30px) clamp(14px,4vw,42px);text-align:center;max-width:min(520px,100%);margin:auto;
  transition:transform .35s cubic-bezier(.22,1,.36,1)}
.ov.hide .ov-box{transform:scale(.9) translateY(10px)}
.ov-box h2{font-family:var(--font-display);font-size:clamp(26px,4.6vh,40px);color:var(--purple-deep)}
.ov-box p{font-family:var(--font-display);font-weight:600;font-size:clamp(15px,2.8vh,22px);color:var(--pink);
  margin:clamp(10px,2.4vh,18px) 0 clamp(14px,3vh,24px);line-height:1.45}
.ov-icons{display:flex;gap:clamp(10px,3vw,20px);justify-content:center;margin:clamp(4px,1vh,6px) 0 clamp(10px,2vh,16px)}
.ov-icons svg{width:clamp(54px,11vh,80px);height:clamp(54px,11vh,80px);filter:drop-shadow(0 6px 10px rgba(92,37,99,.3));
  animation:iconIn .6s cubic-bezier(.34,1.56,.64,1) both, iconFloat 3.4s ease-in-out infinite}
.ov-icons svg:nth-child(1){animation-delay:.05s,1.0s}
.ov-icons svg:nth-child(2){animation-delay:.15s,1.4s}
@keyframes iconIn{from{opacity:0;transform:translateY(16px) scale(.45)}to{opacity:1;transform:none}}
@keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.ov-start{background:var(--pink);color:#fff;border:none;border-radius:18px;
  padding:clamp(10px,2vh,13px) clamp(20px,5vw,36px);font:700 clamp(16px,3vh,21px) var(--font-display);box-shadow:0 7px 0 var(--pink-dk);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;
  position:relative;overflow:hidden;
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
.ov-start::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.10) 40%,rgba(255,255,255,0) 60%)}
.ov-start::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.12)}
.ov-start:hover{transform:translateY(-3px);box-shadow:0 10px 0 var(--pink-dk)}
.ov-start:active{transform:translateY(4px);box-shadow:0 3px 0 var(--pink-dk)}
.ov-task{font-family:var(--font-display);font-weight:700;font-size:clamp(17px,3.5vh,28px);
  color:var(--ink);margin:0 0 clamp(14px,3vh,22px);line-height:1.25}
.ov-task span{display:inline-block;min-width:clamp(36px,6vh,44px);padding:2px clamp(6px,1.6vw,10px);border-radius:11px;
  background:var(--purple);color:var(--yellow)}

/* ── Final screen ── */
.final{position:fixed;inset:0;z-index:90;display:none;padding:clamp(10px,3vh,20px);
  overflow-y:auto;overflow-x:hidden;
  background:rgba(22,16,22,.45);backdrop-filter:blur(4px)}
.final.show{display:flex}
.final-box{background:#fff;border:clamp(3px,.7vh,5px) solid var(--purple);border-radius:clamp(18px,4vh,28px);
  padding:clamp(16px,4vh,32px) clamp(14px,4vw,42px);text-align:center;max-width:min(440px,100%);margin:auto;
  animation:finIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes finIn{from{opacity:0;transform:scale(.82) translateY(16px)}to{opacity:1;transform:none}}
.trophy{font-size:clamp(36px,9vh,62px);animation:tp .7s cubic-bezier(.3,1.6,.4,1)}
@keyframes tp{0%{transform:scale(.3) rotate(-20deg)}100%{transform:scale(1)}}
.final-box h2{font-family:var(--font-display);color:var(--purple);font-size:clamp(20px,4.2vh,30px);margin:clamp(4px,1vh,6px) 0}
.tally{font:800 clamp(34px,7.5vh,52px) var(--font-display);color:var(--pink);line-height:1}
.tally small{font-size:clamp(15px,3vh,22px);color:var(--purple-deep)}
.final-box p{margin:clamp(6px,1.4vh,10px) 0 clamp(10px,2.2vh,16px);color:var(--muted);font-weight:700}
.again{background:var(--pink);color:#fff;border:none;border-radius:clamp(12px,2.4vh,16px);padding:clamp(9px,1.7vh,12px) clamp(18px,4vw,28px);
  font:700 clamp(15px,2.6vh,18px) var(--font-display);box-shadow:0 6px 0 var(--pink-dk);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.again:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--pink-dk)}
.again:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-dk)}

/* ── Confetti ── */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:10px;height:14px;border-radius:2px}

/* ══ AUTO-FIT RESPONSIVE ══
   Stacked layout for phones/tablets (portrait), fluid compact variants for
   narrow / short / ultra-wide viewports. Elements reflow — never transform-
   scaled — so nothing is cropped, overlapped, or pushed off-screen. */
@media (max-width:940px) and (min-height:561px),(max-width:559px){
  .layout{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(min-content,1fr) auto}
  .rightcol{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));
    min-height:auto;align-content:start}
}
@media (max-width:640px){
  .layout{gap:10px;padding:10px}
  .col,.rightcol{gap:10px}
  .stage-card{padding:8px}
  .banner{padding:5px 14px;font-size:clamp(13px,2.1vh,16px);max-width:98%}
  .topbar{padding:6px 10px;gap:10px}
  .lcd{padding:14px 12px 14px}
  .lcd-val{font-size:clamp(34px,7vh,48px)}
  .lcd-val .dl{font-size:clamp(15px,2.8vh,22px)}
  .lcd-val small{font-size:clamp(14px,2.3vh,18px)}
  .metercard{padding:10px}
  .ctrl{padding:10px 12px 12px}
}
@media (max-width:380px){
  .layout{gap:8px;padding:8px}
  .topbar{padding:5px 8px;gap:8px}
  h1{font-size:clamp(14px,3vh,18px)}
  .banner{padding:4px 10px}
  .lcd{padding:12px 10px 12px}
  .lcd-val{font-size:clamp(30px,6.5vh,44px)}
  .btn{padding:8px 10px}
}
@media (max-height:560px){
  .topbar{min-height:clamp(46px,9vh,58px);padding-top:4px;padding-bottom:4px}
  .layout{gap:8px;padding:8px clamp(8px,1.6vw,16px)}
  .col,.rightcol{gap:8px}
  .stage-card{padding:8px}
  .banner{padding:4px 12px;font-size:clamp(12px,3.6vh,16px);margin-bottom:4px}
  .lcd{padding:10px 12px 12px}
  .metercard{padding:8px}
  .lcd-val{font-size:clamp(30px,9vh,44px)}
  .lcd-val .dl{font-size:clamp(14px,4vh,22px)}
  .lcd-val small{font-size:clamp(13px,3.4vh,18px)}
  .lcd-target{font-size:clamp(11px,3vh,14px);padding:4px 10px}
  .ctrl{padding:8px 10px 10px;gap:6px}
  .btn{padding:7px 12px;font-size:clamp(13px,3.4vh,15px)}
  .btn-yellow.big{min-height:36px;font-size:clamp(14px,4vh,17px)}
  .ov-box{padding:12px 18px}
  .ov-box h2{font-size:clamp(18px,7vh,30px)}
  .ov-box p{font-size:clamp(14px,5vh,18px);margin:8px 0 12px}
  .ov-icons{margin:2px 0 8px}
  .ov-icons svg{width:clamp(48px,14vh,70px);height:clamp(48px,14vh,70px)}
  .ov-task{font-size:clamp(15px,6vh,22px);margin-bottom:12px}
  .ov-start{padding:9px 22px;font-size:clamp(15px,5.5vh,18px)}
  .final-box{padding:12px 18px}
  .trophy{font-size:clamp(30px,12vh,48px)}
  .final-box h2{font-size:clamp(18px,7vh,26px)}
  .tally{font-size:clamp(28px,11vh,42px)}
  .final-box p{margin:6px 0 10px}
  .again{padding:8px 20px;font-size:clamp(14px,5vh,17px)}
}
@media (pointer:coarse){
  .btn,.ov-start,.again{min-height:44px}
}
@media (min-width:1600px){
  .layout{gap:16px;padding-left:clamp(24px,3vw,48px);padding-right:clamp(24px,3vw,48px)}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
}
</style>
</head>

          <linearGradient id="rulerG" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#FFD75E"/><stop offset="50%" stop-color="#F2B722"/><stop offset="100%" stop-color="#D9A018"/>
          </linearGradient>
        </defs>
        <ellipse cx="50" cy="90" rx="34" ry="4" fill="rgba(0,0,0,.15)"/>
        <rect x="10" y="28" width="80" height="52" rx="4" fill="url(#rulerG)" stroke="#B8900A" stroke-width="1.5"/>
        <rect x="10" y="28" width="80" height="12" rx="4" fill="#fff" opacity=".22"/>
        <g stroke="#5C2563" stroke-width="1.4" stroke-linecap="round">
          <line x1="20" y1="44" x2="20" y2="64"/><line x1="30" y1="44" x2="30" y2="56"/>
          <line x1="40" y1="44" x2="40" y2="64"/><line x1="50" y1="44" x2="50" y2="56"/>
          <line x1="60" y1="44" x2="60" y2="64"/><line x1="70" y1="44" x2="70" y2="56"/>
          <line x1="80" y1="44" x2="80" y2="64"/>
        </g>
        <g font-family="sans-serif" font-size="7" font-weight="700" fill="#5C2563" text-anchor="middle">
          <text x="20" y="74">1</text><text x="40" y="74">3</text><text x="60" y="74">5</text><text x="80" y="74">7</text>
        </g>
        <circle cx="50" cy="18" r="8" fill="#F01A8C" opacity=".85"/>
        <circle cx="48" cy="16" r="2.5" fill="#FF9AD5" opacity=".9"/>
      </svg>
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <radialGradient id="pencilG" cx="36%" cy="26%" r="82%">
            <stop offset="0%" stop-color="#FF9AD5"/><stop offset="28%" stop-color="#FB4FA8"/>
            <stop offset="62%" stop-color="#F01A8C"/><stop offset="88%" stop-color="#C11370"/>
          </radialGradient>
        </defs>
        <ellipse cx="50" cy="90" rx="34" ry="4" fill="rgba(0,0,0,.15)"/>
        <g transform="rotate(-25 50 50)">
          <rect x="42" y="10" width="16" height="10" rx="4" fill="#F79BC0"/>
          <rect x="42" y="18" width="16" height="6" fill="#B9C4CE"/>
          <rect x="42" y="24" width="16" height="52" fill="url(#pencilG)"/>
          <path d="M42 76 L58 76 L50 92 Z" fill="#E8C99A"/>
          <path d="M47.6 86.4 L52.4 86.4 L50 92 Z" fill="#3A3A3A"/>
        </g>
      </svg>
    </div>
    <h2>Distance Explorer</h2>
    <p style="margin-bottom: 8px">Draw lines of the right length!</p>
    <div class="ov-task">Each square = <span>1 cm</span></div>
    <button class="ov-start" id="start">▶ Let's Explore</button>
  </div>
</div>

<script>
/* ===== DISTANCE EXPLORER · Smart Block =====
   SVG-based grid line drawing activity.
   Interaction logic extracted from reference: pointer capture,
   snap-to-target, requestAnimationFrame batching, triple-layer lines. */

const $ = id => document.getElementById(id);
const TOTAL = 9;
// All nine task targets are whole-centimetre values.
const TARGETS = [3, 5, 4, 7, 6, 5, 8, 4, 9];
const SCALE = 10;          // 1 cm = 10 SVG units
const START_X = 20;        // SVG x for "0" mark
const TOL = 0.25;          // snap tolerance in cm
const ROW_H = 14;          // SVG units per row
const ROW_Y_START = 22;    // first row y position (below ruler header)

const ROW_Y = [];
for (let i = 0; i < TOTAL; i++) ROW_Y.push(ROW_Y_START + i * ROW_H);

let qi = 0, score = 0, currentVal = 0, isDragging = false, isSuccess = false;
let isLocked = false;
let animFrameId = null;
let lastSoundVal = -1;
let autoAdvanceTimer = null;
let actx = null;
let completedLines = [];

/* ── Audio (from reference) ── */
function tone(f, d, t = 'sine', dl = 0, v = 0.08) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), s = actx.currentTime + dl;
    o.type = t; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, s);
    g.gain.exponentialRampToValueAtTime(v, s + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, s + d);
    o.connect(g); g.connect(actx.destination);
    o.start(s); o.stop(s + d + 0.03);
  } catch (e) {}
}
const tickSnd = () => tone(450, 0.03, 'triangle', 0, 0.04);
const snapSnd = () => { tone(700, 0.06, 'triangle', 0, 0.08); tone(880, 0.1, 'sine', 0.05, 0.1); };
const rightSnd = () => { tone(523, 0.14, 'triangle', 0, 0.1); tone(659, 0.14, 'triangle', 0.11, 0.1); tone(784, 0.28, 'triangle', 0.22, 0.12); };
const clickSnd = () => tone(600, 0.04, 'sine', 0, 0.05);

/* ── Speech ── */
function speak(t) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.rate = 0.92; u.pitch = 1.05;
  $('hear').textContent = '🔊 Playing…';
  u.onend = u.onerror = () => $('hear').textContent = '🔊 Hear the question';
  speechSynthesis.speak(u);
}

/* ── Confetti ── */
function confetti(n) {
  const w = document.createElement('div'); w.className = 'confetti';
  const c = ['#83358C', '#F01A8C', '#FFF212', '#2FBF6D', '#3A86FF', '#FB8500'];
  for (let i = 0; i < n; i++) {
    const b = document.createElement('i');
    b.style.left = Math.random() * 100 + 'vw';
    b.style.background = c[i % c.length];
    b.style.setProperty('--dx', (Math.random() * 120 - 60).toFixed(1) + 'vw');
    b.style.animation = `cf${i % 3} ${2.4 + Math.random() * 1.8}s cubic-bezier(.35,.1,.75,.55) ${Math.random() * .5}s forwards`;
    w.appendChild(b);
  }
  const st = document.createElement('style');
  st.textContent = '@keyframes cf0{to{transform:translate(var(--dx,0vw),105vh) rotate(720deg);opacity:.9}}' +
    '@keyframes cf1{to{transform:translate(var(--dx,0vw),105vh) rotate(-540deg);opacity:.9}}' +
    '@keyframes cf2{to{transform:translate(var(--dx,0vw),105vh) rotate(360deg);opacity:.9}}';
  w.appendChild(st); document.body.appendChild(w);
  setTimeout(() => w.remove(), 5200);
}

/* ── SVG RENDER ── */
function render() {
  const svg = $('scene');
  if (!svg) return;

  const target = TARGETS[qi];
  const activeRowIdx = qi % TOTAL;
  const activeRowY = ROW_Y[activeRowIdx];
  const activeCurrentX = START_X + currentVal * SCALE;

  // 1. Paper base
  let s = `<rect width="160" height="140" fill="#FCFAFE"/>`;

  // 2. Ruler header strip (y: 0 → 14)
  s += `
    <rect x="0" y="0" width="160" height="14" fill="#FAF5FB"/>
    <line x1="0" y1="14" x2="160" y2="14" stroke="#83358C" stroke-width="1.1"/>
    <line x1="0" y1="14.5" x2="160" y2="14.5" stroke="#E6D0EB" stroke-width="0.5"/>
    <g transform="translate(3.2, 2.5)">
      <rect width="12.5" height="8" rx="4" fill="#83358C" stroke="#FFF212" stroke-width="0.85"/>
      <path d="M2,1.5 h8.5" stroke="#fff" stroke-width="0.55" opacity="0.65" stroke-linecap="round"/>
      <text x="6.25" y="5.6" font-family="var(--font-display)" font-size="3.5" font-weight="800" fill="#FFF212" text-anchor="middle">cm</text>
    </g>
  `;

  // Ticks & numbers
  for (let n = 0; n <= 14; n++) {
    const nx = START_X + n * SCALE;
    if (nx > 158) break;
    s += `<text x="${nx}" y="7.4" font-family="var(--font-display)" font-size="4.3" font-weight="800" fill="#4B1B53" text-anchor="middle">${n}</text>`;
    s += `<line x1="${nx}" y1="9.0" x2="${nx}" y2="14" stroke="#5C2563" stroke-width="1.1"/>`;
    if (n < 14) {
      s += `<line x1="${nx + 5}" y1="10.2" x2="${nx + 5}" y2="14" stroke="#83358C" stroke-width="0.8"/>`;
      for (let mm = 1; mm <= 9; mm++) {
        if (mm !== 5) s += `<line x1="${nx + mm}" y1="11.4" x2="${nx + mm}" y2="14" stroke="#BFA0C8" stroke-width="0.38"/>`;
      }
    }
  }

  // 3. Minor grid lines (every 5 SVG units = 0.5 cm)
  for (let x = 0; x <= 160; x += 5) {
    if (x % 10 !== 0) s += `<line x1="${x}" y1="14.5" x2="${x}" y2="140" stroke="#E9DDEC" stroke-width="0.38"/>`;
  }
  for (let y = 15; y <= 140; y += 5) {
    if (y % 10 !== 0) s += `<line x1="0" y1="${y}" x2="160" y2="${y}" stroke="#E9DDEC" stroke-width="0.38"/>`;
  }

  // 4. Major grid lines (every 10 SVG units = 1 cm) + dots
  for (let x = 0; x <= 160; x += 10) {
    s += `<line x1="${x}" y1="14.5" x2="${x}" y2="140" stroke="#BA8CC4" stroke-width="0.68"/>`;
  }
  for (let y = 20; y <= 140; y += 10) {
    s += `<line x1="0" y1="${y}" x2="160" y2="${y}" stroke="#BA8CC4" stroke-width="0.68"/>`;
    for (let x = 0; x <= 160; x += 10) {
      s += `<circle cx="${x}" cy="${y}" r="0.55" fill="#83358C" opacity="0.42"/>`;
    }
  }

  // 5. Vertical datum line
  s += `<line x1="${START_X}" y1="13" x2="${START_X}" y2="139" stroke="#83358C" stroke-width="0.85" stroke-dasharray="1.5,2" opacity="0.45"/>`;

  // 6. Render all 9 rows
  for (let i = 0; i < TOTAL; i++) {
    const rowY = ROW_Y[i];

    if (i < activeRowIdx && completedLines[i]) {
      // COMPLETED ROW
      const comp = completedLines[i];
      const compX = START_X + comp.target * SCALE;
      const compStr = Number.isInteger(comp.target) ? `${comp.target} cm` : `${comp.target.toFixed(1)} cm`;

      s += `
        <g id="row-${i}">
          <line x1="16.5" y1="${rowY}" x2="${START_X}" y2="${rowY}" stroke="#28BA65" stroke-width="1.2" stroke-dasharray="1,1.5" opacity="0.7"/>
          <g transform="translate(2.5, ${rowY - 5})">
            <rect width="14" height="9.8" rx="4.9" fill="#E2F7EA" stroke="#28BA65" stroke-width="0.85"/>
            <text x="7" y="6.5" font-family="var(--font-display)" font-size="3.4" font-weight="800" fill="#147038" text-anchor="middle">✓ Q${i + 1}</text>
          </g>
          <line x1="${START_X}" y1="${rowY + 0.6}" x2="${compX}" y2="${rowY + 0.6}" stroke="rgba(20,90,45,0.14)" stroke-width="4.0" stroke-linecap="round"/>
          <line x1="${START_X}" y1="${rowY}" x2="${compX}" y2="${rowY}" stroke="#28BA65" stroke-width="4.0" stroke-linecap="round"/>
          <line x1="${START_X}" y1="${rowY - 0.6}" x2="${compX}" y2="${rowY - 0.6}" stroke="#87F6AF" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
          <circle cx="${START_X}" cy="${rowY}" r="2.6" fill="#28BA65" stroke="#fff" stroke-width="0.8"/>
          <circle cx="${START_X}" cy="${rowY}" r="1.0" fill="#fff"/>
          <g transform="translate(${compX}, ${rowY})">
            <ellipse cx="10" cy="1.6" rx="9.5" ry="2" fill="rgba(20,90,45,0.22)"/>
            <rect x="0" y="-4.8" width="20" height="9.6" rx="4.8" fill="#28BA65" stroke="#198244" stroke-width="0.8"/>
            <path d="M2.8,-2.6 h14.4" stroke="#fff" stroke-width="0.6" opacity="0.6" stroke-linecap="round"/>
            <text x="10" y="1.5" font-family="var(--font-display)" font-size="3.6" font-weight="800" fill="#ffffff" text-anchor="middle">${compStr}</text>
          </g>
        </g>
      `;
    } else if (i === activeRowIdx) {
      // ACTIVE ROW
      const lineColor = isSuccess ? '#28BA65' : '#4E1954';
      const lineHighlight = isSuccess ? '#87F6AF' : '#8A3296';
      const lineWidth = isSuccess ? 4.5 : 4.2;

      s += `
        <g id="row-${i}">
          <line x1="16.5" y1="${rowY}" x2="${START_X}" y2="${rowY}" stroke="#83358C" stroke-width="1.2" stroke-dasharray="1,1.5" opacity="0.7"/>
          <g transform="translate(2.5, ${rowY - 5})">
            <rect x="0.4" y="0.6" width="14" height="9.8" rx="4.9" fill="rgba(131,53,140,0.3)"/>
            <rect width="14" height="9.8" rx="4.9" fill="#83358C" stroke="#FFF212" stroke-width="0.95"/>
            <path d="M2.8,1.6 h8.4" stroke="#fff" stroke-width="0.6" opacity="0.75" stroke-linecap="round"/>
            <text x="7" y="6.5" font-family="var(--font-display)" font-size="3.4" font-weight="800" fill="#FFF212" text-anchor="middle">Q-${i + 1}</text>
          </g>
          <line x1="${START_X}" y1="${rowY}" x2="150" y2="${rowY}" stroke="#83358C" stroke-width="1.1" stroke-dasharray="2.5,2.5" opacity="0.55"/>
          ${currentVal > 0 ? `
            <line x1="${START_X}" y1="${rowY + 0.6}" x2="${activeCurrentX}" y2="${rowY + 0.6}" stroke="rgba(60,15,70,0.14)" stroke-width="${lineWidth}" stroke-linecap="round"/>
            <line x1="${START_X}" y1="${rowY}" x2="${activeCurrentX}" y2="${rowY}" stroke="${lineColor}" stroke-width="${lineWidth}" stroke-linecap="round"/>
            <line x1="${START_X}" y1="${rowY - 0.6}" x2="${activeCurrentX}" y2="${rowY - 0.6}" stroke="${lineHighlight}" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
          ` : ''}
          <g transform="translate(${START_X}, ${rowY})">
            <ellipse cx="0" cy="1.3" rx="3.6" ry="1.3" fill="rgba(60,20,70,0.25)"/>
            <circle cx="0" cy="0" r="3.0" fill="#E5B942" stroke="#87620E" stroke-width="0.55"/>
            <circle cx="-0.6" cy="-0.6" r="2.0" fill="#FFF5C2" opacity="0.6"/>
            <circle cx="0" cy="0" r="1.6" fill="#83358C"/>
            <circle cx="0" cy="0" r="0.6" fill="#FFF212"/>
          </g>
        </g>
      `;

      // Drag handle (pencil + measurement tag) — from reference
      const tagFill = isSuccess ? '#28BA65' : '#F01A8C';
      const tagStroke = isSuccess ? '#198244' : '#B01268';
      const c_body_top = isSuccess ? '#28BA65' : '#9E44AC';
      const c_body_mid = isSuccess ? '#1C964E' : '#792C87';
      const c_body_bot = isSuccess ? '#136D38' : '#551C60';

      s += `
        <g id="dragHandle" transform="translate(${activeCurrentX}, ${rowY})" style="cursor:ew-resize;">
          <ellipse cx="5" cy="1.5" rx="7" ry="1.8" fill="rgba(45,15,55,0.18)" transform="rotate(28)"/>
          <circle cx="0" cy="0" r="5.2" fill="${isSuccess ? 'rgba(40,186,101,0.28)' : 'rgba(240,26,140,0.28)'}"/>
          <circle cx="0" cy="0" r="2.2" fill="${isSuccess ? '#28BA65' : '#F01A8C'}" stroke="#fff" stroke-width="0.9"/>
          <g transform="rotate(32)">
            <polygon points="0,0 -0.7,-2.4 0.7,-2.4" fill="#26242B"/>
            <polygon points="-1.6,-5 -0.5,-5.6 -0.5,-16 -1.6,-16" fill="${c_body_top}"/>
            <polygon points="-0.5,-5.6 0.5,-5.6 0.5,-16 -0.5,-16" fill="${c_body_mid}"/>
            <polygon points="0.5,-5.6 1.6,-5 1.6,-16 0.5,-16" fill="${c_body_bot}"/>
            <rect x="-0.4" y="-13.5" width="0.8" height="5" rx="0.3" fill="#F4CE52" opacity="0.85"/>
            <rect x="-1.7" y="-19" width="3.4" height="3" fill="#D6B45A" rx="0.3"/>
            <rect x="-1.7" y="-18.5" width="3.4" height="0.6" fill="#FBF2D5"/>
            <path d="M-1.6,-19 L-1.6,-21.5 Q-1.6,-23 0,-23 Q1.6,-23 1.6,-21.5 L1.6,-19 Z" fill="#E26383"/>
            <path d="M-1.6,-19 L-1.6,-21.5 Q-1.6,-23 0,-23 L0,-19 Z" fill="#FFAEC2" opacity="0.5"/>
            <ellipse cx="-0.5" cy="-21.8" rx="0.5" ry="1.0" fill="#fff" opacity="0.45"/>
          </g>
          <g transform="translate(0, -11)">
            <ellipse cx="0" cy="0.8" rx="10.5" ry="2.2" fill="${isSuccess ? 'rgba(40,186,101,0.25)' : 'rgba(240,26,140,0.25)'}"/>
            <rect x="-11" y="-4.8" width="22" height="9.6" rx="4.8" fill="${tagFill}" stroke="${tagStroke}" stroke-width="0.8"/>
            <path d="M-8,-2.6 h16" stroke="#fff" stroke-width="0.6" opacity="0.6" stroke-linecap="round"/>
            <text x="0" y="1.5" font-family="var(--font-display)" font-size="3.6" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">${currentVal.toFixed(1)} cm</text>
            <polygon points="-1.8,4.8 1.8,4.8 0,6.6" fill="${tagFill}"/>
          </g>
        </g>
      `;
    } else {
      // UPCOMING ROW
      s += `
        <g id="row-${i}" opacity="0.7">
          <line x1="16.5" y1="${rowY}" x2="${START_X}" y2="${rowY}" stroke="#D1B8D8" stroke-width="0.8" stroke-dasharray="1,2" opacity="0.4"/>
          <g transform="translate(2.5, ${rowY - 5})">
            <rect width="14" height="9.8" rx="4.9" fill="#F4EDF7" stroke="#D4BCD9" stroke-width="0.7"/>
            <text x="7" y="6.5" font-family="var(--font-display)" font-size="3.2" font-weight="700" fill="#9C77A5" text-anchor="middle">Q-${i + 1}</text>
          </g>
          <line x1="${START_X}" y1="${rowY}" x2="150" y2="${rowY}" stroke="#D1B8D8" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.35"/>
          <circle cx="${START_X}" cy="${rowY}" r="1.4" fill="#B797C2" opacity="0.6"/>
        </g>
      `;
    }
  }

  svg.innerHTML = s;
}

/* ── Update UI (LCD, banner) ── */
function updateUI() {
  if (qi >= TOTAL) return;
  const target = TARGETS[qi];
  const targetStr = Number.isInteger(target) ? `${target} cm` : `${target.toFixed(1)} cm`;
  const qNum = qi + 1;
  const qBadge = `<span class="q-badge">Q-${qNum}</span>`;

  // Banner
  if (!isSuccess) {
    $('banner').innerHTML = `${qBadge}Draw a line of <span class="target">${targetStr}</span> on the grid!`;
    $('banner').className = 'banner pop';
  }

  // Question label
  $('qLabel').textContent = `Question ${qNum} of ${TOTAL}`;

  // LCD distance value
  const dv = $('distVal');
  const newVal = currentVal.toFixed(1);
  if (dv.textContent !== newVal) {
    dv.textContent = newVal;
    dv.classList.remove('pop');
    void dv.offsetWidth;
    dv.classList.add('pop');
  }

  // LCD target chip
  $('targetChip').innerHTML = `🎯 Target: <b>${targetStr}</b>`;
}

/* ── POINTER INTERACTION (from reference: capture + SVG coords + rAF) ── */
function getSvgCoords(e) {
  const svg = $('scene');
  const pt = svg.createSVGPoint();
  if (e.touches && e.touches.length > 0) {
    pt.x = e.touches[0].clientX;
    pt.y = e.touches[0].clientY;
  } else {
    pt.x = e.clientX;
    pt.y = e.clientY;
  }
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

function handlePointerMove(e) {
  if (!isDragging || isLocked) return;
  const p = getSvgCoords(e);
  let newVal = Math.max(0, Math.min(13, Math.round(((p.x - START_X) / SCALE) * 10) / 10));

  if (newVal !== currentVal) {
    currentVal = newVal;
    if (Math.abs(currentVal - lastSoundVal) >= 0.2) {
      lastSoundVal = currentVal;
      tickSnd();
    }
    if (!animFrameId) {
      animFrameId = requestAnimationFrame(() => {
        render();
        updateUI();
        animFrameId = null;
      });
    }
  }
}

function handlePointerUp() {
  if (!isDragging || isLocked) return;
  isDragging = false;
  const target = TARGETS[qi];

  // Snap-to-target auto-validation (from reference)
  if (Math.abs(currentVal - target) <= TOL) {
    currentVal = target;
    snapSnd();
    render();
    validateAnswer();
  } else {
    render();
    updateUI();
  }
}

/* ── Validate Answer ── */
function validateAnswer() {
  if (isLocked || isSuccess) return;
  const target = TARGETS[qi];
  const diff = Math.abs(currentVal - target);
  const targetStr = Number.isInteger(target) ? `${target} cm` : `${target.toFixed(1)} cm`;
  const qBadge = `<span class="q-badge">Q-${qi + 1}</span>`;

  if (diff <= TOL) {
    isSuccess = true;
    isLocked = true;
    rightSnd();
    confetti(40);
    score++;

    completedLines[qi] = { target: target, val: currentVal };

    $('banner').innerHTML = `${qBadge}🌟 <b>Great Job!</b> Exact line: <span class="target">${targetStr}</span>!`;
    $('banner').className = 'banner good pop';

    render();

    clearTimeout(autoAdvanceTimer);
    autoAdvanceTimer = setTimeout(() => {
      qi++;
      if (qi >= TOTAL) {
        finish();
      } else {
        isLocked = false;
        currentVal = 0;
        isSuccess = false;
        lastSoundVal = -1;
        render();
        updateUI();
        // Update LCD target for new question
        const newTarget = TARGETS[qi];
        const newTargetStr = Number.isInteger(newTarget) ? `${newTarget} cm` : `${newTarget.toFixed(1)} cm`;
        const tc = $('targetChip');
        tc.innerHTML = `🎯 Target: <b>${newTargetStr}</b>`;
        tc.classList.remove('pop');
        void tc.offsetWidth;
        tc.classList.add('pop');
        setTimeout(() => speak(`Draw a line that is exactly ${TARGETS[qi]} centimetres long.`), 300);
      }
    }, 1800);
  } else {
    const currentStr = Number.isInteger(currentVal) ? `${currentVal} cm` : `${currentVal.toFixed(1)} cm`;
    $('banner').innerHTML = `${qBadge}Not quite — current is <span class="mover">${currentStr}</span>, target is <span class="target">${targetStr}</span>!`;
    $('banner').className = 'banner bad pop';
  }
}

/* ── Finish ── */
function finish() {
  $('fs').textContent = score;
  $('fi').textContent = score === TOTAL ? '🏆' : score >= 5 ? '🌟' : '👏';
  $('fh').textContent = score === TOTAL ? 'Perfect!' : score >= 5 ? 'Well done!' : 'Good effort!';
  $('fmsg').textContent = score === TOTAL
    ? 'You drew every line perfectly!'
    : score >= 5
      ? 'Great measurement skills!'
      : 'Keep practising your measurements!';
  $('final').classList.add('show');
  if (score >= 5) confetti(score === TOTAL ? 120 : 70);
}

/* ── Setup ── */
function setupInteractions() {
  const stage = $('stage');

  const onPointerDown = (e) => {
    if (isLocked || qi >= TOTAL) return;
    isDragging = true;
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    handlePointerMove(e);
  };

  stage.addEventListener('pointerdown', onPointerDown);
  stage.addEventListener('pointermove', (e) => { if (isDragging) handlePointerMove(e); });
  stage.addEventListener('pointerup', () => { if (isDragging) handlePointerUp(); });
  stage.addEventListener('pointercancel', () => { if (isDragging) handlePointerUp(); });
  window.addEventListener('mouseup', handlePointerUp);
  window.addEventListener('touchend', handlePointerUp);
  stage.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
}

/* ── Controls ── */
$('undo').onclick = () => {
  if (isLocked) return;
  currentVal = 0;
  isSuccess = false;
  clickSnd();
  render();
  updateUI();
};

$('reset').onclick = () => {
  if (isLocked) return;
  currentVal = 0;
  isSuccess = false;
  clickSnd();
  render();
  updateUI();
};

$('hear').onclick = () => {
  if (qi < TOTAL) speak(`Draw a line that is exactly ${TARGETS[qi]} centimetres long.`);
};

$('restart').onclick = () => {
  qi = 0; score = 0; currentVal = 0; isLocked = false; isSuccess = false;
  completedLines = [];
  clearTimeout(autoAdvanceTimer);
  $('final').classList.remove('show');
  render();
  updateUI();
  setTimeout(() => speak(`Draw a line that is exactly ${TARGETS[qi]} centimetres long.`), 300);
};

$('start').onclick = () => {
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  $('ov').classList.add('hide');
  setTimeout(() => $('ov').remove(), 400);
  setupInteractions();
  render();
  updateUI();
  setTimeout(() => speak(`Draw a line that is exactly ${TARGETS[qi]} centimetres long.`), 300);
};
</script>
</body>
</html>

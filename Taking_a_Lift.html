<!doctype html>
<html class="intro" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taking a Lift · Smart Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#83358C;--pink:#F01A8C;--yellow:#FFF212;
  --purple-deep:#5C2563;--pink-dk:#B01268;--yellow-dk:#D6C900;
  --ink:#161016;--muted:#4A3A4D;--line:#E7D8EA;
  --ok:#2FBF6D;--ok-deep:#1D7A45;--no:#E0433A;
  --sig-red:#FF2D2D;--sig-yellow:#FFC400;--sig-green:#22D35A;
  --font-display:'Fredoka','SB Display',Boulder,sans-serif;
  --font-text:'Nunito','SB Text',Bariol,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
@supports (height:100dvh){
  /* Use the visible phone/tablet viewport, not the larger area behind browser chrome.
     --vvh is updated from visualViewport; 100dvh remains the built-in fallback. */
  html[data-layout-mode="auto-fit"],html[data-layout-mode="auto-fit"] body{
    height:100dvh;
    height:min(100dvh,var(--vvh,100dvh));
  }
}
body{background:#E6DCEB;overflow:hidden;display:flex;flex-direction:column;font-family:var(--font-text);color:var(--ink)}
button{font:inherit;cursor:pointer}

/* ===================== SHELL (the Distance Detective house layout) ===================== */
.topbar{flex:0 0 auto;height:clamp(62px,8vh,76px);display:flex;align-items:center;gap:16px;
  padding:8px clamp(12px,2vw,24px);border-bottom:3px solid var(--purple);background:var(--yellow)}
.brand-logo{height:34px;width:auto}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(18px,2.8vh,26px);color:#5C2563}
h1 b{color:var(--pink)}
.layout{flex:1;min-height:0;display:grid;
  grid-template-columns:minmax(0,3fr) minmax(340px,1fr);
  gap:14px;padding:14px clamp(12px,2vw,24px)}
@media(max-width:940px) and (orientation:portrait){
  .layout{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  /* a grid track defaulting to min-content is what held the cards at 418 px in a
     390 px window: let every item shrink, and let the header row wrap if it must */
  .col,.rightcol,.card{min-width:0}
  .rightcol{grid-template-columns:minmax(0,1fr)}
  .task-header{flex-wrap:wrap;row-gap:5px}
  .progress{flex-wrap:wrap;justify-content:center}
}
.col{display:flex;flex-direction:column;gap:12px;min-height:0}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;
  box-shadow:0 12px 25px -20px var(--purple-deep);min-height:0}
.stage-card{flex:1;display:flex;flex-direction:column;padding:12px;min-height:0}
.stage{position:relative;flex:1;min-height:200px;border-radius:15px;border:1px solid var(--line);overflow:hidden;
  background:linear-gradient(#8FC6EC,#DDEFFA 33%,#9BCB72 33.2%,#7AB656)}
.scene{width:100%;height:100%;display:block;overflow:visible}

/* ---- task header + progress dots ---- */
.task-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 6px 10px;flex-wrap:wrap;row-gap:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.eyebrow{font-family:var(--font-display);font-weight:700;font-size:10.5px;letter-spacing:.11em;color:var(--pink);text-transform:uppercase;white-space:nowrap}
.progress{display:flex;gap:6px;flex:0 0 auto}
/* the round dots are little glazed beads — the Pattern and Sequence finish */
.progress .dot{position:relative;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;
  color:#AE8FB8;border:1px solid #DCCAE4;font:700 11px var(--font-display);
  text-shadow:0 1px 0 rgba(255,255,255,.85);
  background:radial-gradient(115% 100% at 50% 0%,#FFFFFF 0%,#F8F1FC 46%,#E8DAF0 100%);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.97), inset 0 -2.5px 3px rgba(131,53,140,.13),
             0 2px 0 rgba(92,37,99,.13), 0 5px 9px -5px rgba(92,37,99,.35);
  transition:color .25s,border-color .25s,box-shadow .25s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.progress .dot::after{content:"";position:absolute;left:17%;right:17%;top:9%;height:44%;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(255,255,255,.10));pointer-events:none}
.progress .dot.current{color:#fff;border-color:#D81C86;text-shadow:0 1px 1px rgba(150,10,80,.45);
  background:radial-gradient(115% 105% at 50% 0%,#FF80C5 0%,var(--pink) 52%,#D6167F 100%);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.78), inset 0 -2.5px 3px rgba(140,8,72,.32),
             0 3px 0 rgba(176,18,104,.42), 0 8px 13px -6px rgba(240,26,140,.70);
  transform:scale(1.12)}
.progress .dot.done{color:#188348;border-color:#79CAA0;text-shadow:0 1px 0 rgba(255,255,255,.9);
  background:radial-gradient(115% 100% at 50% 0%,#FFFFFF 0%,#E5FAED 46%,#BDECCF 100%);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.97), inset 0 -2.5px 3px rgba(47,150,90,.17),
             0 2px 0 rgba(47,150,90,.24), 0 5px 9px -5px rgba(47,150,90,.50)}
.progress .dot.pop{animation:dotPop .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes dotPop{0%{transform:scale(1)}42%{transform:scale(1.5)}100%{transform:scale(1)}}

/* ---- banner (tap it to hear the question again) ---- */
.banner{margin:0 auto;flex:0 1 auto;min-width:0;background:#fff;border:3px solid var(--purple);
  border-radius:18px;padding:4px 18px;font:700 clamp(13px,2.4vh,19px) var(--font-display);color:var(--purple-deep);
  box-shadow:0 5px 0 rgba(92,37,99,.18);width:max-content;max-width:94%;text-align:center;letter-spacing:.4px;
  cursor:pointer;user-select:none}
.banner .target{color:var(--pink)}
.banner .l-red{color:#D4141C}
.banner .l-yellow{color:#B57F00}
.banner .l-green{color:#13873B}
.banner.pop{animation:bp .4s cubic-bezier(.22,1,.36,1)}
@keyframes bp{0%{opacity:0;transform:translateY(-10px) scale(.92)}
  60%{opacity:1;transform:translateY(0) scale(1.035)}100%{transform:scale(1)}}

/* ===================== RIGHT COLUMN ===================== */
.rightcol{display:flex;flex-direction:column;gap:12px;min-height:0}
.card-title{font-family:var(--font-display);font-weight:700;font-size:15.5px;color:var(--purple);padding:2px 4px 10px}

/* -- the choices: the prediction throws the light, so the pads sit up here -- */
.optcard{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0;padding:16px;
  background:linear-gradient(170deg,#F7EFF9,#FFFFFF 60%)}
.optcard .legend .rule{text-align:center}
.optcard .sig-status{margin-top:clamp(8px,1.3vh,13px);text-align:center;font-size:clamp(14px,2vh,17px)}
.sig-status{font:700 clamp(15px,2.2vh,19px) var(--font-display);color:var(--purple-deep);
  min-height:1.3em;letter-spacing:.2px}
.sig-status b{font-weight:700}
.sig-status .c-red{color:#D4141C}.sig-status .c-yellow{color:#B57F00}.sig-status .c-green{color:#13873B}
.sig-status.fs{animation:fadeSlide .38s cubic-bezier(.22,1,.36,1) both}
@keyframes fadeSlide{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* -- choose the signal: where Distance Detective keeps its controls -- */
/* the three choices travel as one light frosted-pink block */
.opts{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.2vh,12px);
  padding:clamp(7px,1vh,10px);border-radius:22px;
  background:linear-gradient(180deg,#FFFDFE 0%,#FDF1F8 100%);border:2.5px solid #F7A0CD;
  box-shadow:inset 0 2px 0 #fff,inset 0 -3px 0 rgba(226,120,178,.16),
             0 7px 0 rgba(240,156,201,.38),0 16px 26px -18px rgba(200,80,140,.7)}
.opts::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,0) 58%)}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,.8vh,8px);
  padding:clamp(8px,1.3vh,12px) 4px clamp(7px,1.1vh,10px);border-radius:16px;border:2.5px solid #F7A0CD;
  background:linear-gradient(180deg,rgba(255,250,254,.96) 0%,rgba(255,224,242,.96) 46%,rgba(255,192,226,.97) 100%);
  -webkit-backdrop-filter:blur(8px) saturate(1.4);backdrop-filter:blur(8px) saturate(1.4);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.99),inset 0 -3px 0 rgba(226,120,178,.20),
             0 5px 0 rgba(240,156,201,.46),0 14px 22px -14px rgba(226,120,178,.80);
  transition:transform .18s cubic-bezier(.22,1,.36,1),box-shadow .18s,border-color .2s,opacity .25s,filter .25s;
  touch-action:manipulation;-webkit-user-select:none;user-select:none}
.opt::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(168deg,rgba(255,255,255,.88) 0%,rgba(255,255,255,.30) 34%,rgba(255,255,255,0) 58%),
             radial-gradient(130% 84% at 50% 116%,rgba(255,255,255,.55),rgba(255,255,255,0) 62%)}
/* the Connect-Arduino wave, rolling across the block one tile after another */
.opts.live .opt:not(.used)::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  border:3px solid rgba(240,26,140,.55);opacity:0;transform-origin:50% 50%;
  will-change:transform,opacity;                    /* compositor, not the main thread */
  animation:optPing 2.2s cubic-bezier(.45,0,.55,1) infinite}
.opts.live .opt[data-slot="1"]::after{animation-delay:.22s}
.opts.live .opt[data-slot="2"]::after{animation-delay:.44s}
@keyframes optPing{0%{opacity:.5;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.17)}}
.lens{position:relative;z-index:1;width:clamp(46px,7.4vh,68px);height:clamp(46px,7.4vh,68px);border-radius:50%;
  box-shadow:0 0 0 3.5px rgba(255,255,255,.95),0 0 0 5.5px rgba(247,160,205,.35),0 4px 9px rgba(120,30,80,.28),
             inset 0 -4px 6px rgba(0,0,0,.25)}
.lens::after{content:"";position:absolute;left:20%;right:30%;top:10%;height:36%;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0))}
.lens.red{background:radial-gradient(circle at 42% 36%,#FFB3AD 0%,#FF4A3F 34%,#D9101A 72%,#8E0510 100%)}
.lens.yellow{background:radial-gradient(circle at 42% 36%,#FFF3B0 0%,#FFD43B 34%,#F5A900 72%,#9C6B00 100%)}
.lens.green{background:radial-gradient(circle at 42% 36%,#C9FFD6 0%,#4FE07C 34%,#12A844 72%,#066A28 100%)}
.opt b{position:relative;z-index:1;font:700 clamp(15px,2.2vh,19px) var(--font-display);color:var(--purple-deep);letter-spacing:.3px}
.opt:hover{transform:translateY(-2px);border-color:#FF74BD;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.99),inset 0 -3px 0 rgba(226,120,178,.22),
             0 8px 0 rgba(240,140,196,.52),0 18px 26px -14px rgba(226,120,178,.88)}
.opt.press,.opt:active{transform:translateY(2px) scale(.972);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.99),inset 0 -2px 0 rgba(226,120,178,.22),0 2px 0 rgba(240,156,201,.42)}
.opt:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.opts:not(.live) .opt{cursor:default}
/* a wrong pick shakes its head and steps aside; the pink only ever means "you can choose this" */
.opt.used{opacity:.45;filter:grayscale(.85);cursor:default;transform:none}
.opt.used::after{content:"✕";position:absolute;right:6px;top:4px;z-index:2;font:700 15px var(--font-display);color:#C2342F;
  animation:none!important;box-shadow:none!important;inset:auto;width:auto;height:auto}
.opt.nope{animation:optNope .52s cubic-bezier(.36,.07,.19,.97)}
@keyframes optNope{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
/* the right one lights up in its own colour */
.opt.right{border-color:#fff;transform:translateY(-2px)}
.opt.right[data-c="red"]{box-shadow:0 0 0 4px rgba(255,45,45,.35),0 0 24px rgba(255,45,45,.55),0 5px 0 rgba(200,40,40,.35)}
.opt.right[data-c="yellow"]{box-shadow:0 0 0 4px rgba(255,196,0,.38),0 0 24px rgba(255,196,0,.55),0 5px 0 rgba(190,140,0,.35)}
.opt.right[data-c="green"]{box-shadow:0 0 0 4px rgba(34,211,90,.35),0 0 24px rgba(34,211,90,.55),0 5px 0 rgba(20,140,60,.35)}
.opts.solved .opt:not(.right){opacity:.55;filter:saturate(.6)}
/* the rule, always in view under the choices */
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.2vh,12px);margin-top:9px;padding:0 clamp(7px,1vh,10px);
  font:700 11.5px var(--font-display);color:var(--muted);text-align:center;line-height:1.25}
.legend span{display:block}
.legend .rule{ grid-column:1/-1;font-size:12.5px;color:#7A5B86;letter-spacing:.2px }
@media (hover:none){
  .opt:hover{transform:none;border-color:#F7A0CD;
    box-shadow:inset 0 3px 0 rgba(255,255,255,.99),inset 0 -3px 0 rgba(226,120,178,.20),
               0 5px 0 rgba(240,156,201,.46),0 14px 22px -14px rgba(226,120,178,.80)}
  .opt.right:hover{transform:translateY(-2px)}
}

/* ---- the feedback badge floats in the scene's lower-right corner, clear of the road ---- */
.toast{position:absolute;right:clamp(8px,1.2vw,14px);bottom:clamp(8px,1.2vh,14px);z-index:30;
  display:flex;align-items:center;gap:clamp(5px,.6vw,8px);
  padding:clamp(4px,.6vh,7px) clamp(10px,1.2vw,15px);border-radius:999px;
  background:#fff;border:2.5px solid #7FCB95;box-shadow:0 8px 18px rgba(92,37,99,.25);
  font:700 clamp(13px,2vh,17px) var(--font-display);color:#1B7A45;
  pointer-events:none;white-space:nowrap;animation:toastIn .3s cubic-bezier(.22,1,.36,1) both}
.toast .tic{width:1.35em;height:1.35em;flex:0 0 auto;display:grid;place-items:center}
.toast .tic svg{width:100%;height:100%;display:block}
.toast.again{border-color:var(--pink);color:var(--pink-dk);box-shadow:0 10px 24px rgba(240,26,140,.22)}
.toast.out{animation:toastOut .32s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(.94)}}
@keyframes toastOut{to{opacity:0;transform:translateY(7px) scale(.96)}}
.sr-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===================== OVERLAYS ===================== */
.ov{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px}
.ov.hide{opacity:0;pointer-events:none;transition:opacity .35s}
.ov-box{background:var(--yellow);border:5px solid var(--purple);border-radius:28px;padding:30px 42px;text-align:center;
  max-width:560px;transition:transform .35s cubic-bezier(.22,1,.36,1)}
.ov.hide .ov-box{transform:scale(.9) translateY(10px)}
.ov-box h2{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,4.6vh,40px);color:var(--purple-deep)}
.ov-box h2 b{color:inherit}
.ov-box p{font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--pink);margin:16px 0 24px;
  line-height:1.45;letter-spacing:.4px}
.ov-icons{display:flex;gap:20px;justify-content:center;margin:6px 0 16px}
.ov-icons svg{width:clamp(84px,12vh,112px);height:clamp(84px,12vh,112px);filter:drop-shadow(0 6px 10px rgba(92,37,99,.3));
  animation:iconIn2 .6s cubic-bezier(.34,1.56,.64,1) both, iconFloat 3.4s ease-in-out infinite}
.ov-icons svg:nth-child(1){animation-delay:.05s,1.0s}
.ov-icons svg:nth-child(2){animation-delay:.18s,1.5s}
/* the second symbol floats a beat after the first — the detective-series stagger */
.ov-icons svg:nth-child(3){animation-delay:.30s,2.0s}
.ov-icons svg:nth-child(4){animation-delay:.42s,2.4s}
@keyframes iconIn2{from{opacity:0;transform:translateY(16px) scale(.45)}to{opacity:1;transform:none}}
@keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
/* The single glossy railway-crossing emblem floats gently above the instructions. */
.ov-box.task-in h2{animation:ovRise .5s cubic-bezier(.22,1,.36,1) backwards}
.ov-box.task-in p{animation:ovRise .5s .1s cubic-bezier(.22,1,.36,1) backwards}
.ov-box.task-in .ov-start{animation:ovRise .5s .2s cubic-bezier(.22,1,.36,1) backwards}
@keyframes ovRise{from{opacity:0;transform:translateY(14px)}}
.ov-start{background:var(--pink);color:#fff;border:none;border-radius:18px;padding:13px 36px;
  font:700 21px var(--font-display);box-shadow:0 7px 0 var(--pink-dk);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.ov-start:hover{transform:translateY(-3px);box-shadow:0 10px 0 var(--pink-dk)}
.ov-start .bi{width:1.05em;height:1.05em;vertical-align:-.17em;margin-right:.42em}
.ov-start:active{transform:translateY(4px);box-shadow:0 3px 0 var(--pink-dk)}
.ov-start{position:relative;overflow:hidden;-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
.ov-start::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.10) 40%,rgba(255,255,255,0) 60%)}
.ov-start::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.12)}

.final{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  background:rgba(22,16,22,.45);backdrop-filter:blur(4px)}
.final.show{display:flex}
.final-box{background:#fff;border:5px solid var(--purple);border-radius:28px;padding:32px 42px;text-align:center;max-width:440px;
  margin:16px;animation:finIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes finIn{from{opacity:0;transform:scale(.82) translateY(16px)}to{opacity:1;transform:none}}
.trophy{font-size:66px;line-height:0;display:grid;place-items:center;animation:tp .7s cubic-bezier(.3,1.6,.4,1)}
.trophy svg{width:1em;height:1em;filter:drop-shadow(0 6px 8px rgba(160,110,0,.35))}
@keyframes tp{0%{transform:scale(.3) rotate(-20deg)}100%{transform:scale(1)}}

.final-box h2{font-family:var(--font-display);color:var(--purple);font-size:30px;margin:6px 0}
.tally{font:800 52px var(--font-display);color:var(--pink);line-height:1}
.tally small{font-size:22px;color:var(--purple-deep)}
.final-box p{margin:10px 0 16px;color:var(--muted);font-weight:700}
.again{background:var(--pink);color:#fff;border:none;border-radius:16px;padding:12px 28px;font:700 18px var(--font-display);
  box-shadow:0 6px 0 var(--pink-dk);transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.again:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--pink-dk)}
.again:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-dk)}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden;contain:layout paint}
.confetti i{position:absolute;top:-14px;width:10px;height:14px;border-radius:2px;
  will-change:transform,opacity;backface-visibility:hidden}

/* ===================== THE SCENE ===================== */
.scene{font-family:var(--font-display)}
.scene text{user-select:none}
.veh{will-change:transform}
.veh .brk{opacity:0;transition:opacity .25s ease}
.veh.braking .brk{opacity:1}
.veh .hl{opacity:.9}
/* the sky is alive: clouds drift, birds flap, the sun glows */
.drift{animation:drift 38s ease-in-out infinite alternate}
.drift.d2{animation-duration:46s;animation-delay:-17s}
.drift.d3{animation-duration:54s;animation-delay:-31s}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
/* trees breathe in the breeze */
.tree .cnp{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5.6s ease-in-out infinite}
.tree:nth-of-type(2n) .cnp{animation-duration:6.4s;animation-delay:-2.1s}
.tree:nth-of-type(3n) .cnp{animation-duration:7.1s;animation-delay:-3.7s}
@keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
/* the signal lamps */
.slamp .on,.slamp .halo{opacity:0;transition:opacity .28s ease}
.slamp.lit .on,.slamp.lit .halo{opacity:1}
.slamp.lit .halo{animation:haloPulse 1.6s ease-in-out infinite}
@keyframes haloPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.slamp .halo{transform-box:fill-box;transform-origin:50% 50%}
.spill{opacity:0;transition:opacity .4s ease}
.spill.lit{opacity:.42}
/* horns */
.honk{transform-box:fill-box;transform-origin:50% 100%;animation:honkPop 1.25s cubic-bezier(.22,1,.36,1) both}
@keyframes honkPop{0%{opacity:0;transform:scale(.3) translateY(6px)}18%{opacity:1;transform:scale(1.08)}
  30%{transform:scale(1)}78%{opacity:1;transform:translateY(-6px)}100%{opacity:0;transform:translateY(-12px)}}
/* little puffs from the exhausts */
.puff{animation:puff 1.4s ease-out both}
@keyframes puff{0%{opacity:.55;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx,4px),18px) scale(1.6)}}

.opt,.banner,.ov-start,.again{touch-action:manipulation}
@media (prefers-reduced-motion:reduce){

  .drift{animation:none!important}

     their little light pulses rest at a steady brightness */
  .ov-icons svg{animation:none!important;opacity:1!important}

/* narrow portrait windows (any device): the two cards sit side by side under the
   scene, so the scene keeps its height; only very narrow windows stack them */

  .rightcol{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;align-items:stretch}

  .rightcol{grid-template-columns:minmax(0,1fr)}
}
/* portrait tablets: the scene over the two cards, side by side */
@media(max-width:940px) and (orientation:portrait){
  /* the scene row takes every spare pixel, but it can never be crushed: minmax(min-content,1fr)
     will not shrink below the picture's own height, and when the activity really does not fit
     (short phones) the whole card scrolls as one surface — nothing is ever cut off */
  html[data-layout-mode="auto-fit"] .layout{grid-template-columns:minmax(0,1fr);
    grid-template-rows:minmax(min-content,1fr) max-content;gap:10px;padding:10px;

/* ===================== PATTERN & SEQUENCE 8.0 =====================
   The strip of lights the child is watching, the "you are the signal" pads,
   the optional Arduino bridge.                                          */

/* the level chip in the topbar */
.topbar .lv{ margin-left:auto;font-family:var(--font-display);font-weight:700;
  font-size:clamp(11px,1.5vh,14px);color:#fff;background:var(--purple);border-radius:999px;
  padding:5px 14px;white-space:nowrap;letter-spacing:.3px }

/* ---- the light strip: every light the cycle has shown, then "?" ---- */
.pstrip{ position:absolute;left:50%;bottom:clamp(8px,1.5vh,15px);transform:translateX(-50%);z-index:6;
  display:flex;align-items:center;gap:clamp(4px,.85vh,8px);
  padding:clamp(6px,.9vh,9px) clamp(10px,1.4vh,16px);border-radius:999px;max-width:94%;
  border:2.5px solid rgba(131,53,140,.42);
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(248,239,252,.95));
  box-shadow:0 10px 24px -12px rgba(60,20,70,.62),inset 0 2px 0 #fff;
  /* no backdrop blur here: the strip sits over the moving scene, so blurring it
     would make the browser re-blur the traffic on every single frame        */
  cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1) }
.pstrip:hover{ transform:translateX(-50%) translateY(-2px) }
.pstrip:focus-visible{ outline:3px solid var(--purple);outline-offset:3px }
.pstrip .bead{ flex:0 0 auto;width:clamp(15px,2.5vh,25px);height:clamp(15px,2.5vh,25px);border-radius:50%;
  background:radial-gradient(circle at 42% 36%,#E9E0EE 0%,#CFC2D8 58%,#B2A2BE 100%);
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.16),inset 0 1px 1px rgba(255,255,255,.7);
  transition:background .28s ease,box-shadow .28s ease,transform .28s cubic-bezier(.34,1.56,.64,1) }
.pstrip .bead.lit{ transform:scale(1.08) }
.pstrip .bead.red{ background:radial-gradient(circle at 42% 36%,#FFE3E0 0%,#FF5A4E 32%,#E5121B 72%,#9E0610 100%);
  box-shadow:0 0 15px 4px rgba(255,45,45,.62),inset 0 -2px 3px rgba(120,0,0,.4) }
.pstrip .bead.yellow{ background:radial-gradient(circle at 42% 36%,#FFFBE0 0%,#FFD84A 32%,#FFB300 72%,#A87400 100%);
  box-shadow:0 0 15px 4px rgba(255,196,0,.62),inset 0 -2px 3px rgba(130,80,0,.38) }
.pstrip .bead.green{ background:radial-gradient(circle at 42% 36%,#E6FFEC 0%,#5BEA86 32%,#14B94A 72%,#07752C 100%);
  box-shadow:0 0 15px 4px rgba(34,211,90,.58),inset 0 -2px 3px rgba(0,80,30,.38) }
.pstrip .sep{ flex:0 0 auto;width:clamp(8px,1.3vh,13px);height:2px;border-radius:2px;background:#C9B6D4;opacity:.7 }
.pstrip .bead.q{ width:clamp(23px,3.5vh,33px);height:clamp(23px,3.5vh,33px);display:grid;place-items:center;
  font:700 clamp(13px,2vh,18px) var(--font-display);color:#B01268;
  background:linear-gradient(180deg,#FFF,#FFE9F5);border:2.5px dashed #F06BAE;
  box-shadow:0 0 12px -2px rgba(240,26,140,.45) }
.pstrip .bead.hint{ animation:beadHint 1.5s ease-in-out infinite;border-color:#F01A8C;color:#8C0F55 }
.pstrip .scan{ flex:0 0 auto;width:clamp(9px,1.4vh,13px);height:clamp(9px,1.4vh,13px);border-radius:50%;
  background:var(--pink);box-shadow:0 0 0 0 rgba(240,26,140,.5);animation:scanPing 1.4s ease-out infinite }
@keyframes beadHint{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.14) } }
@keyframes scanPing{ 0%{ opacity:.55;transform:scale(1) } 100%{ opacity:0;transform:scale(1.5) } }

/* ---- the kit: the Distance Detective status line + Connect button ---- */
.ctrl{flex:0 0 auto;display:flex;flex-direction:column;padding:14px 16px 16px}
.conn{display:flex;align-items:center;gap:8px;background:#F7F2F8;border-radius:10px;padding:6px 12px;
  font:700 12.5px var(--font-display);color:var(--muted);margin:0 0 8px;border:1px solid #EBE2EE}
.conn .dot{width:10px;height:10px;flex:0 0 auto;border-radius:50%;background:#C9C2D6;
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.15);transition:background .25s,box-shadow .25s}
.conn .dot.on{background:var(--ok);box-shadow:0 0 9px rgba(47,191,109,.85)}
.btn{width:100%;border:none;border-radius:12px;padding:9px 12px;font:700 14px var(--font-display);cursor:pointer;
  transition:transform .16s cubic-bezier(.22,1,.36,1),filter .16s cubic-bezier(.22,1,.36,1),box-shadow .16s cubic-bezier(.22,1,.36,1)}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:translateY(2px)}
.btn:disabled{cursor:default;filter:grayscale(.5) brightness(.92);transform:none}
.btn-pink{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pink-dk)}
.btn-pink:active{box-shadow:0 1px 0 var(--pink-dk)}
.ctrl .btn{position:relative}
.ctrl .btn::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.10) 40%,rgba(255,255,255,0) 60%)}
.ctrl .btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.12)}
/* the "look at me" pulses travel as a ring: only transform and opacity change,
   so the button itself is never repainted (this one pulses all session) */
.ctrl .btn>.pulse{position:absolute;inset:-3px;border-radius:inherit;border:3px solid transparent;opacity:0;pointer-events:none;z-index:0}
#connBtn.attn .pulse{border-color:rgba(240,26,140,.55);animation:ringPulse 2.2s cubic-bezier(.45,0,.55,1) infinite}
.ctrl .btn-ir.attn .pulse{border-color:rgba(255,210,63,.72);animation:ringPulse 1.6s cubic-bezier(.45,0,.55,1) infinite}
@keyframes ringPulse{0%{opacity:.55;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.08)}}

/* when the kit is on, the pads say so */
.opts.kit .opt::before{ box-shadow:inset 0 0 0 2px rgba(47,191,109,.35) }

/* ---- auto-fit trims ---- */
html[data-layout-mode="auto-fit"] .topbar .lv{ font-size:10.5px;padding:4px 10px }
html[data-layout-mode="auto-fit"] .pstrip{ bottom:6px;gap:4px;padding:5px 9px }
html[data-layout-mode="auto-fit"] .pstrip .bead{ width:13px;height:13px }
html[data-layout-mode="auto-fit"] .pstrip .bead.q{ width:20px;height:20px;font-size:11.5px }
@media (max-width:520px){ .topbar .lv{ display:none } }


/* ===== ultra-smooth pass ===== */
:root{--ease-out:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.4,.64,1)}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;scroll-behavior:smooth}
*{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.scene{contain:layout paint;transform:translateZ(0);backface-visibility:hidden;shape-rendering:geometricPrecision}
/* blur behind moving traffic / buttons is the costliest thing on the page: the surfaces are near-opaque, so drop it */
.opt,.banner{-webkit-backdrop-filter:none;backdrop-filter:none}
.opt{transition:transform .32s var(--spring),box-shadow .3s var(--ease-out),opacity .35s var(--ease-out),filter .35s var(--ease-out),background-color .3s}
.btn,.ov-start,.again{transition:transform .28s var(--spring),box-shadow .28s var(--ease-out),filter .25s var(--ease-out)}
.card{transition:box-shadow .35s var(--ease-out),transform .35s var(--ease-out)}
.ov-box,.final-box{animation:boxIn .55s var(--spring) both}
@keyframes boxIn{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
.ov{transition:opacity .4s var(--ease-out)}
.ov-box{transition:transform .4s var(--ease-out)}
@media (prefers-reduced-motion:reduce){.ov-box,.final-box{animation:none!important}}

.optcard .sig-status{margin-bottom:0;font-size:clamp(16.5px,2.36vh,20.1px)}   /* status line: +18% */
html[data-layout-mode="auto-fit"] .sig-status{font-size:15.9px}
@media(max-width:480px) and (orientation:portrait){html[data-layout-mode="auto-fit"] .sig-status{font-size:14.8px}}
@media(orientation:landscape) and (max-height:540px){.eyebrow{font-size:10.9px}.optcard .sig-status{font-size:14.8px}}

/* Connect Arduino: exactly the original glass-pink button and press feel */
#connBtn{

/* Hear the question: bright yellow slab with a darker lip, black rounded type */
.ctrl .btn-hear{display:flex;align-items:center;justify-content:center;gap:12px;background:#FFF012;color:#141414;
  font:700 clamp(19px,2.9vh,25px) var(--font-display);letter-spacing:.2px;border-radius:22px;

/* the four cells are positional: the script deals the choices into slots 0-3
   (process order for the very first game, a fresh shuffle for every game after) */
#opts{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"s0 s1" "s2 s3"}

#opts .opt[data-slot="2"]{grid-area:s2}#opts .opt[data-slot="3"]{grid-area:s3}
.lens.ic{display:grid;place-items:center;font-size:clamp(18px,3.3vh,30px);line-height:1}

.lens.rinse{background:radial-gradient(circle at 42% 36%,#DFFFFB 0%,#43DCD2 38%,#0EA9B4 76%,#07646C 100%)}
.lens.spin{background:radial-gradient(circle at 42% 36%,#F3DDF7 0%,#B466C2 38%,#83358C 76%,#4A1A52 100%)}
.lens.done{background:radial-gradient(circle at 42% 36%,#C9FFD6 0%,#4FE07C 34%,#12A844 72%,#066A28 100%)}
.opt.right[data-c="wash"]{box-shadow:0 0 0 4px rgba(46,155,234,.35),0 0 24px rgba(46,155,234,.55),0 5px 0 rgba(20,100,170,.35)}
.opt.right[data-c="rinse"]{box-shadow:0 0 0 4px rgba(20,194,201,.35),0 0 24px rgba(20,194,201,.55),0 5px 0 rgba(10,120,125,.35)}
.opt.right[data-c="spin"]{box-shadow:0 0 0 4px rgba(131,53,140,.32),0 0 24px rgba(131,53,140,.5),0 5px 0 rgba(80,30,90,.35)}
.opt.right[data-c="done"]{box-shadow:0 0 0 4px rgba(34,211,90,.35),0 0 24px rgba(34,211,90,.55),0 5px 0 rgba(20,140,60,.35)}
.chip{font-size:clamp(18px,3.2vh,26px);line-height:1}

.pstrip{gap:clamp(6px,1.2vh,12px)}
.pstrip .chip{margin:0}
/* the scene: one data-s attribute (wait · called · open · floor · close · exit) drives the pictures.
   The car and the doors move with CSS transitions the script times (--cy is the car's floor,
   --ct how long the ride takes); the people move with keyframes whose end pose is the base
   style, so a reduced-motion device simply shows each finished picture. */
.cl{animation:cdrift 44s linear infinite alternate}@keyframes cdrift{to{transform:translateX(70px)}}
@keyframes twk{50%{opacity:.2;transform:scale(.5)}}
.car,.ride{transition:transform var(--ct,0ms) cubic-bezier(.45,.05,.3,1)}
.car{transform:translateY(var(--cy,0px))}
.cab{transform-box:view-box;transform-origin:0 196px;transform:scaleY(var(--cab,1));transition:transform var(--ct,0ms) cubic-bezier(.45,.05,.3,1)}
.cw{transform:translateY(calc(-1*var(--cy,0px)));transition:transform var(--ct,0ms) cubic-bezier(.45,.05,.3,1)}
.cwc{transform-box:view-box;transform-origin:0 196px;transform:scaleY(var(--cwc,10));transition:transform var(--ct,0ms) cubic-bezier(.45,.05,.3,1)}
#scene[data-in="1"] .ride{transform:translateY(var(--cy,0px))}
.dL,.dR{transition:transform 1.1s cubic-bezier(.45,0,.2,1)}
#scene[data-door="1"] .dL{transform:translateX(-70px)}
#scene[data-door="1"] .dR{transform:translateX(70px)}
.arrU,.arrD{opacity:0;transition:opacity .3s}
#scene[data-dir="up"] .arrU,#scene[data-dir="down"] .arrD{opacity:1}
.cbh{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
#scene[data-s="called"] .cb{fill:#FFC400;stroke:#B07A00;transition:fill 0s .35s,stroke 0s .35s}            /* lights the moment her hand gets there */
#scene[data-s="called"] .cbh{opacity:.55;transition:opacity .2s .35s;animation:haloPulse 1.2s ease-in-out .35s infinite}
.fb{transition:fill .25s}.fb.lit{fill:#FFC400;stroke:#B07A00}
/* the kid: waiting in the lobby, the walk in, the ride, the walk out, the wave */
.kidWalk{transform:translateX(0)}

/* Keep the auto-fit shell inside the actually visible viewport when mobile browser chrome moves. */
(function(){
  const el=document.documentElement;
  function sizeToViewport(){
    try{
      const vv=window.visualViewport;
      const h=Math.round(vv?(vv.height*(vv.scale||1)):window.innerHeight);
      if(h>0)el.style.setProperty('--vvh',h+'px');
    }catch(e){}
  }
  sizeToViewport();
  addEventListener('resize',sizeToViewport,{passive:true});
  addEventListener('orientationchange',sizeToViewport,{passive:true});
  if(window.visualViewport){
    visualViewport.addEventListener('resize',sizeToViewport,{passive:true});
    visualViewport.addEventListener('scroll',sizeToViewport,{passive:true});
  }
})();

<script>
/* ===================== SMART BLOCK · TAKING A LIFT =====================
   Five steps, one everyday sequence the child learns to predict:

        🔘 Press the button → 🚪 Open door → 🔢 Select floor → 🚪 Close door → 🚶 Exit

   Step 1 calls the lift (IR sensor or the + Call lift button): the car comes down and
   the doors wait. Steps 2–5 ask "what comes next?" and the scene does what the child
   chose: the doors open and the kid walks in, she presses her floor, the doors close and
   the lift rides up (the indicator counts the floors), then the doors open and she
   walks out. The floor the kid wants changes from game to game.
   The kit is optional. Arduino (Uno / Nano, 9600 baud):
     board → page : "DETECTED"  (IR sensor saw a hand at the lift button)
     page → board : P called LED · D door LED · F floor LED · C close LED · E exit LED · O all off  */
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const motion=matchMedia('(prefers-reduced-motion: reduce)');
const NS='http://www.w3.org/2000/svg';
const easeOutCubic=t=>1-Math.pow(1-t,3);


const TOTAL=5;
const CH={off:'O',called:'P',open:'D',floor:'F',close:'C',exit:'E'};
const FLOW=['load','open','floor','close','exit'], ORDER=['open','floor','close','exit'];
const CYCLE_TEXT='Order : Press button - Open door - Select floor - Close door - Exit';
const NAME='The kid',NAMEL='the kid',LBL=['G','1','2','3'];
let floor=3;                                      /* the floor the kid wants this game (1-3, never the same twice running) */
const n={stage:$('stage'),banner:$('banner'),status:$('sigStatus'),opts:$('opts'),live:$('live'),strip:$('pstrip'),optTitle:$('optTitle')};
const optEls=[...document.querySelectorAll('.opt')];
/* the banner is a flex box on phones (vertical centring) - one inline wrapper keeps the spaces between its words */
const setBanner=h=>{n.banner.innerHTML='<span class="bt">'+h+'</span>';};
/* ---------- the order of the four choices ----------
   The very first game on this device shows them in process order - a worked example.
   Every game after that (a refresh, or Play again) deals them out at random, so the
   child has to know what comes next rather than read it off the tiles.            */
const GROW_ORDER=['open','floor','close','exit'];
let optOrder=GROW_ORDER.slice();                  /* which answer sits in slot 0..3 */
const playedBefore=()=>{try{return localStorage.getItem('lift-played')==='1';}catch(e){return false;}};
const markPlayed=()=>{try{localStorage.setItem('lift-played','1');}catch(e){}};
function dealOptions(shuffle){
  let order=GROW_ORDER.slice();
  if(shuffle){
    let last=optOrder.join(',');try{last=localStorage.getItem('lift-order')||last;}catch(e){}   /* last game's order, even across a refresh */
    let guard=0;
    do{                                            /* Fisher-Yates; never the textbook order, never the same deal twice running */
      for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
    }while((order.join(',')===GROW_ORDER.join(',')||order.join(',')===last)&&++guard<40);
    try{localStorage.setItem('lift-order',order.join(','));}catch(e){}
  }
  optOrder=order;
  order.forEach((c,i)=>{const b=optEls.find(x=>x.dataset.c===c);b.dataset.slot=i;n.opts.appendChild(b);});   /* DOM order = visual order (tab order, screen readers) */
}
let round=0,score=0,tries=0,phase='intro',started=false,justDone=-1,epoch=0,timers=[],audio=null,speech=null,light='off',stripDone=0,stripPop=-1;
let lastSay='Help the kid take the lift. Say what comes next.';
function later(fn,ms){const e=epoch;const id=setTimeout(()=>{if(e===epoch)fn();},ms);timers.push(id);return id;}
function clearTimers(){timers.forEach(clearTimeout);timers=[];}
/* ---------- sound ---------- */
function ctx(){
  try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();
    if(audio.state==='suspended')audio.resume();}catch(e){audio=null;}
  return audio;
}
function tone(freq,duration=.12,delay=0,type='sine',vol=.06){
  const a=ctx();if(!a)return;
  try{
    const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+.015);
    g.gain.exponentialRampToValueAtTime(.0001,t+duration);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+duration+.03);
  }catch(e){}
}
function sweep(f0,f1,duration,type='sawtooth',vol=.035,delay=0){
  const a=ctx();if(!a)return;
  try{
    const o=a.createOscillator(),g=a.createGain(),lp=a.createBiquadFilter(),t=a.currentTime+delay;
    o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+duration);
    lp.type='lowpass';lp.frequency.value=900;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.08);
    g.gain.exponentialRampToValueAtTime(.0001,t+duration);
    o.connect(lp);lp.connect(g);g.connect(a.destination);o.start(t);o.stop(t+duration+.05);
  }catch(e){}
}
const rightSnd=()=>{tone(523,.16,0,'triangle',.1);tone(659,.16,.12,'triangle',.1);tone(784,.3,.24,'triangle',.12);};
const wrongSnd=()=>{tone(250,.2,0,'sawtooth',.06);tone(220,.3,.2,'sawtooth',.06);};
const clickSnd=()=>{tone(1500,.03,0,'square',.025);tone(950,.05,.035,'square',.02);};    /* the signal's relay */
const hornSnd=()=>{tone(415,.08,0,'square',.018);tone(415,.11,.13,'square',.018);};
const vroomSnd=()=>{sweep(60,180,.95,'sawtooth',.03);};
function cheerSnd(){

  tone(1047,.5,.44,'triangle',.085);tone(1319,.44,.6,'sine',.05);
}

/* ---------- speech: read on arrival; tap the banner (or press H) to hear it again ---------- */
function stopSpeech(){
  if(speech){speech.onend=speech.onerror=null;speech=null;}
  if('speechSynthesis' in window)try{speechSynthesis.cancel();}catch(e){}
}
function speak(text){
  if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window))return;
  stopSpeech();
  const u=new SpeechSynthesisUtterance(text);
  speech=u;u.lang='en';u.rate=.9;u.pitch=1.08;
  u.onend=u.onerror=()=>{if(speech===u)speech=null;};
  try{speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){}
}
function announce(t){n.live.textContent='';setTimeout(()=>{n.live.textContent=t;},30);}

/* ---------- small animation helpers ---------- */
function pop(el,frames,dur){
  if(!el||motion.matches||!el.animate)return;
  try{el.animate(frames,{duration:dur,easing:'cubic-bezier(.22,1,.36,1)'});}catch(e){}
}
function confetti(count){
  if(motion.matches)return;
  const shell=document.createElement('div');shell.className='confetti';
  const colors=['#83358C','#F01A8C','#FFF212','#2FBF6D','#70CDF0'];
  for(let i=0;i<count;i++){
    const s=document.createElement('i');
    s.style.left=Math.random()*100+'vw';
    s.style.background=colors[i%colors.length];
    s.style.animation=`cf${i%3} ${1.5+Math.random()*.7}s linear ${Math.random()*.3}s forwards`;
    shell.appendChild(s);
  }
  const st=document.createElement('style');
  st.textContent='@keyframes cf0{to{transform:translate3d(0,105vh,0) rotate(720deg);opacity:.9}}'+
    '@keyframes cf1{to{transform:translate3d(0,105vh,0) rotate(-540deg);opacity:.9}}'+
    '@keyframes cf2{to{transform:translate3d(0,105vh,0) rotate(360deg);opacity:.9}}';
  shell.appendChild(st);document.body.appendChild(shell);
  setTimeout(()=>shell.remove(),2400);
}

const TIC_OK='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#2FBF6D"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const TIC_AGAIN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#FFC21A"/><circle cx="12" cy="12" r="11" fill="none" stroke="#E0A400" stroke-width="1.2"/><path d="M9.2 9.3a2.9 2.9 0 1 1 3.9 2.7c-.8.4-1.1.9-1.1 1.7v.5" fill="none" stroke="#5C2563" stroke-width="2.3" stroke-linecap="round"/><circle cx="12" cy="17.6" r="1.4" fill="#5C2563"/></svg>';

}


/* ---------- the sounds of a lift ---------- */
const ding=()=>{tone(1319,.4,0,'sine',.07);tone(1760,.55,.14,'sine',.05);};
const hum=d=>{tone(88,d,0,'sawtooth',.012);tone(176,d,0,'sine',.016);};               /* the motor, fading as it goes */
const doorSnd=open=>sweep(open?320:140,open?140:320,.7,'sine',.022);
const beep=()=>tone(1200,.1,0,'square',.03);
const steps=()=>[0,.26,.52,.78,1.04].forEach(d=>tone(260,.04,d,'square',.012));
const SFX={open:()=>doorSnd(true),floor:()=>{},close:()=>doorSnd(false),exit:()=>doorSnd(true)};
/* ---------- the words: built for the floor the kid wants ---------- */
let ASK={},HINT={},OK={};
function words(f){
  ASK={
    load:   {banner:'Press <b>+ Call lift</b> to call the lift',status:`${NAME} wants to go to <b>floor ${f}</b>.`,say:`The kid wants to go to floor ${f}. Press the Call lift button to call the lift.`},
    loadKit:{banner:'Put your <b>hand</b> near the sensor to call the lift',status:`${NAME} wants to go to <b>floor ${f}</b>.`,say:`The kid wants to go to floor ${f}. Put your hand near the sensor to call the lift.`},
    open:   {banner:'The lift has arrived. What comes next?',status:'The lift is here. The doors are <b>closed</b>.',say:'The lift has arrived. What comes next?'},
    floor:  {banner:`${NAME} is inside the lift. What comes next?`,status:`${NAME} is <b>inside</b> the lift.`,say:'The kid is inside the lift. What comes next?'},
    close:  {banner:`Floor ${f} is pressed. What comes next?`,status:`The <b>floor ${f}</b> button is lit.`,say:`Floor ${f} is pressed. What comes next?`},
    exit:   {banner:`The lift has reached floor ${f}. What comes next?`,status:`The lift has <b>stopped</b> at floor ${f}.`,say:`The lift has reached floor ${f}. What comes next?`}
  };
  HINT={
    open:'Not yet! The lift has arrived, so open the door first. Choose Open door.',
    floor:`Not yet! Inside the lift, press the floor ${f} button. Choose Select floor.`,
    close:'Not yet! Close the door so the lift can move. Choose Close door.',
    exit:`Not yet! The lift has stopped at floor ${f}. Now step out. Choose Exit.`
  };
  OK={

function travel(from,to,start,per,arrived){
  const dir=to>from?'up':'down',nfl=Math.abs(to-from),dur=nfl*per;
  later(()=>{carTo(to,dur);ind(from,dir);hum(dur/1000);sc().classList.add('moving');},start);
  for(let i=1;i<nfl;i++){const f=from+(dir==='up'?i:-i);later(()=>{ind(f,dir);sayStatus(`Going ${dir}… passing <b>floor ${LBL[f]}</b>.`);},start+(i-.4)*per);}

function liftCalled(){

  phase='react';stripDone=1;stripPop=0;renderStrip();

function choose(c){
  if(phase==='loadwait'){toast('again',kitOn?'Call the lift first!':'Press + Call lift!');speak(kitOn?'Put your hand near the sensor to call the lift first.':'Press the Call lift button first.');return;}
  if(phase!=='ask')return;
  const btn=optEls.find(b=>b.dataset.c===c);
  if(!btn||btn.classList.contains('used'))return;
  const want=FLOW[round];
  if(c!==want){
    tries++;btn.classList.add('used','nope');btn.disabled=true;
    setTimeout(()=>btn.classList.remove('nope'),560);wrongSnd();
    const msg=ORDER.indexOf(c)<ORDER.indexOf(want)?'That one already happened. What comes after it?':HINT[want];
    toast('again','Try again!');speak('Try again.');announce(msg);
    return;
  }
  phase='react';
  n.opts.classList.remove('live');n.opts.classList.add('solved');btn.classList.add('right');
  stripDone=round+1;stripPop=round;renderStrip();
  if(tries===0)score++;

async function listenIR(rd,token){

        const line=buf.slice(0,i).trim().toUpperCase();

/* ---------- layout mode (laptop vs touch auto-fit) ---------- */
/* the laptop layout is only for a desktop-class device with a fine, hovering pointer and a

   touch-first screens and small or tablet-shaped windows use the auto-fit shell, where the

/* a phone or tablet by platform (an iPad in desktop mode calls itself a Mac with touch points) */
const HANDHELD=(()=>{try{const ua=navigator.userAgent||'';return /Android|iPhone|iPad|iPod|Mobile|Tablet|Silk|Kindle/i.test(ua)||(navigator.maxTouchPoints>1&&/Mac/i.test(navigator.platform||''))||!!(navigator.userAgentData&&navigator.userAgentData.mobile);}catch(e){return false;}})();

/* ---------- framing the scene: the whole building stays in view. On a laptop the step strip

const stageBox=document.querySelector('.stage'),fxLight=stageBox.querySelector('.fx-light');
function fitScene(){
  const auto=document.documentElement.dataset.layoutMode==='auto-fit';

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <script>
  /* SmartBlock pre-paint bootstrap: detect language, hide untranslated content, and preload
     ONLY the global + mode translation files (page-wise structure) before first paint.
     Uses sessionStorage key smartblock_language (visit-scoped) and admin translation cache. */
  (function () {
    try {
      var SB = window.SB = window.SB || {};
      SB.SECTION = 'mode';
      SB.lang = (function () { try { return (sessionStorage.getItem('smartblock_language') || sessionStorage.getItem('smartblock_lang') || 'en'); } catch (e) { return 'en'; } })();
      SB.TRANS_PREFIX = 'smartblock_translations_';
      var docEl = document.documentElement;
      docEl.classList.add('sb-app-loading');
      SB.reveal = function () { try { docEl.classList.remove('sb-app-loading'); } catch (e) {} };
      SB._revealTimer = setTimeout(function () { SB.reveal(); }, 3000);
      SB.preloadPage = function (href) { try { if (!href) return; var l = document.createElement('link'); l.rel = 'prefetch'; l.as = 'document'; l.href = href; document.head.appendChild(l); } catch (e) {} };

      SB._cache = {};
      async function fetchFile(file) {
        var controller = new AbortController();
        var timer = setTimeout(function () { controller.abort(); }, 1200);
        try {
          var response = await fetch(file, { cache: 'no-cache', signal: controller.signal });
          if (!response.ok) return null;
          return await response.json();
        } catch (_) { return null; }
        finally { clearTimeout(timer); }
      }
      /* Admin-panel translations (localStorage override key) always take precedence when present. */
      function adminObj() {
        try { var s = localStorage.getItem(SB.TRANS_PREFIX + SB.lang); if (s) { var o = JSON.parse(s); return (o && typeof o === 'object') ? o : null; } } catch (e) {}
        return null;
      }
      function section(name, lang) {
        var key = name + '/' + lang;
        if (SB._cache[key]) return SB._cache[key];
        SB._cache[key] = (async function () {
          // Physical translation files are the source of truth: fetch first (no-store).
          var o = await fetchFile('../translations/' + name + '/' + lang + '.json');
          if ((!o || Object.keys(o).length === 0) && lang !== 'en') o = await fetchFile('../translations/' + name + '/en.json');
          if (o && Object.keys(o).length > 0) return o;
          // Fallback ONLY when the server is unreachable/empty (e.g. file:// offline): use cached admin copy.
          var admin = adminObj();
          if (admin && admin[name]) return admin[name];
          return {};
        })();
        return SB._cache[key];
      }
      SB.preloadTrans = function (lang) {
        lang = lang || SB.lang;
        var g = Promise.all([section('global', lang), section(SB.SECTION, lang)]).then(function (r) {
          var merged = { global: r[0] || {} }; merged[SB.SECTION] = r[1] || {}; return merged;
        });
        return g;
      };

      SB.preloadTrans(SB.lang);
      SB.preloadPage('world.html');
    } catch (e) {
      try { document.documentElement.classList.remove('sb-app-loading'); } catch (err) {}
    }
  })();
  </script>

  <title>SmartBlock - Exploration Mode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #83358C;
      --purple-deep: #5B2463;
      --pink: #F01A8C;
      --yellow: #FFF212;
      --black: #000000;
      --dark-white: #FAF8FC;
      --white: #FFFFFF;
      --border: #E7D9EA;
      --text: #171217;
      --muted: #6B626D;
      --shadow: 0 12px 30px -18px rgba(131, 53, 140, 0.28);
      --shadow-hover: 0 24px 44px -20px rgba(131, 53, 140, 0.42);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--dark-white);
      color: var(--text);
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .topbar {
      flex: 0 0 auto;
      height: clamp(62px, 8vh, 76px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 8px clamp(12px, 2vw, 24px);
      border-bottom: 3px solid var(--purple);
      background: var(--yellow);
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
    }

    .topbar .brand {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-shrink: 0;
      text-decoration: none;
      cursor: pointer;
    }
    .topbar .brand:focus-visible {
      outline: 2px solid var(--purple);
      outline-offset: 4px;
      border-radius: 4px;
    }
    .topbar .brand-logo {
      height: 34px;
      width: auto;
      display: block;
    }

    /* Matching softly squared glass labels; informational, not buttons. */
    .progress-mini {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid rgba(131,53,140,.18);
      -webkit-backdrop-filter: blur(12px) saturate(1.15);
      backdrop-filter: blur(12px) saturate(1.15);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9),
        inset 0 -1px 0 rgba(131,53,140,.045),
        0 3px 8px -5px rgba(92,37,99,.2);
    }
    .progress-mini {
      min-height: 30px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 12px;
      line-height: 1.35;
      color: var(--purple-deep);
      background: linear-gradient(155deg, rgba(255,255,255,.88),
        rgba(255,253,207,.76) 65%, rgba(255,255,255,.64));
      padding: 6px 12px;
      white-space: nowrap;
    }

    .wrap {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 20px 24px;
    }

    .hero-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
      text-align: center;
      max-width: 880px;
      margin: 12px auto 16px;
    }

    .custom-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: 'Fredoka', sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: #F3E8F5 !important;
      color: #83358C !important;
      border: 1.5px solid rgba(131, 53, 140, 0.28) !important;
      padding: 5px 16px !important;
      border-radius: 999px !important;
      margin-bottom: 12px !important;
      box-shadow: 0 4px 10px -4px rgba(131, 53, 140, 0.12);
      align-self: flex-start;
    }

    .custom-badge .badge-dot {
      width: 7.5px;
      height: 7.5px;
      border-radius: 50%;
      background: #F01A8C !important;
      display: inline-block;
      flex-shrink: 0;
    }

    .hero-card .custom-badge {
      margin: 0 auto 14px auto;
      align-self: center;
    }

    .hero-card h1 {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(22px, 4vw, 32px);
      color: var(--purple);
    }

    .hero-card h1 span {
      color: var(--pink);
    }

    .hero-card p {
      color: var(--muted);
      font-size: clamp(12.5px, 2.5vw, 14px);
      margin-top: 8px;
      line-height: 1.5;
    }

    .big-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
      max-width: 900px;
      margin: 14px auto;
    }

    .big-card {
      background: var(--white);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 24px 22px;
      box-shadow: var(--shadow);
      cursor: default;
      transition: all 0.22s ease;
      position: relative;
      overflow: hidden;
      text-align: left;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .big-card .accent {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
    }

    .big-card .icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .big-card h3 {
      font-family: 'Fredoka', sans-serif;
      font-size: 20px;
      color: var(--purple-deep);
      margin-bottom: 6px;
      width: 100%;
    }

    .big-card p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 16px;
      flex-grow: 1;
      width: 100%;
    }

    @media (max-width: 768px) {
      .wrap { padding: 16px 16px; }
      .hero-card { padding: 22px 16px; border-radius: 20px; }
      .big-grid { grid-template-columns: 1fr; gap: 16px; }
    }
    .glass-btn {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 16.065px;
      min-height: 61.425px;
      max-width: 100%;
      padding: 11.34px 14.175px 11.34px 27.405px;
      overflow: hidden;
      border: 1px solid rgba(232,188,243,.45);
      border-radius: 999px;
      background:
        radial-gradient(ellipse at 85% 100%, rgba(183,37,135,.2), transparent 65%),
        linear-gradient(155deg, #773080 0%, #702578 48%, #762171 100%);
      color: var(--white);
      font: 600 17.2935px/1.3 'Fredoka', sans-serif;
      text-shadow: 0 1px 2px rgba(39,8,46,.2);
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow:
        inset 0 1px 0 rgba(244,202,255,.30),
        inset 0 -2px 4px rgba(39,8,46,.24),
        0 5px 0 #46154F,
        0 13px 23px -9px rgba(92,26,105,.42);
      transition: transform 180ms cubic-bezier(.22,1,.36,1);
    }
    /* Fixed glass highlight: no expensive continuously animated blur. */
    .glass-btn::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 25% 0%, rgba(255,255,255,.035), transparent 68%),
        linear-gradient(180deg, rgba(255,255,255,.07),
          rgba(255,255,255,.018) 42%, transparent 60%);
      box-shadow: inset 0 0 0 1px rgba(235,176,246,.12);
    }
    .glass-btn::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: -60% -25%;
      pointer-events: none;
      background: linear-gradient(110deg, transparent 38%, rgba(255,255,255,.13) 50%, transparent 62%);
      transform: translateX(-100%);
    }
    @media (hover: hover) and (pointer: fine) {
      .glass-btn:not(:disabled):hover {
        transform: translateY(-3px);
        box-shadow: inset 0 1px 0 rgba(244,202,255,.3),
          inset 0 -2px 4px rgba(39,8,46,.24), 0 8px 0 #46154F,
          0 18px 28px -10px rgba(92,26,105,.45);
      }
      .glass-btn:not(:disabled):hover::after { animation: glassSweep 650ms ease-out; }
      .glass-btn:not(:disabled):hover .arr { transform: translateX(3px); }
    }
    @keyframes glassSweep { to { transform: translateX(100%); } }
    .glass-btn:focus-visible {
      outline: 3px solid var(--purple-deep);
      outline-offset: 6px;
    }
    .glass-btn:not(:disabled):active, .glass-btn.is-leaving {
      transform: translateY(3px) scale(.98);
      box-shadow: inset 0 1px 0 rgba(244,202,255,.2),
        inset 0 -1px 3px rgba(39,8,46,.24), 0 2px 0 #46154F,
        0 6px 14px -5px rgba(131,53,140,.3);
    }
    .glass-btn:disabled { cursor: wait; }
    .glass-btn .arr {
      flex: 0 0 39.9px;
      width: 35.91px;
      height: 35.91px;
      display: grid;
      place-items: center;
      padding: 4.5px;
      border-radius: 50%;
      border: 1px solid rgba(255,252,193,.88);
      background: radial-gradient(circle at 32% 20%, #fff76b, #FFF212 56%, #e2c712 100%);
      box-shadow: inset 0 1.5px 1px rgba(255,255,238,.9),
        inset 0 -2px 3px rgba(172,126,0,.22),
        0 2px 0 #c7a812, 0 4px 8px rgba(37,8,42,.28);
      transition: transform 220ms cubic-bezier(.22,1,.36,1);
    }
    .glass-btn .arr svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .glass-btn.is-leaving .arr { transform: translateX(3px); }

    /* Entrance motion belongs to wrappers so hover and press stay responsive. */
    .nav-reveal { display: inline-block; max-width: 100%; vertical-align: middle;
      animation: navPop 560ms cubic-bezier(.22,1,.36,1) both; }
    .back-reveal { margin-bottom: 16px; }
    .cta-reveal { animation-delay: 90ms; }
    @keyframes navPop {
      0% { opacity: 0; transform: translateY(12px) scale(.88); }
      62% { opacity: 1; transform: translateY(-3px) scale(1.035); }
      82% { transform: translateY(1px) scale(.99); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .back-btn { min-height: 41.4px; gap: 8.1px; padding: 6.3px 16.2px 6.3px 8.1px;
      font-size: 12.6px; }
    .back-btn .arr { flex-basis: 25.2px; width: 25.2px; height: 25.2px; padding: 3.6px; }
    .back-btn .arr svg { transform: rotate(180deg); }
    .cta { min-height: 54px; gap: 14.4px; padding: 9.9px 12.6px 9.9px 25.2px;
      font-size: 16.2px; }
    .cta .arr { flex-basis: 32.4px; width: 32.4px; height: 32.4px; }
    .back-btn.is-leaving .arr { transform: translateX(-3px); }
    @media (hover: hover) and (pointer: fine) {
      .back-btn:not(:disabled):hover .arr { transform: translateX(-3px); }
    }
    @media (max-width: 768px) {
      .cta-reveal { width: 100%; max-width: 320px; }
      .cta { width: 100%; font-size: 15.3px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .nav-reveal { animation: none; }
      .glass-btn:not(:disabled):hover::after { animation: none; }
      .glass-btn, .glass-btn .arr { transition: none; }
      .glass-btn:not(:disabled):hover, .glass-btn:not(:disabled):active,
      .glass-btn.is-leaving, .glass-btn:not(:disabled):hover .arr,
      .glass-btn.is-leaving .arr { transform: none; }
    }

    .cta-reveal { margin-top: auto; }
    .glass-btn .btn-label { min-width: 0; overflow-wrap: anywhere; }
    .big-card { min-width: 0; transition: none; }
    .sb-app-loading .nav-reveal { animation-play-state: paused; }
    .topbar .right { min-width: 0; text-align: right; }
    @media (max-width: 540px) {
      .progress-mini { white-space: normal; font-size: 11px; line-height: 1.25;
        max-width: 100%; padding: 4px 8px; }
      .back-btn { font-size: 11.7px; }
      .cta { font-size: 14.4px; padding-left: 20px; }
    }

    /* Viewport-aware mode picker: all primary controls stay in one screen. */
    html, body { height: 100%; min-height: 0; }
    body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { position: relative; }
    .wrap {
      flex: 1; min-height: 0; display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: clamp(8px, 1.6vh, 14px);
      padding: clamp(10px, 1.8vh, 18px) 24px;
    }
    .back-reveal { margin: 0; justify-self: start; }
    .hero-card {
      width: 100%; max-width: 900px; margin: 0 auto;
      padding: clamp(12px, 2vh, 20px) 20px;
    }
    .hero-card .custom-badge { margin-bottom: 8px !important; }
    .hero-card h1 { font-size: clamp(22px, 3.6vh, 30px); line-height: 1.2; }
    .hero-card p { margin-top: 5px; }
    .big-grid {
      width: 100%; min-height: 0; height: auto; max-height: none;
      align-self: start; margin: 0 auto; grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: auto; gap: 18px;
    }
    .big-card {
      min-height: 0; padding: clamp(18px, 2.4vh, 24px);
      display: grid; grid-template-columns: 54px minmax(0, 1fr);
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      column-gap: 14px; row-gap: 9px; align-content: start;
    }
    .big-card .icon {
      grid-column: 1; grid-row: 1 / 3; width: 54px; height: 54px;

    }
    .big-card .custom-badge {
      grid-column: 2; grid-row: 1; justify-self: start;
      max-width: 100%; margin: 0 !important; padding: 4px 10px !important;
      font-size: 10px; letter-spacing: .07em; line-height: 1.25;
    }
    .big-card h3 { grid-column: 2; grid-row: 2; margin: 0; font-size: 19px; line-height: 1.25; }
    .big-card p { grid-column: 1 / -1; grid-row: 3; margin: 5px 0 12px; align-self: start; line-height: 1.45; }
    .big-card .cta-reveal { grid-column: 1 / -1; grid-row: 4; margin: 0; justify-self: start; }
    .big-card .cta { min-height: 48.6px; padding: 7.2px 10.8px 7.2px 21.6px; font-size: 15.3px; }

    @media (max-width: 600px) and (orientation: portrait) {
      .wrap { padding: 10px 14px 12px; gap: 8px; }
      .hero-card { padding: 12px 12px; border-radius: 18px; }
      .hero-card .custom-badge { font-size: 10px; padding: 4px 12px !important; margin-bottom: 6px !important; }
      .hero-card h1 { font-size: 22px; }
      .hero-card p { font-size: 12px; line-height: 1.35; margin-top: 4px; }

        grid-template-columns: 40px minmax(0, 1fr); column-gap: 10px; }
      .big-card .icon { width: 40px; height: 40px; border-radius: 12px; font-size: 23px; }
      .big-card h3 { font-size: 17px; }

      .big-card .cta-reveal { width: 100%; max-width: none; }
      .big-card .cta { width: 100%; min-height: 43.2px; font-size: 14.4px; padding: 6.3px 10.8px 6.3px 18px; }
      .big-card .cta .arr { flex-basis: 27px; width: 27px; height: 27px; padding: 3.6px; }
    }
    @media (max-width: 600px) and (max-height: 700px) and (orientation: portrait) {
      .wrap { padding: 8px 12px 10px; gap: 7px; }
      .back-btn { min-height: 39.6px; padding-top: 6px; padding-bottom: 6px; }
      .hero-card { padding: 9px 10px; }
      .hero-card h1 { font-size: 20px; }
      .hero-card .custom-badge { font-size: 9px; padding: 3px 10px !important; margin-bottom: 4px !important; }
      .hero-card p { font-size: 11.5px; margin-top: 3px; }
      .big-grid { gap: 8px; }
      .big-card { padding: 10px 12px; row-gap: 4px; grid-template-columns: 34px minmax(0, 1fr); column-gap: 8px; }
      .big-card .icon { width: 34px; height: 34px; font-size: 20px; border-radius: 10px; }

      .big-card h3 { font-size: 16px; }

      .big-card .cta { min-height: 39.6px; font-size: 13.5px; padding: 5.4px 10.8px 5.4px 16.2px; }

    @media (max-height: 540px) and (orientation: landscape) {

      .big-card .custom-badge { font-size: 9px; padding: 3px 8px !important; }

    /* Accessibility fallback: never clip content under text zoom or long translations. */
    body.content-needs-room { height: auto; min-height: 100dvh; overflow-y: auto; }

    body.content-needs-room .big-card { min-height: 185px; grid-template-rows: auto auto minmax(0, 1fr) auto; }

    /* Spacious, equal square mode tiles on laptop/desktop and tablet screens. */
    @media (min-width: 601px) and (min-height: 541px) {
      .hero-card { max-width: none; }
      .big-grid {
        --tile-gap: 18px;
        width: min(100%, calc(var(--mode-card-size, 360px) * 2 + var(--tile-gap)));
        height: var(--mode-card-size, 360px);
        max-width: none;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: minmax(0, 1fr);
        gap: var(--tile-gap);
        align-self: start;
      }
      .big-card {
        aspect-ratio: 1;
        padding: clamp(18px, calc(var(--mode-card-size, 360px) * .06), 34px);
        grid-template-columns: clamp(46px, calc(var(--mode-card-size, 360px) * .15), 76px) minmax(0, 1fr);
        grid-template-rows: auto auto auto auto;
        align-content: center;
        column-gap: clamp(12px, calc(var(--mode-card-size, 360px) * .04), 22px);
        row-gap: 12px;
        border-radius: 26px;
      }
      .big-card .icon {
        width: clamp(46px, calc(var(--mode-card-size, 360px) * .15), 76px);
        height: clamp(46px, calc(var(--mode-card-size, 360px) * .15), 76px);
        border-radius: 18px;
        font-size: clamp(26px, calc(var(--mode-card-size, 360px) * .08), 38px);
        align-self: center;
      }
      .big-card .custom-badge { font-size: clamp(9px, calc(var(--mode-card-size, 360px) * .025), 12px); }
      .big-card h3 { font-size: clamp(18px, calc(var(--mode-card-size, 360px) * .048), 25px); }
      .big-card p { margin: 8px 0 10px; font-size: clamp(12px, calc(var(--mode-card-size, 360px) * .03), 15px); line-height: 1.5; }
      .big-card .cta { font-size: clamp(14.4px, calc(var(--mode-card-size, 324px) * .0342), 17.1px); }
    }
    body.content-needs-room .big-card { aspect-ratio: auto; }

    /* Three coordinated labels: Exploration Mode, Simulation, and Kit. */
    .hero-card .custom-badge, .big-card .custom-badge {
      border-radius: 8px !important;
      border: 1px solid rgba(131,53,140,.18) !important;
      background: linear-gradient(155deg, #FBF6FD, #EEDBF5 65%, #F5E8F9) !important;
      color: var(--purple-deep) !important;
      padding: 5px 12px !important;
      gap: 7px;
      font-size: 10.5px;
      line-height: 1.3;
      letter-spacing: .08em;
      font-weight: 700;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9),
        inset 0 -1px 0 rgba(131,53,140,.045),
        0 3px 8px -5px rgba(92,37,99,.2);
    }
    .big-card .custom-badge { font-size: 10px; padding: 4px 10px !important; }
    .custom-badge .badge-dot {
      width: 7px; height: 7px;
      background: linear-gradient(150deg, #ff73b9, var(--pink) 62%, #bc126e) !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
    }
    @media (max-width: 600px), (max-height: 540px) {
      .hero-card .custom-badge, .big-card .custom-badge {
        font-size: 9px; padding: 3px 8px !important; gap: 6px;
        letter-spacing: .06em; border-radius: 6px !important;
      }
    }

    /* Narrow the whole Exploration Mode introduction panel, not its badge. */
    .back-reveal { position: relative; left: -8px; }
    .hero-card { width: 86%; max-width: 1040px; margin-left: auto; margin-right: auto; }
    @media (max-width: 600px), (max-height: 540px) {
      .back-reveal { left: -4px; }
      .hero-card { width: 100%; }
    }

    /* Frosted lavender surfaces: all three full-size panels, not just their badges. */
    .hero-card, .big-card {
      background: #EEE7F4;
      background:
        radial-gradient(ellipse at 16% 0%, rgba(255,255,255,.4), transparent 64%),
        linear-gradient(145deg, rgba(240,232,247,.9), rgba(231,220,240,.76) 62%, rgba(238,229,246,.9));
      border-color: #C5AED2;
      -webkit-backdrop-filter: blur(12px) saturate(1.12);
      backdrop-filter: blur(12px) saturate(1.12);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.9),
        inset 0 0 0 1px rgba(131,53,140,.075),
        inset 0 -12px 22px -22px rgba(92,37,99,.15),
        0 0 0 1px rgba(131,53,140,.1),
        0 12px 26px -20px rgba(92,37,99,.25);
    }
    /* The secondary navigation is lighter; main action buttons stay dark purple. */
    .back-btn.glass-btn {
      color: var(--purple-deep);
      text-shadow: none;
      border-color: rgba(255,255,255,.8);
      background:
        radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.42), transparent 68%),
        linear-gradient(155deg, #DDC8E9, #CDB0DD 62%, #DAC0E7);
      box-shadow:
        inset 0 1.5px 0 rgba(255,255,255,.85),
        inset 0 -2px 4px rgba(92,37,99,.08),
        0 3px 0 #B896C6,
        0 9px 18px -10px rgba(92,37,99,.3);
    }
    .back-btn.glass-btn::before {
      background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.03) 48%, transparent 66%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.2);
    }
    @media (hover: hover) and (pointer: fine) {
      .back-btn.glass-btn:not(:disabled):hover {
        box-shadow:
          inset 0 1.5px 0 rgba(255,255,255,.95),
          inset 0 -2px 4px rgba(92,37,99,.08),
          0 6px 0 #B896C6,
          0 13px 22px -11px rgba(92,37,99,.33);
      }
    }
    .back-btn.glass-btn:not(:disabled):active,
    .back-btn.glass-btn.is-leaving {
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.65),
        inset 0 -1px 3px rgba(92,37,99,.1),
        0 1px 0 #B896C6,
        0 4px 10px -7px rgba(92,37,99,.25);
    }
    @media (prefers-reduced-transparency: reduce) {
      .hero-card, .big-card {
        background: #EEE7F4;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
    }

    /* Equal content tracks keep both mode actions aligned when text wraps. */
    .big-grid.sync-mode-rows .big-card {
      grid-template-rows: var(--mode-badge-row) var(--mode-title-row)
        var(--mode-description-row) var(--mode-action-row);
      align-content: center;
    }
    .big-grid.sync-mode-rows .cta-reveal {
      display: flex; align-self: start; align-items: flex-start;
    }
    .big-grid.sync-mode-rows .cta {
      min-height: var(--mode-action-row);
    }

    /* Glossy SVG artwork: identical rendering across devices, no image downloads. */
    .big-card .icon {
      box-shadow: inset 0 2px 3px rgba(255,255,255,.85),
        inset 0 -4px 7px rgba(131,53,140,.1),
        0 4px 10px -6px rgba(92,37,99,.2);
    }
    .big-card .icon svg { width: 88%; height: 88%; display: block; flex: 0 0 auto; }

    /* Match the level badge's golden glass, including its yellow backing. */
    .big-card .custom-badge {
      background:
        linear-gradient(155deg, rgba(255,255,255,.88),
          rgba(255,253,207,.76) 65%, rgba(255,255,255,.64)),
        var(--yellow) !important;
    }

    /* Exploration badge: slightly deeper gold than the two mode labels. */
    .hero-card .custom-badge {
      background:
        linear-gradient(155deg, rgba(255,255,255,.70),
          rgba(255,241,159,.62) 65%, rgba(255,255,255,.40)),
        #F3D643 !important;
    }

    /* Readable black supporting text in the introduction and both mode cards. */
    .hero-card p, .big-card p { color: #000000; }

    /* The introduction and paired mode cards share the same outer edges. */
    @media (min-width: 601px) and (min-height: 541px) {
      .hero-card {
        width: min(100%, var(--mode-panel-width, 100%));
        max-width: none;
      }
    }
  </style>
</head>

      // Stacked mobile cards should retain their natural independent heights.
      const top = cards[0].offsetTop;
      if (cards.some(card => Math.abs(card.offsetTop - top) > 2)) return;
      const selectors = ['.custom-badge', 'h3', 'p', '.cta'];
      const rows = selectors.map(selector => Math.max(...cards.map(card => {
        const element = card.querySelector(selector);
        const style = getComputedStyle(element);
        // offsetHeight ignores pop-in/hover transforms while measuring actual layout.
        return element.offsetHeight + (parseFloat(style.marginTop) || 0) +
          (parseFloat(style.marginBottom) || 0);
      })));
      const gap = parseFloat(getComputedStyle(cards[0]).rowGap) || 0;
      const iconHeight = Math.max(...cards.map(card => card.querySelector('.icon').offsetHeight));
      rows[1] += Math.max(0, iconHeight - rows[0] - rows[1] - gap);
      ['badge', 'title', 'description', 'action'].forEach((name, index) => {
        grid.style.setProperty('--mode-' + name + '-row', Math.ceil(rows[index]) + 'px');
      });
      grid.classList.add('sync-mode-rows');
    }

    let fitFrame;
    function checkViewportFit() {
      cancelAnimationFrame(fitFrame);
      fitFrame = requestAnimationFrame(() => {
        document.body.classList.remove('content-needs-room');
        const wrap = document.querySelector('.wrap');
        const grid = document.getElementById('modesGrid');
        if (window.matchMedia('(min-width: 601px) and (min-height: 541px)').matches) {
          const style = getComputedStyle(wrap);
          const width = wrap.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
          // Reconcile width and height if a translated heading changes its line count.
          for (let pass = 0; pass < 3; pass++) {
            const height = wrap.getBoundingClientRect().bottom - parseFloat(style.paddingBottom) - grid.getBoundingClientRect().top;
            const size = Math.max(0, Math.floor(Math.min((width - 18) / 2, height - 2)));
            grid.style.setProperty('--mode-card-size', size + 'px');
            wrap.style.setProperty('--mode-panel-width', Math.min(width, size * 2 + 18) + 'px');
          }
        } else {
          grid.style.removeProperty('--mode-card-size');
          wrap.style.removeProperty('--mode-panel-width');
        }
        alignModeActions(grid);
        const elements = document.querySelectorAll('.wrap, .big-grid, .big-card, .hero-card, .topbar');
        const overflow = [...elements].some(el => el.scrollHeight > el.clientHeight + 3 || el.scrollWidth > el.clientWidth + 3);
        const overlap = [...document.querySelectorAll('.big-card')].some(card => {
          const description = card.querySelector('p');
          const action = card.querySelector('.cta-reveal');
          return description && action && description.getBoundingClientRect().bottom > action.getBoundingClientRect().top - 2;
        });
        if (overflow || overlap) {
          document.body.classList.add('content-needs-room');
          alignModeActions(grid);
        }
      });
    }
    window.addEventListener('resize', checkViewportFit, { passive: true });
    window.addEventListener('orientationchange', checkViewportFit, { passive: true });
    if (document.fonts) document.fonts.ready.then(checkViewportFit);

    async function loadPageData() {
      // Load page data and the selected-language translation in PARALLEL (translation started pre-paint).
      const loadModes = (async () => {
        try {
          // Server JSON (data/modes.json) is the source of truth; fetch it first.
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 1800);
          let modesRes;
          try {
            modesRes = await fetch('../data/modes.json', { cache: 'no-cache', signal: controller.signal });
            if (modesRes.ok) {
              const data = await modesRes.json();
              if (data && Array.isArray(data.modes)) modesConfig = data;
            }
          } catch (_) {} finally { clearTimeout(timeout); }
          // localStorage is only a fallback cache (e.g. file:// / offline).
          if (!modesConfig || !modesConfig.modes || modesConfig.modes.length === 0) {
            const savedModesSync = localStorage.getItem('smartblock_modes_data');
            if (savedModesSync) {
              try { modesConfig = JSON.parse(savedModesSync); }
              catch(e) { console.warn('Error parsing smartblock_modes_data:', e); }
            }
          }
        } catch (e) { console.warn('Data load error in mode.html:', e); }
      })();

      const loadTrans = (async () => {
        // Bootstrap already preloaded ONLY global + mode in parallel; reuse the same in-flight promise.
        try { if (window.SB && SB.preloadTrans) translations = await SB.preloadTrans(currentLang); }
        catch (e) { /* fall through to embedded fallback */ }
        // Offline/safety fallback: use the embedded full translations for this language, then English.
        const fb = fallbackTranslations[currentLang] || fallbackTranslations.en || {};
        const fetched = translations || {};
        translations = {
          global: Object.assign({}, fb.global || {}, fetched.global || {}),
          mode: Object.assign({}, fb.mode || {}, fetched.mode || {})
        };
        translations.mode.modes = Object.assign({}, (fb.mode || {}).modes || {},
          (fetched.mode || {}).modes || {});
      })();

      await Promise.all([loadModes, loadTrans]);

      try { renderModesUI(); checkViewportFit(); } finally { if (window.SB && SB.reveal) { clearTimeout(SB._revealTimer); SB.reveal(); } }
    }

    function renderModesUI() {
      const p = modesConfig.page || {};
      const modesList = (modesConfig.modes || []).filter(m => m.status !== 'archived' && m.status !== 'inactive');
      const t = translations || {};
      const tm = t.mode || {};
      const tg = t.global || {};

      if (tg.levelBadge) {
        const b = document.getElementById('headerLevelBadge');
        if (b) b.textContent = tg.levelBadge;
      }

      const isNonEnglish = Boolean(currentLang && currentLang !== 'en');

      const eyebrowText = (isNonEnglish && tm.eyebrow) ? tm.eyebrow : (p.eyebrow || 'EXPLORATION MODE');
      const headingText = (isNonEnglish && tm.heading) ? tm.heading : (p.heading || 'How Do You Want to');
      const highlightText = (isNonEnglish && tm.headingHighlight) ? tm.headingHighlight : (p.headingHighlight || 'Explore?');
      const subText = (isNonEnglish && tm.subheading) ? tm.subheading : (p.subheading || 'Choose your learning adventure!');
      const backText = (isNonEnglish && tm.backBtn) ? tm.backBtn : (p.backButtonText || '← Back to Language');

      document.getElementById('eyebrowText').textContent = eyebrowText;
      document.getElementById('pageHeading').innerHTML = `${headingText} <span style="color:var(--pink)">${highlightText}</span>`;
      document.getElementById('pageSubheading').textContent = subText;
      document.getElementById('backBtnText').textContent = cleanButtonText(backText);
      document.getElementById('backBtn').setAttribute('aria-label', cleanButtonText(backText));

      const grid = document.getElementById('modesGrid');
      if (grid) {
        grid.innerHTML = '';
        modesList.forEach((m, cardIndex) => {
          const card = document.createElement('div');
          card.className = 'big-card';
          
          const tMode = (isNonEnglish && tm.modes && tm.modes[m.id]) ? tm.modes[m.id] : {};
          const badgeText = (isNonEnglish && tMode.badge) ? tMode.badge : (m.badge || '');
          const titleText = (isNonEnglish && tMode.title) ? tMode.title : (m.title || '');
          const descText = (isNonEnglish && tMode.description) ? tMode.description : (m.description || '');
          const ctaText = (isNonEnglish && tMode.cta) ? tMode.cta : (m.cta || m.ctaButton || 'Start Exploring →');

          const accentStyle = m.accentGradient 
            ? `background: ${m.accentGradient};` 
            : `background: ${m.accentColor || (m.id === 'arduino' ? '#FFF212' : 'linear-gradient(90deg, #83358C, #F01A8C)')};`;

          card.innerHTML = `
            <div class="accent" style="${accentStyle}"></div>
            <div class="icon" aria-hidden="true" style="background: ${m.iconBg || (m.id === 'arduino' ? '#FFF9D6' : '#F3EAF5')};">${glossyModeIcons[m.id] || m.icon || '🖥️'}</div>
            
            <span class="custom-badge">
              <span class="badge-dot"></span>
              ${badgeText}
            </span>
            
            <h3>${titleText}</h3>
            <p>${descText}</p>
          `;

          const btn = document.createElement('button');
          btn.className = 'cta glass-btn';
          btn.type = 'button';
          const label = document.createElement('span');
          label.className = 'btn-label';
          label.textContent = cleanButtonText(ctaText);
          const arrow = document.createElement('span');
          arrow.className = 'arr';
          arrow.setAttribute('aria-hidden', 'true');
          arrow.innerHTML = arrowMarkup.replaceAll('continueArrow', 'modeArrow' + cardIndex);
          btn.append(label, arrow);

            if (e) e.stopPropagation();
            selectMode(m.id, btn);
          };

          const reveal = document.createElement('div');
          reveal.className = 'nav-reveal cta-reveal';
          reveal.style.animationDelay = (60 + Math.min(cardIndex, 4) * 60) + 'ms';
          reveal.appendChild(btn);
          card.appendChild(reveal);
          grid.appendChild(card);
        });
      }
    }

    const arrowMarkup = "<svg viewBox=\"0 0 100 100\" aria-hidden=\"true\" focusable=\"false\">\n          <defs>\n            <linearGradient id=\"continueArrowFace\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n              <stop offset=\"0\" stop-color=\"#B775CE\"/>\n              <stop offset=\".48\" stop-color=\"#83358C\"/>\n              <stop offset=\"1\" stop-color=\"#50205E\"/>\n            </linearGradient>\n            <linearGradient id=\"continueArrowGloss\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n              <stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\".42\"/>\n              <stop offset=\".52\" stop-color=\"#fff\" stop-opacity=\"0\"/>\n            </linearGradient>\n          </defs>\n          <path d=\"M87 47 L55 17 L55 33 L15 33 L15 61 L55 61 L55 77 Z\"\n            transform=\"translate(0 5)\" fill=\"#3E1249\" stroke=\"#3E1249\" stroke-width=\"6\" stroke-linejoin=\"round\"/>\n          <path d=\"M87 47 L55 17 L55 33 L15 33 L15 61 L55 61 L55 77 Z\"\n            fill=\"url(#continueArrowFace)\" stroke=\"url(#continueArrowFace)\" stroke-width=\"6\" stroke-linejoin=\"round\"/>\n          <path d=\"M87 47 L55 17 L55 33 L15 33 L15 61 L55 61 L55 77 Z\"\n            fill=\"url(#continueArrowGloss)\"/>\n          <path d=\"M21 36 H56 V25 L72 40\" fill=\"none\" stroke=\"#E7C8F2\" stroke-opacity=\".68\"\n            stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n        </svg>";
    function cleanButtonText(value) {
      return String(value || '').replace(/^[\s←‹◀⟵]+/, '').replace(/[\s→›▶⟶]+$/, '').trim();
    }
    let navigationPending = false;
    let navigationTimer;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    function navigateFromButton(url, button) {
      if (navigationPending) return;
      navigationPending = true;
      if (button) { button.classList.add('is-leaving'); button.setAttribute('aria-busy', 'true'); }
      document.querySelectorAll('.glass-btn').forEach(el => { el.disabled = true; });
      navigationTimer = setTimeout(() => {
        try { window.location.assign(url); }
        catch (_) { resetNavigation(); }
      }, reducedMotion.matches ? 0 : 120);
    }
    function resetNavigation() {
      clearTimeout(navigationTimer);
      navigationPending = false;
      document.querySelectorAll('.glass-btn').forEach(el => {

        el.classList.remove('is-leaving');
        el.removeAttribute('aria-busy');

    }

    window.addEventListener('pagehide', () => clearTimeout(navigationTimer));

    function selectMode(modeId, button) {
      if (navigationPending) return;
      try {
        localStorage.setItem('smartblock_mode', modeId);
      } catch (err) {
        console.warn('localStorage error:', err);
      }
      const target = (modesConfig && modesConfig.page && modesConfig.page.nextPage) ? modesConfig.page.nextPage : 'world.html';
      navigateFromButton(target, button);
    }

    function goBack() {
      navigateFromButton((modesConfig.page && modesConfig.page.previousPage) ? modesConfig.page.previousPage : 'language.html', document.getElementById('backBtn'));
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadPageData);
    } else {
      loadPageData();
    }

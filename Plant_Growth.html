const FPOS=[[447,398,1],[552,368,.92],[486,318,.82]];   /* where the side blooms open and the fruit hangs */
const BIG=1.12;   /* the flower heads and the fruit are drawn 12% larger than the base art */
let V=VARIETIES[0];
/* a ring of petals; with cls the petals get the opening transition */
function petalRing(v,N,cls){
  let s='';
  for(let i=0;i<N;i++)s+=`<g class="pw" transform="rotate(${(i*360/N).toFixed(1)})"><path${cls?' class="petal"':''} d="${PETAL[v.petal]}" fill="url(#vPetal)" stroke="${v.ps}" stroke-width="1"/></g>`;
  return s;
}
function headMarkup(v){
  const r=v.petal==='slim'?9:14;
  return `<g transform="scale(${(v.hs*BIG).toFixed(3)})">${petalRing(v,v.petals,true)}`+
    `<circle class="fcenter" r="${r}" fill="url(#vCenter)" stroke="${v.cs}" stroke-width="2"/>`+
    `<g class="fcenter" fill="${v.dots}" opacity=".75"><circle cx="-5" cy="-3" r="1.6"/><circle cx="4" cy="-5" r="1.6"/><circle cx="6" cy="4" r="1.6"/><circle cx="-3" cy="6" r="1.6"/><circle cx="0" cy="0" r="1.6"/></g></g>`;
}
function flowerIcon(v){
  return `<svg viewBox="-50 -50 100 100" aria-hidden="true" focusable="false">${petalRing(v,v.petals,false)}<circle r="${v.petal==='slim'?10:14}" fill="url(#vCenter)" stroke="${v.cs}" stroke-width="2"/></svg>`;
}
/* one fruit, drawn around (0,0) with its stalk at the top. Ripe fruit carries a green
   copy of itself on top that fades away — so it ripens on screen. */
function fruitMarkup(v,ripe){
  const G=ripe?'url(#vFruit)':'url(#unripeG)';
  const body=(tag,attrs)=>`<${tag} ${attrs} fill="${G}" stroke="${v.fs}" stroke-width="1.2"/>`+(ripe?`<${tag} class="unripe" ${attrs} fill="url(#unripeG)"/>`:'');
  const stalk=(d,w=3,c='#3E8530')=>`<path d="${d}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
  const cap='#3E9B3E';
  switch(v.fruit){
    case 'strawberry':
      return stalk('M0 -12V-21')+body('path','d="M0 17C-12 10-16-3-11-10C-6-16-2-13 0-11C2-13 6-16 11-10C16-3 12 10 0 17Z"')+
        `<g fill="#FFE27A" stroke="#C9A200" stroke-width=".4"><ellipse cx="-5" cy="-2" rx="1.3" ry="1.9"/><ellipse cx="4" cy="-4" rx="1.3" ry="1.9"/><ellipse cx="0" cy="4" rx="1.3" ry="1.9"/><ellipse cx="-6" cy="6" rx="1.2" ry="1.7"/><ellipse cx="6" cy="5" rx="1.2" ry="1.7"/><ellipse cx="-1" cy="11" rx="1.1" ry="1.5"/></g>`+
        `<ellipse cx="-5" cy="-5" rx="3" ry="2" fill="#fff" opacity=".4"/><path d="M-10 -11L-5 -16 0 -12 5 -16 10 -11 5 -7 0 -9-5 -7Z" fill="${cap}"/>`;
    case 'brinjal':
      return stalk('M0 -16V-25',3.4,'#4A9A3E')+body('path','d="M0 -14C9 -14 12 -2 11 8C10 16 5 20 0 20C-5 20 -10 16 -11 8C-12 -2 -9 -14 0 -14Z"')+
        `<path d="M-6 -6C-8 0 -8 8 -5 13" stroke="#fff" stroke-width="2.6" opacity=".3" fill="none" stroke-linecap="round"/><path d="M-10 -10C-7 -17 -3 -19 0 -15C3 -19 7 -17 10 -10L5 -7 0 -9-5 -7Z" fill="#4A9A3E"/>`;
    case 'chilli':
      return stalk('M-1 -14C-1 -19-3 -22-6 -24',2.5)+body('path','d="M-2 -14C8 -12 12 2 7 13C5 18 1 22-3 20C-1 15-4 6-6-2C-7-8-6-13-2-14Z"')+
        `<path d="M3 -8C7 -2 7 6 4 12" stroke="#fff" stroke-width="2" opacity=".35" fill="none" stroke-linecap="round"/><path d="M-6 -13C-4 -16 2 -16 4 -13L1 -11-3 -11Z" fill="${cap}"/>`;
    case 'lemon':
      return stalk('M0 -11V-19',2.6,'#6B4A2B')+`<g transform="rotate(-18)">`+body('circle','cx="16" cy="0" r="3.2"')+body('circle','cx="-16" cy="0" r="2.6"')+body('ellipse','rx="15" ry="11"')+
        `<g fill="#B88A00" opacity=".25"><circle cx="-6" cy="-3" r="1"/><circle cx="2" cy="-5" r="1"/><circle cx="6" cy="2" r="1"/><circle cx="-3" cy="4" r="1"/><circle cx="0" cy="0" r="1"/></g><ellipse cx="-5" cy="-4" rx="4" ry="2.2" fill="#fff" opacity=".4"/></g>`+
        `<path d="M0 -12C6 -22 15 -21 13 -12C8 -8 3 -9 0 -12Z" fill="${cap}"/>`;
    case 'orange':
      return stalk('M0 -14V-21',2.6,'#6B4A2B')+body('circle','r="15.5"')+
        `<g fill="#C25C00" opacity=".22"><circle cx="-6" cy="-4" r="1"/><circle cx="3" cy="-7" r="1"/><circle cx="8" cy="1" r="1"/><circle cx="-8" cy="5" r="1"/><circle cx="0" cy="9" r="1"/><circle cx="-1" cy="1" r="1"/></g><circle cx="1" cy="7" r="1.8" fill="#C25C00" opacity=".5"/>`+
        `<ellipse cx="-5.5" cy="-6" rx="4.6" ry="3" fill="#fff" opacity=".45"/><path d="M1 -14C6 -24 15 -22 13 -13C8 -9 3 -10 1 -14Z" fill="${cap}"/>`;
    default: /* tomato */
      return stalk('M0 -22V-15')+body('circle','r="16.5"')+
        `<ellipse cx="-5.5" cy="-6" rx="4.6" ry="3" fill="#fff" opacity=".5"/><path d="M-9 -13L-3 -17 0 -13 3 -17 9 -13 3 -10-3 -10Z" fill="#2F7D32"/>`;
  }
}
function applyVariety(v){
  V=v;
  $('vGrads').innerHTML=
    `<radialGradient id="vPetal" cx="46%" cy="34%" r="75%"><stop offset="0" stop-color="${v.pc[0]}"/><stop offset=".6" stop-color="${v.pc[1]}"/><stop offset="1" stop-color="${v.pc[2]}"/></radialGradient>`+
    `<radialGradient id="vCenter" cx="42%" cy="38%" r="70%"><stop offset="0" stop-color="${v.cc[0]}"/><stop offset="1" stop-color="${v.cc[1]}"/></radialGradient>`+
    `<radialGradient id="vFruit" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="${v.fc[0]}"/><stop offset=".3" stop-color="${v.fc[1]}"/><stop offset=".72" stop-color="${v.fc[2]}"/><stop offset="1" stop-color="${v.fc[3]}"/></radialGradient>`;
  $('fhead').innerHTML=headMarkup(v);
  $('sblooms').innerHTML=FPOS.map(([x,y,k],i)=>`<g transform="translate(${x},${y+v.dy-4})"><g class="sbloom s${i+1}"><g transform="scale(${(.4*k*BIG).toFixed(3)})">${petalRing(v,5,false)}<circle r="13" fill="url(#vCenter)" stroke="${v.cs}" stroke-width="2"/></g></g></g>`).join('');
  $('g-fruit').innerHTML=FPOS.map(([x,y,k],i)=>`<g transform="translate(${x},${y+v.dy})"><g class="frtSw sw${i+1}"><g class="frt f${i+1}"><g transform="scale(${(k*v.fk*BIG).toFixed(3)})">${fruitMarkup(v,!(v.fruit==='chilli'&&i===2))}</g></g></g></g>`).join('');
  /* the stake, the strip and the two option tiles */
  const t=$('stakeTxt');t.textContent=v.name;t.setAttribute('font-size',v.name.length>7?12:14.5);
  CHIPS[3]=flowerIcon(v);CHIPS[4]=v.emoji;
  const fl=document.querySelector('.lens.flower'),fr=document.querySelector('.lens.fruit');
  if(fl)fl.innerHTML=flowerIcon(v);
  if(fr){fr.innerHTML=`<i>${v.emoji}</i>`;fr.style.background=`radial-gradient(circle at 42% 36%,${v.lens[0]} 0%,${v.lens[1]} 38%,${v.lens[2]} 76%,${v.lens[3]} 100%)`;}
  n.opts.style.setProperty('--fr',v.glow);n.opts.style.setProperty('--fg',v.fglow);
  /* the words that name the flower and the fruit */
  OK.flower.t=`The flower is open, <b>${v.word}</b>.`;ASK.fruit.status=OK.flower.t;
  OK.fruit.t=v.line;OK.fruit.s=`Great! ${v.plural[0].toUpperCase()+v.plural.slice(1)} come next.`;
}
function pickVariety(){
  let last=-1;try{last=parseInt(localStorage.getItem('pg-kind'),10);}catch(e){}
  const pool=VARIETIES.map((_,i)=>i).filter(i=>i!==last);
  const i=pool[Math.floor(Math.random()*pool.length)];
  try{localStorage.setItem('pg-kind',String(i));}catch(e){}
  applyVariety(VARIETIES[i]);
}
/* ---------- little garden moments ---------- */
/* the watering can hops over, tips, and the sprout gets its drink */
function waterPlant(){
  const can=$('can'),scn=$('scene');if(!can||motion.matches)return;
  can.classList.remove('pour','flow');void can.getBoundingClientRect();
  can.classList.add('pour');waterSnd();
  setTimeout(()=>{can.classList.add('flow');scn.classList.add('wet');},720);
  setTimeout(()=>can.classList.remove('flow'),1420);
  setTimeout(()=>can.classList.remove('pour'),2000);
  setTimeout(()=>scn.classList.remove('wet'),5200);
}
/* the sun leans in while the small plant grows */
function sunshine(){
  const scn=$('scene');scn.classList.remove('shine');void scn.getBoundingClientRect();scn.classList.add('shine');
  setTimeout(()=>scn.classList.remove('shine'),2500);
}
/* a puff of soil where the seed lands */
function puffSoil(){
  const p=$('soilPuff');if(!p||motion.matches)return;
  p.classList.remove('go');void p.getBoundingClientRect();p.classList.add('go');
  tone(140,.08,0,'triangle',.05);
  setTimeout(()=>p.classList.remove('go'),900);
}

/* the plant: one attribute drives every picture and the kit LEDs */
function setPlant(s){
  $('scene').dataset.s=s;
  light = s==='ready' ? 'off' : (s==='planted' ? 'seed' : s);
  led(light);
}
function updateProgress(){
  $('taskCount').textContent=`STEP ${Math.min(round+1,TOTAL)} / ${TOTAL}`;
  $('progress').innerHTML=Array.from({length:TOTAL},(_,i)=>{
    const done=i<round,cur=i===round;
    return `<span class="dot ${done?'done':cur?'current':''}${i===justDone?' pop':''}" title="Step ${i+1}">${done?'✓':i+1}</span>`;
  }).join('');
  justDone=-1;
}
function resetOptions(){
  optEls.forEach(b=>{b.classList.remove('used','right','nope','press');b.disabled=false;});
  n.opts.classList.remove('solved','live');n.optTitle.textContent='What comes next?';
}
function renderStrip(){
  n.strip.innerHTML=CHIPS.map((c,i)=>`<span class="chip ${i<stripDone?'done':''}${i===stripPop?' pop':''}">${c}</span>`).join('');
  stripPop=-1;
}
function showAsk(k){
  const a=(k==='seed'&&kitOn)?ASK.seedKit:ASK[k];
  setBanner(a.banner);
  pop(n.banner,[{transform:'scale(.96)',opacity:.55},{transform:'scale(1)',opacity:1}],320);
  n.status.innerHTML=a.status;n.status.classList.remove('fs');void n.status.offsetWidth;n.status.classList.add('fs');
  lastSay=a.say;later(()=>speak(lastSay),360);
}
function beginStep(){
  epoch++;clearTimers();stopSpeech();
  const k=FLOW[round];
  tries=0;updateProgress();resetOptions();renderStrip();
  $('irBtn').classList.toggle('attn',k==='seed'&&!kitOn);
  n.opts.classList.remove('idle');
  if(k==='seed'){phase='seedwait';n.opts.classList.add('idle');setPlant('ready');showAsk('seed');return;}
  phase='ask';n.opts.classList.add('live');showAsk(k);
}
function nextStep(){
  justDone=round;round++;
  if(round>=TOTAL){finishGame();return;}
  phase='between';later(beginStep,220);
}
function replayPattern(){stopSpeech();speak(lastSay);announce(lastSay);}

/* seed planted: the IR sensor over the pot, or the 🌱 Plant the seed button / key P.
   The gardener kid walks up to the pot, leans over and drops the seed into the soil. */
function seedAnim(done){
  const drop=$('seedDrop'),g=$('g-seed');
  if(!drop||motion.matches||!drop.animate){if(g)g.style.opacity=0;done();return;}
  g.style.opacity=1;                       /* appears at the kid's hand */
  drop.animate([
    {transform:'translate(0,0) rotate(0deg)',opacity:1,offset:0},
    {transform:'translate(-42px,10px) rotate(24deg)',opacity:1,offset:.55},
    {transform:'translate(-80px,28px) rotate(50deg)',opacity:0}
  ],{duration:750,delay:800,easing:'cubic-bezier(.5,.05,.8,.6)',fill:'both'});
  later(puffSoil,1520);                     /* the seed lands: a little puff of soil */
  later(()=>{g.style.opacity=0;done();},1680);
}
function seedDetected(){
  if(!started||phase!=='seedwait')return;
  phase='react';stripDone=1;stripPop=0;renderStrip();
  if(tries===0)score++;
  $('irBtn').classList.remove('attn');
  clickSnd();rightSnd();toast('ok','Seed planted!');
  setBanner('The seed is sinking into the soil…');
  const scn=$('scene');scn.classList.add('planting');
  later(()=>scn.classList.remove('planting'),2500);
  seedAnim(()=>setPlant('planted'));
  speak('Seed planted.');announce('Seed planted.');
  later(nextStep,2600);
}
function choose(c){
  if(phase==='seedwait'){toast('again',kitOn?'Wave your hand over the sensor!':'Press 🌱 Plant the seed!');speak(kitOn?'Wave your hand over the sensor first.':'Press the Plant the seed button first.');return;}
  if(phase!=='ask')return;
  const btn=optEls.find(b=>b.dataset.c===c);
  if(!btn||btn.classList.contains('used'))return;
  const want=FLOW[round];
  if(c!==want){
    tries++;btn.classList.add('used','nope');btn.disabled=true;
    setTimeout(()=>btn.classList.remove('nope'),560);wrongSnd();
    const msg=ORDER.indexOf(c)<ORDER.indexOf(want)?'That one already happened. What comes after it?':HINT[want];
    toast('again','Try again!');speak('Try again.');announce(msg);
    return;
  }
  phase='react';
  n.opts.classList.remove('live');n.opts.classList.add('solved');btn.classList.add('right');
  stripDone=round+1;stripPop=round;renderStrip();
  if(tries===0)score++;
  clickSnd();rightSnd();toast('ok','Correct!');
  setPlant(want);later(SFX[want],150);
  if(want==='sprout')later(waterPlant,1150);           /* the can hops over to water the new sprout */
  else if(want==='small')later(sunshine,500);          /* the sun leans in while it grows */
  pop($('pot'),[{transform:'translateY(0)'},{transform:'translateY(-9px)'},{transform:'translateY(0)'}],420);
  pop($('kid'),[{transform:'translateY(0)'},{transform:'translateY(-14px)'},{transform:'translateY(0)'}],420);
  setBanner(OK[want].b);n.status.innerHTML=OK[want].t;
  pop(n.banner,[{transform:'scale(.96)',opacity:.55},{transform:'scale(1)',opacity:1}],320);
  speak(OK[want].s);announce(OK[want].s);
  later(nextStep,want==='fruit'?4300:want==='small'?3100:2800);   /* fruit needs time to ripen on screen */
}
function finishGame(){
  phase='done';stopSpeech();n.opts.classList.remove('live');
  updateProgress();renderStrip();
  $('fs').textContent=score;$('ftotal').textContent=' / '+TOTAL;
  const perfect=score===TOTAL,great=score>=TOTAL-1;
  setFinalIcon(perfect?'trophy':great?'medal':'star');
  $('fh').textContent=perfect?'Perfect!':great?'Brilliant!':'Keep practising!';
  $('fmsg').textContent=perfect?`Great! You grew a ${V.name.toLowerCase()} plant from a tiny seed!`:'Remember the order: seed, sprout, small plant, flower, then fruit.';
  $('final').classList.add('show');
  if(score>=TOTAL-1)confetti(perfect?130:70);
  cheerSnd();$('restart').focus({preventScroll:true});
}
function resetWorld(){
  round=0;score=0;justDone=-1;stripDone=0;stripPop=-1;
  pickVariety();                                       /* a different flower and fruit this time */
  dealOptions(true);                                   /* and the choices land in a new order */
  $('can').classList.remove('pour','flow');$('scene').classList.remove('wet','shine','planting');
  const g=$('g-seed');if(g)g.style.opacity=0;
  setPlant('ready');
  $('legend').innerHTML=`<span class="rule">${CYCLE_TEXT}</span>`;
}
function startGame(){
  if(started)return;
  started=true;markPlayed();$('start').disabled=true;$('ov').classList.add('hide');
  setTimeout(()=>{$('ov').style.display='none';document.documentElement.classList.remove('intro');},380);
  ctx();requestAnimationFrame(()=>requestAnimationFrame(beginStep));
}
function newGame(){
  stopSpeech();$('final').classList.remove('show');
  document.querySelectorAll('.confetti').forEach(e=>e.remove());
  resetWorld();beginStep();
}

/* ---------- input ---------- */
optEls.forEach(b=>{
  b.addEventListener('pointerdown',()=>{if(n.opts.classList.contains('live')&&!b.disabled)b.classList.add('press');});

let port=null,writer=null,kitOn=false,connecting=false,disconnecting=false,serialToken=0;
/* same flow as the rest of the series: guarded connect / disconnect, one UI painter */
function connectionUI(){
  const dot=$('dot'),lab=$('connLabel'),btn=$('connBtn'),txt=$('connTxt');
  if(dot)dot.classList.toggle('on',kitOn);
  if(lab)lab.textContent=connecting?'Connecting…':kitOn?'Arduino mode':'Simulation mode';

    if(!connecting&&!disconnecting)showAsk('seed');
  }

let reader=null;
/* the board prints one word per line: DETECTED when its IR sensor sees a hand / object. */
async function listenIR(rd,token){
  const dec=new TextDecoder();let buf='';
  try{
    while(token===serialToken){
      const {value,done}=await rd.read();
      if(done)break;
      if(!value)continue;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.search(/[\r\n]/))>=0){
        const line=buf.slice(0,i).trim().toUpperCase();
        buf=buf.slice(i+1);
        if(line.includes('DETECTED')||line==='HAND'||line==='SEED')seedDetected();   /* sketch prints DETECTED */
      }
      if(buf.length>64)buf=buf.slice(-16);
    }
  }catch(e){}
}
async function connectArduino(){
  if(connecting||disconnecting)return;
  if(!('serial' in navigator)){
    alert('Web Serial needs desktop Chrome or Edge. Connect the Arduino and reopen this page there.');
    return;
  }
  connecting=true;const token=++serialToken;connectionUI();
  let selected=null;
  try{
    selected=await navigator.serial.requestPort();
    await selected.open({baudRate:9600});
    if(token!==serialToken){await selected.close();return;}
    port=selected;writer=selected.writable.getWriter();kitOn=true;
    reader=selected.readable.getReader();listenIR(reader,token);
    $('connBtn').classList.remove('attn');
    tone(659,.14,0,'sine',.06);tone(988,.2,.1,'sine',.06);
    announce('Plant growth kit connected.');
    connectionUI();
    led('off');led(light);        /* start clean, then show the state the screen is showing */
  }catch(e){
    kitOn=false;port=null;writer=null;reader=null;
    if(selected)try{await selected.close();}catch(err){}
    connectionUI();
  }finally{connecting=false;connectionUI();}
}
async function disconnectArduino(){
  if(disconnecting)return;
  disconnecting=true;serialToken++;
  const w=writer,p=port,rd=reader;
  try{if(w)await w.write(new TextEncoder().encode(CH.off));}catch(e){}   /* all LEDs off */
  kitOn=false;writer=null;port=null;reader=null;connectionUI();
  try{if(rd){await rd.cancel();rd.releaseLock();}}catch(e){}
  try{if(w)w.releaseLock();}catch(e){}
  try{if(p)await p.close();}catch(e){}
  disconnecting=false;connectionUI();
  announce('Arduino disconnected.');
}
$('connBtn').onclick=()=>kitOn?disconnectArduino():connectArduino();

/* ---------- layout mode (laptop vs touch auto-fit) ----------
   Same auto-fit shell as the rest of the series: touch devices always auto-fit.
   On top of that, any *small viewport* (resized desktop window, hybrid device,
   projector split-screen…) also switches to the responsive auto-fit shell, so
   the activity stays usable on models other than a full-size laptop. */
const laptop=matchMedia('(any-hover:hover) and (any-pointer:fine)');
const SCN=document.getElementById('scene'),STG=document.getElementById('stage');
let fitFrame=null;
function fitMode(){
  /* portrait screens are tablet/phone-style use even when a keyboard is attached;
     small landscape windows can't hold the laptop layout either */
  const auto=!laptop.matches || innerWidth<980 || innerHeight<520 || innerWidth<innerHeight;
  document.documentElement.dataset.layoutMode=auto?'auto-fit':'original-laptop';
  if(auto){
    /* phones & tablets: show the WHOLE garden (no cropping), centred; the sky / grass
       backdrop is re-aligned so it always meets the scene's own horizon line */
    SCN.setAttribute('preserveAspectRatio','xMidYMid meet');
    const w=Math.max(1,STG.clientWidth),h=Math.max(1,STG.clientHeight);
    const k=Math.min(w/1000,h/680),sh=680*k,fl=(h-sh)/2+sh*(460/680);
    STG.style.setProperty('--fl',fl.toFixed(1)+'px');
    STG.style.background='linear-gradient(#BFE4F8,#E8F5FD var(--fl),#94CC70 var(--fl),#6FA84A)';
  }else{
    SCN.setAttribute('preserveAspectRatio','xMidYMid slice');
    STG.style.removeProperty('--fl');STG.style.background='';
  }
}
function scheduleFit(){if(fitFrame!==null)return;fitFrame=requestAnimationFrame(()=>{fitFrame=null;fitMode();});}
if(laptop.addEventListener)laptop.addEventListener('change',scheduleFit);else laptop.addListener?.(scheduleFit);
if('ResizeObserver' in window)new ResizeObserver(scheduleFit).observe(STG);
window.addEventListener('resize',scheduleFit,{passive:true});
window.addEventListener('orientationchange',scheduleFit,{passive:true});

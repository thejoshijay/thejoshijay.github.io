<!doctype html>
<html class="intro" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plant Growth · Smart Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#83358C;--pink:#F01A8C;--yellow:#FFF212;
  --purple-deep:#5C2563;--pink-dk:#B01268;--yellow-dk:#D6C900;
  --ink:#161016;--muted:#4A3A4D;--line:#E7D8EA;
  --ok:#2FBF6D;--ok-deep:#1D7A45;--no:#E0433A;
  --sig-red:#FF2D2D;--sig-yellow:#FFC400;--sig-green:#22D35A;
  --font-display:'Fredoka','SB Display',Boulder,sans-serif;
  --font-text:'Nunito','SB Text',Bariol,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
@supports (height:100dvh){
  /* Use the visible phone/tablet viewport, not the larger area behind browser chrome.
     --vvh is updated from visualViewport; 100dvh remains the built-in fallback. */
  html[data-layout-mode="auto-fit"],html[data-layout-mode="auto-fit"] body{
    height:100dvh;
    height:min(100dvh,var(--vvh,100dvh));
  }
}
body{background:#E6DCEB;overflow:hidden;display:flex;flex-direction:column;font-family:var(--font-text);color:var(--ink)}
button{font:inherit;cursor:pointer}

/* ===================== SHELL (the Distance Detective house layout) ===================== */
.topbar{flex:0 0 auto;height:clamp(62px,8vh,76px);display:flex;align-items:center;gap:16px;
  padding:8px clamp(12px,2vw,24px);border-bottom:3px solid var(--purple);background:var(--yellow)}
.brand-logo{height:34px;width:auto}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(18px,2.8vh,26px);color:#5C2563}
h1 b{color:var(--pink)}
.layout{flex:1;min-height:0;display:grid;
  grid-template-columns:minmax(0,3fr) minmax(340px,1fr);
  gap:14px;padding:14px clamp(12px,2vw,24px)}
@media(max-width:940px) and (orientation:portrait){
  .layout{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  /* a grid track defaulting to min-content is what held the cards at 418 px in a
     390 px window: let every item shrink, and let the header row wrap if it must */
  .col,.rightcol,.card{min-width:0}
  .rightcol{grid-template-columns:minmax(0,1fr)}
  .task-header{flex-wrap:wrap;row-gap:5px}
  .progress{flex-wrap:wrap;justify-content:center}
}
.col{display:flex;flex-direction:column;gap:12px;min-height:0}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;
  box-shadow:0 12px 25px -20px var(--purple-deep);min-height:0}
.stage-card{flex:1;display:flex;flex-direction:column;padding:12px;min-height:0}
.stage{position:relative;flex:1;min-height:200px;border-radius:15px;border:1px solid var(--line);overflow:hidden;
  background:linear-gradient(#8FC6EC,#DDEFFA 33%,#9BCB72 33.2%,#7AB656)}
.scene{width:100%;height:100%;display:block;overflow:visible}

/* ---- task header + progress dots ---- */
.task-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 6px 10px;flex-wrap:wrap;row-gap:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.eyebrow{font-family:var(--font-display);font-weight:700;font-size:10.5px;letter-spacing:.11em;color:var(--pink);text-transform:uppercase;white-space:nowrap}
.progress{display:flex;gap:6px;flex:0 0 auto}
/* the round dots are little glazed beads — the Pattern and Sequence finish */
.progress .dot{position:relative;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;
  color:#AE8FB8;border:1px solid #DCCAE4;font:700 11px var(--font-display);
  text-shadow:0 1px 0 rgba(255,255,255,.85);
  background:radial-gradient(115% 100% at 50% 0%,#FFFFFF 0%,#F8F1FC 46%,#E8DAF0 100%);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.97), inset 0 -2.5px 3px rgba(131,53,140,.13),
             0 2px 0 rgba(92,37,99,.13), 0 5px 9px -5px rgba(92,37,99,.35);
  transition:color .25s,border-color .25s,box-shadow .25s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.progress .dot::after{content:"";position:absolute;left:17%;right:17%;top:9%;height:44%;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(255,255,255,.10));pointer-events:none}
.progress .dot.current{color:#fff;border-color:#D81C86;text-shadow:0 1px 1px rgba(150,10,80,.45);
  background:radial-gradient(115% 105% at 50% 0%,#FF80C5 0%,var(--pink) 52%,#D6167F 100%);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.78), inset 0 -2.5px 3px rgba(140,8,72,.32),
             0 3px 0 rgba(176,18,104,.42), 0 8px 13px -6px rgba(240,26,140,.70);
  transform:scale(1.12)}
.progress .dot.done{color:#188348;border-color:#79CAA0;text-shadow:0 1px 0 rgba(255,255,255,.9);
  background:radial-gradient(115% 100% at 50% 0%,#FFFFFF 0%,#E5FAED 46%,#BDECCF 100%);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.97), inset 0 -2.5px 3px rgba(47,150,90,.17),
             0 2px 0 rgba(47,150,90,.24), 0 5px 9px -5px rgba(47,150,90,.50)}
.progress .dot.pop{animation:dotPop .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes dotPop{0%{transform:scale(1)}42%{transform:scale(1.5)}100%{transform:scale(1)}}

/* ---- banner (tap it to hear the question again) ---- */
.banner{margin:0 auto;flex:0 1 auto;min-width:0;background:#fff;border:3px solid var(--purple);
  border-radius:18px;padding:4px 18px;font:700 clamp(13px,2.4vh,19px) var(--font-display);color:var(--purple-deep);
  box-shadow:0 5px 0 rgba(92,37,99,.18);width:max-content;max-width:94%;text-align:center;letter-spacing:.4px;
  cursor:pointer;user-select:none}
.banner .target{color:var(--pink)}
.banner .l-red{color:#D4141C}
.banner .l-yellow{color:#B57F00}
.banner .l-green{color:#13873B}
.banner.pop{animation:bp .4s cubic-bezier(.22,1,.36,1)}
@keyframes bp{0%{opacity:0;transform:translateY(-10px) scale(.92)}
  60%{opacity:1;transform:translateY(0) scale(1.035)}100%{transform:scale(1)}}

/* ===================== RIGHT COLUMN ===================== */
.rightcol{display:flex;flex-direction:column;gap:12px;min-height:0}
.card-title{font-family:var(--font-display);font-weight:700;font-size:15.5px;color:var(--purple);padding:2px 4px 10px}

/* -- the choices: the prediction throws the light, so the pads sit up here -- */
.optcard{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0;padding:16px;
  background:linear-gradient(170deg,#F7EFF9,#FFFFFF 60%)}
.optcard .legend .rule{text-align:center}
.optcard .sig-status{margin-top:clamp(8px,1.3vh,13px);text-align:center;font-size:clamp(14px,2vh,17px)}
.sig-status{font:700 clamp(15px,2.2vh,19px) var(--font-display);color:var(--purple-deep);
  min-height:1.3em;letter-spacing:.2px}
.sig-status b{font-weight:700}
.sig-status .c-red{color:#D4141C}.sig-status .c-yellow{color:#B57F00}.sig-status .c-green{color:#13873B}
.sig-status.fs{animation:fadeSlide .38s cubic-bezier(.22,1,.36,1) both}
@keyframes fadeSlide{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* -- choose the signal: where Distance Detective keeps its controls -- */
/* the three choices travel as one light frosted-pink block */
.opts{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.2vh,12px);
  padding:clamp(7px,1vh,10px);border-radius:22px;
  background:linear-gradient(180deg,#FFFDFE 0%,#FDF1F8 100%);border:2.5px solid #F7A0CD;
  box-shadow:inset 0 2px 0 #fff,inset 0 -3px 0 rgba(226,120,178,.16),
             0 7px 0 rgba(240,156,201,.38),0 16px 26px -18px rgba(200,80,140,.7)}
.opts::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,0) 58%)}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,.8vh,8px);
  padding:clamp(8px,1.3vh,12px) 4px clamp(7px,1.1vh,10px);border-radius:16px;border:2.5px solid #F7A0CD;
  background:linear-gradient(180deg,rgba(255,250,254,.96) 0%,rgba(255,224,242,.96) 46%,rgba(255,192,226,.97) 100%);
  -webkit-backdrop-filter:blur(8px) saturate(1.4);backdrop-filter:blur(8px) saturate(1.4);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.99),inset 0 -3px 0 rgba(226,120,178,.20),
             0 5px 0 rgba(240,156,201,.46),0 14px 22px -14px rgba(226,120,178,.80);
  transition:transform .18s cubic-bezier(.22,1,.36,1),box-shadow .18s,border-color .2s,opacity .25s,filter .25s;
  touch-action:manipulation;-webkit-user-select:none;user-select:none}
.opt::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(168deg,rgba(255,255,255,.88) 0%,rgba(255,255,255,.30) 34%,rgba(255,255,255,0) 58%),
             radial-gradient(130% 84% at 50% 116%,rgba(255,255,255,.55),rgba(255,255,255,0) 62%)}
/* the Connect-Arduino wave, rolling across the block one tile after another */
.opts.live .opt:not(.used)::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  border:3px solid rgba(240,26,140,.55);opacity:0;transform-origin:50% 50%;
  will-change:transform,opacity;                    /* compositor, not the main thread */
  animation:optPing 2.2s cubic-bezier(.45,0,.55,1) infinite}
.opts.live .opt[data-slot="1"]::after{animation-delay:.22s}
.opts.live .opt[data-slot="2"]::after{animation-delay:.44s}
@keyframes optPing{0%{opacity:.5;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.17)}}
.lens{position:relative;z-index:1;width:clamp(46px,7.4vh,68px);height:clamp(46px,7.4vh,68px);border-radius:50%;
  box-shadow:0 0 0 3.5px rgba(255,255,255,.95),0 0 0 5.5px rgba(247,160,205,.35),0 4px 9px rgba(120,30,80,.28),
             inset 0 -4px 6px rgba(0,0,0,.25)}
.lens::after{content:"";position:absolute;left:20%;right:30%;top:10%;height:36%;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0))}
.lens.red{background:radial-gradient(circle at 42% 36%,#FFB3AD 0%,#FF4A3F 34%,#D9101A 72%,#8E0510 100%)}
.lens.yellow{background:radial-gradient(circle at 42% 36%,#FFF3B0 0%,#FFD43B 34%,#F5A900 72%,#9C6B00 100%)}
.lens.green{background:radial-gradient(circle at 42% 36%,#C9FFD6 0%,#4FE07C 34%,#12A844 72%,#066A28 100%)}
.opt b{position:relative;z-index:1;font:700 clamp(15px,2.2vh,19px) var(--font-display);color:var(--purple-deep);letter-spacing:.3px}
.opt:hover{transform:translateY(-2px);border-color:#FF74BD;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.99),inset 0 -3px 0 rgba(226,120,178,.22),
             0 8px 0 rgba(240,140,196,.52),0 18px 26px -14px rgba(226,120,178,.88)}
.opt.press,.opt:active{transform:translateY(2px) scale(.972);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.99),inset 0 -2px 0 rgba(226,120,178,.22),0 2px 0 rgba(240,156,201,.42)}
.opt:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.opts:not(.live) .opt{cursor:default}
/* a wrong pick shakes its head and steps aside; the pink only ever means "you can choose this" */
.opt.used{opacity:.45;filter:grayscale(.85);cursor:default;transform:none}
.opt.used::after{content:"✕";position:absolute;right:6px;top:4px;z-index:2;font:700 15px var(--font-display);color:#C2342F;
  animation:none!important;box-shadow:none!important;inset:auto;width:auto;height:auto}
.opt.nope{animation:optNope .52s cubic-bezier(.36,.07,.19,.97)}
@keyframes optNope{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
/* the right one lights up in its own colour */
.opt.right{border-color:#fff;transform:translateY(-2px)}
.opt.right[data-c="red"]{box-shadow:0 0 0 4px rgba(255,45,45,.35),0 0 24px rgba(255,45,45,.55),0 5px 0 rgba(200,40,40,.35)}
.opt.right[data-c="yellow"]{box-shadow:0 0 0 4px rgba(255,196,0,.38),0 0 24px rgba(255,196,0,.55),0 5px 0 rgba(190,140,0,.35)}
.opt.right[data-c="green"]{box-shadow:0 0 0 4px rgba(34,211,90,.35),0 0 24px rgba(34,211,90,.55),0 5px 0 rgba(20,140,60,.35)}
.opts.solved .opt:not(.right){opacity:.55;filter:saturate(.6)}
/* the rule, always in view under the choices */
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.2vh,12px);margin-top:9px;padding:0 clamp(7px,1vh,10px);
  font:700 11.5px var(--font-display);color:var(--muted);text-align:center;line-height:1.25}
.legend span{display:block}
.legend .rule{ grid-column:1/-1;font-size:12.5px;color:#7A5B86;letter-spacing:.2px }
@media (hover:none){
  .opt:hover{transform:none;border-color:#F7A0CD;
    box-shadow:inset 0 3px 0 rgba(255,255,255,.99),inset 0 -3px 0 rgba(226,120,178,.20),
               0 5px 0 rgba(240,156,201,.46),0 14px 22px -14px rgba(226,120,178,.80)}
  .opt.right:hover{transform:translateY(-2px)}
}

/* ---- the feedback badge floats in the scene's lower-right corner, clear of the road ---- */
.toast{position:absolute;right:clamp(8px,1.2vw,14px);bottom:clamp(8px,1.2vh,14px);z-index:30;
  display:flex;align-items:center;gap:clamp(5px,.6vw,8px);
  padding:clamp(4px,.6vh,7px) clamp(10px,1.2vw,15px);border-radius:999px;
  background:#fff;border:2.5px solid #7FCB95;box-shadow:0 8px 18px rgba(92,37,99,.25);
  font:700 clamp(13px,2vh,17px) var(--font-display);color:#1B7A45;
  pointer-events:none;white-space:nowrap;animation:toastIn .3s cubic-bezier(.22,1,.36,1) both}
.toast .tic{width:1.35em;height:1.35em;flex:0 0 auto;display:grid;place-items:center}
.toast .tic svg{width:100%;height:100%;display:block}
.toast.again{border-color:var(--pink);color:var(--pink-dk);box-shadow:0 10px 24px rgba(240,26,140,.22)}
.toast.out{animation:toastOut .32s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(.94)}}
@keyframes toastOut{to{opacity:0;transform:translateY(7px) scale(.96)}}
.sr-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===================== OVERLAYS ===================== */
.ov{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px}
.ov.hide{opacity:0;pointer-events:none;transition:opacity .35s}
.ov-box{background:var(--yellow);border:5px solid var(--purple);border-radius:28px;padding:30px 42px;text-align:center;
  max-width:560px;transition:transform .35s cubic-bezier(.22,1,.36,1)}
.ov.hide .ov-box{transform:scale(.9) translateY(10px)}
.ov-box h2{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,4.6vh,40px);color:var(--purple-deep)}
.ov-box h2 b{color:inherit}
.ov-box p{font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--pink);margin:16px 0 24px;
  line-height:1.45;letter-spacing:.4px}
.ov-icons{display:flex;gap:20px;justify-content:center;margin:6px 0 16px}
.ov-icons svg{width:clamp(84px,12vh,112px);height:clamp(84px,12vh,112px);filter:drop-shadow(0 6px 10px rgba(92,37,99,.3));
  animation:iconIn2 .6s cubic-bezier(.34,1.56,.64,1) both, iconFloat 3.4s ease-in-out infinite}
.ov-icons svg:nth-child(1){animation-delay:.05s,1.0s}
.ov-icons svg:nth-child(2){animation-delay:.18s,1.5s}
/* the second symbol floats a beat after the first — the detective-series stagger */
.ov-icons svg:nth-child(3){animation-delay:.30s,2.0s}
.ov-icons svg:nth-child(4){animation-delay:.42s,2.4s}
@keyframes iconIn2{from{opacity:0;transform:translateY(16px) scale(.45)}to{opacity:1;transform:none}}
@keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
/* The single glossy railway-crossing emblem floats gently above the instructions. */
.ov-box.task-in h2{animation:ovRise .5s cubic-bezier(.22,1,.36,1) backwards}
.ov-box.task-in p{animation:ovRise .5s .1s cubic-bezier(.22,1,.36,1) backwards}
.ov-box.task-in .ov-start{animation:ovRise .5s .2s cubic-bezier(.22,1,.36,1) backwards}
@keyframes ovRise{from{opacity:0;transform:translateY(14px)}}
.ov-start{background:var(--pink);color:#fff;border:none;border-radius:18px;padding:13px 36px;
  font:700 21px var(--font-display);box-shadow:0 7px 0 var(--pink-dk);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.ov-start:hover{transform:translateY(-3px);box-shadow:0 10px 0 var(--pink-dk)}
.ov-start .bi{width:1.05em;height:1.05em;vertical-align:-.17em;margin-right:.42em}
.ov-start:active{transform:translateY(4px);box-shadow:0 3px 0 var(--pink-dk)}
.ov-start{position:relative;overflow:hidden;-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
.ov-start::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.10) 40%,rgba(255,255,255,0) 60%)}
.ov-start::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.12)}

.final{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  background:rgba(22,16,22,.45);backdrop-filter:blur(4px)}
.final.show{display:flex}
.final-box{background:#fff;border:5px solid var(--purple);border-radius:28px;padding:32px 42px;text-align:center;max-width:440px;
  margin:16px;animation:finIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes finIn{from{opacity:0;transform:scale(.82) translateY(16px)}to{opacity:1;transform:none}}
.trophy{font-size:66px;line-height:0;display:grid;place-items:center;animation:tp .7s cubic-bezier(.3,1.6,.4,1)}
.trophy svg{width:1em;height:1em;filter:drop-shadow(0 6px 8px rgba(160,110,0,.35))}
@keyframes tp{0%{transform:scale(.3) rotate(-20deg)}100%{transform:scale(1)}}

.final-box h2{font-family:var(--font-display);color:var(--purple);font-size:30px;margin:6px 0}
.tally{font:800 52px var(--font-display);color:var(--pink);line-height:1}
.tally small{font-size:22px;color:var(--purple-deep)}
.final-box p{margin:10px 0 16px;color:var(--muted);font-weight:700}
.again{background:var(--pink);color:#fff;border:none;border-radius:16px;padding:12px 28px;font:700 18px var(--font-display);
  box-shadow:0 6px 0 var(--pink-dk);transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.again:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--pink-dk)}
.again:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-dk)}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden;contain:layout paint}
.confetti i{position:absolute;top:-14px;width:10px;height:14px;border-radius:2px;
  will-change:transform,opacity;backface-visibility:hidden}

/* ===================== THE SCENE ===================== */
.scene{font-family:var(--font-display)}
.scene text{user-select:none}
.veh{will-change:transform}
.veh .brk{opacity:0;transition:opacity .25s ease}
.veh.braking .brk{opacity:1}
.veh .hl{opacity:.9}
/* the sky is alive: clouds drift, birds flap, the sun glows */
.drift{animation:drift 38s ease-in-out infinite alternate}
.drift.d2{animation-duration:46s;animation-delay:-17s}
.drift.d3{animation-duration:54s;animation-delay:-31s}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
/* trees breathe in the breeze */
.tree .cnp{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5.6s ease-in-out infinite}
.tree:nth-of-type(2n) .cnp{animation-duration:6.4s;animation-delay:-2.1s}
.tree:nth-of-type(3n) .cnp{animation-duration:7.1s;animation-delay:-3.7s}
@keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
/* the signal lamps */
.slamp .on,.slamp .halo{opacity:0;transition:opacity .28s ease}
.slamp.lit .on,.slamp.lit .halo{opacity:1}
.slamp.lit .halo{animation:haloPulse 1.6s ease-in-out infinite}
@keyframes haloPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.slamp .halo{transform-box:fill-box;transform-origin:50% 50%}
.spill{opacity:0;transition:opacity .4s ease}
.spill.lit{opacity:.42}
/* horns */
.honk{transform-box:fill-box;transform-origin:50% 100%;animation:honkPop 1.25s cubic-bezier(.22,1,.36,1) both}
@keyframes honkPop{0%{opacity:0;transform:scale(.3) translateY(6px)}18%{opacity:1;transform:scale(1.08)}
  30%{transform:scale(1)}78%{opacity:1;transform:translateY(-6px)}100%{opacity:0;transform:translateY(-12px)}}
/* little puffs from the exhausts */
.puff{animation:puff 1.4s ease-out both}
@keyframes puff{0%{opacity:.55;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx,4px),18px) scale(1.6)}}

.opt,.banner,.ov-start,.again{touch-action:manipulation}

  .btn.attn .pulse{animation:none}

  .drift{animation:none!important}

     their little light pulses rest at a steady brightness */
  .ov-icons svg{animation:none!important;opacity:1!important}

}

/* narrow portrait windows (any device): the two cards sit side by side under the
   scene, so the scene keeps its height; only very narrow windows stack them */
@media(max-width:940px) and (orientation:portrait){
  .rightcol{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;align-items:stretch}
}
@media(max-width:600px) and (orientation:portrait){
  .rightcol{grid-template-columns:minmax(0,1fr)}
}
/* portrait tablets: the scene over the two cards, side by side */
@media(max-width:940px) and (orientation:portrait){
  /* the scene row takes every spare pixel, but it can never be crushed: minmax(min-content,1fr)
     will not shrink below the picture's own height, and when the activity really does not fit
     (short phones) the whole card scrolls as one surface - nothing is ever cut off */
  html[data-layout-mode="auto-fit"] .layout{grid-template-columns:minmax(0,1fr);
    grid-template-rows:minmax(min-content,1fr) max-content;gap:10px;padding:10px;
    overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  html[data-layout-mode="auto-fit"] .rightcol{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px;align-items:stretch}

/* ===================== PATTERN & SEQUENCE 8.0 =====================
   The strip of lights the child is watching, the "you are the signal" pads,
   the optional Arduino bridge.                                          */

/* the level chip in the topbar */
.topbar .lv{ margin-left:auto;font-family:var(--font-display);font-weight:700;
  font-size:clamp(11px,1.5vh,14px);color:#fff;background:var(--purple);border-radius:999px;
  padding:5px 14px;white-space:nowrap;letter-spacing:.3px }

/* ---- the light strip: every light the cycle has shown, then "?" ---- */
.pstrip{ position:absolute;left:50%;bottom:clamp(8px,1.5vh,15px);transform:translateX(-50%);z-index:6;
  display:flex;align-items:center;gap:clamp(4px,.85vh,8px);
  padding:clamp(6px,.9vh,9px) clamp(10px,1.4vh,16px);border-radius:999px;max-width:94%;
  border:2.5px solid rgba(131,53,140,.42);
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(248,239,252,.95));
  box-shadow:0 10px 24px -12px rgba(60,20,70,.62),inset 0 2px 0 #fff;
  /* no backdrop blur here: the strip sits over the moving scene, so blurring it
     would make the browser re-blur the traffic on every single frame        */
  cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1) }
.pstrip:hover{ transform:translateX(-50%) translateY(-2px) }
.pstrip:focus-visible{ outline:3px solid var(--purple);outline-offset:3px }
.pstrip .bead{ flex:0 0 auto;width:clamp(15px,2.5vh,25px);height:clamp(15px,2.5vh,25px);border-radius:50%;
  background:radial-gradient(circle at 42% 36%,#E9E0EE 0%,#CFC2D8 58%,#B2A2BE 100%);
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.16),inset 0 1px 1px rgba(255,255,255,.7);
  transition:background .28s ease,box-shadow .28s ease,transform .28s cubic-bezier(.34,1.56,.64,1) }
.pstrip .bead.lit{ transform:scale(1.08) }
.pstrip .bead.red{ background:radial-gradient(circle at 42% 36%,#FFE3E0 0%,#FF5A4E 32%,#E5121B 72%,#9E0610 100%);
  box-shadow:0 0 15px 4px rgba(255,45,45,.62),inset 0 -2px 3px rgba(120,0,0,.4) }
.pstrip .bead.yellow{ background:radial-gradient(circle at 42% 36%,#FFFBE0 0%,#FFD84A 32%,#FFB300 72%,#A87400 100%);
  box-shadow:0 0 15px 4px rgba(255,196,0,.62),inset 0 -2px 3px rgba(130,80,0,.38) }
.pstrip .bead.green{ background:radial-gradient(circle at 42% 36%,#E6FFEC 0%,#5BEA86 32%,#14B94A 72%,#07752C 100%);
  box-shadow:0 0 15px 4px rgba(34,211,90,.58),inset 0 -2px 3px rgba(0,80,30,.38) }
.pstrip .sep{ flex:0 0 auto;width:clamp(8px,1.3vh,13px);height:2px;border-radius:2px;background:#C9B6D4;opacity:.7 }
.pstrip .bead.q{ width:clamp(23px,3.5vh,33px);height:clamp(23px,3.5vh,33px);display:grid;place-items:center;
  font:700 clamp(13px,2vh,18px) var(--font-display);color:#B01268;
  background:linear-gradient(180deg,#FFF,#FFE9F5);border:2.5px dashed #F06BAE;
  box-shadow:0 0 12px -2px rgba(240,26,140,.45) }
.pstrip .bead.hint{ animation:beadHint 1.5s ease-in-out infinite;border-color:#F01A8C;color:#8C0F55 }
.pstrip .scan{ flex:0 0 auto;width:clamp(9px,1.4vh,13px);height:clamp(9px,1.4vh,13px);border-radius:50%;
  background:var(--pink);box-shadow:0 0 0 0 rgba(240,26,140,.5);animation:scanPing 1.4s ease-out infinite }
@keyframes beadHint{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.14) } }
@keyframes scanPing{ 0%{ opacity:.55;transform:scale(1) } 100%{ opacity:0;transform:scale(1.5) } }

/* ---- the kit: the Distance Detective status line + Connect button ---- */
.ctrl{flex:0 0 auto;display:flex;flex-direction:column;padding:14px 16px 16px}
.conn{display:flex;align-items:center;gap:8px;background:#F7F2F8;border-radius:10px;padding:6px 12px;
  font:700 12.5px var(--font-display);color:var(--muted);margin:0 0 8px;border:1px solid #EBE2EE}
.conn .dot{width:10px;height:10px;flex:0 0 auto;border-radius:50%;background:#C9C2D6;
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.15);transition:background .25s,box-shadow .25s}
.conn .dot.on{background:var(--ok);box-shadow:0 0 9px rgba(47,191,109,.85)}
.btn{width:100%;border:none;border-radius:12px;padding:9px 12px;font:700 14px var(--font-display);cursor:pointer;
  transition:transform .16s cubic-bezier(.22,1,.36,1),filter .16s cubic-bezier(.22,1,.36,1),box-shadow .16s cubic-bezier(.22,1,.36,1)}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:translateY(2px)}
.btn:disabled{cursor:default;filter:grayscale(.5) brightness(.92);transform:none}
.btn-pink{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pink-dk)}
.btn-pink:active{box-shadow:0 1px 0 var(--pink-dk)}
.ctrl .btn{position:relative}
.ctrl .btn::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.10) 40%,rgba(255,255,255,0) 60%)}
.ctrl .btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.12)}
/* the "look at me" pulses travel as a ring: only transform and opacity change,
   so the button itself is never repainted (this one pulses all session) */
.ctrl .btn>.pulse{position:absolute;inset:-3px;border-radius:inherit;border:3px solid transparent;opacity:0;pointer-events:none;z-index:0}
#connBtn.attn .pulse{border-color:rgba(240,26,140,.55);animation:ringPulse 2.2s cubic-bezier(.45,0,.55,1) infinite}
.ctrl .btn-ir.attn .pulse{border-color:rgba(255,210,63,.72);animation:ringPulse 1.6s cubic-bezier(.45,0,.55,1) infinite}
@keyframes ringPulse{0%{opacity:.55;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.08)}}

/* when the kit is on, the pads say so */
.opts.kit .opt::before{ box-shadow:inset 0 0 0 2px rgba(47,191,109,.35) }

/* ---- auto-fit trims ---- */
html[data-layout-mode="auto-fit"] .topbar .lv{ font-size:10.5px;padding:4px 10px }
html[data-layout-mode="auto-fit"] .pstrip{ bottom:6px;gap:4px;padding:5px 9px }
html[data-layout-mode="auto-fit"] .pstrip .bead{ width:13px;height:13px }
html[data-layout-mode="auto-fit"] .pstrip .bead.q{ width:20px;height:20px;font-size:11.5px }
@media (max-width:520px){ .topbar .lv{ display:none } }


/* ===== ultra-smooth pass ===== */
:root{--ease-out:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.4,.64,1)}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;scroll-behavior:smooth}
*{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.scene{contain:layout paint;transform:translateZ(0);backface-visibility:hidden;shape-rendering:geometricPrecision}
/* blur behind moving traffic / buttons is the costliest thing on the page: the surfaces are near-opaque, so drop it */
.opt,.banner{-webkit-backdrop-filter:none;backdrop-filter:none}
.opt{transition:transform .32s var(--spring),box-shadow .3s var(--ease-out),opacity .35s var(--ease-out),filter .35s var(--ease-out),background-color .3s}
.btn,.ov-start,.again{transition:transform .28s var(--spring),box-shadow .28s var(--ease-out),filter .25s var(--ease-out)}
.card{transition:box-shadow .35s var(--ease-out),transform .35s var(--ease-out)}
.ov-box,.final-box{animation:boxIn .55s var(--spring) both}
@keyframes boxIn{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
.ov{transition:opacity .4s var(--ease-out)}
.ov-box{transition:transform .4s var(--ease-out)}
@media (prefers-reduced-motion:reduce){.ov-box,.final-box{animation:none!important}}

/* ===== requested sizing / layout ===== */
.eyebrow{font-size:12.1px}                                   /* STEP n / 5: +15% */
html[data-layout-mode="auto-fit"] .eyebrow{font-size:11.5px}
#optTitle{font-size:17.8px;padding:2px 4px 0}                /* What comes next?: +15% */
html[data-layout-mode="auto-fit"] #optTitle{font-size:16.1px}
.optcard{justify-content:flex-start}                         /* title rides at the top of the block */
.optcard .opts{margin-top:clamp(8px,1.4vh,14px)}
.optcard .sig-status{margin-bottom:0;font-size:clamp(16.5px,2.36vh,20.1px)}   /* status line: +18% */
html[data-layout-mode="auto-fit"] .sig-status{font-size:15.9px}
@media(max-width:480px) and (orientation:portrait){html[data-layout-mode="auto-fit"] .sig-status{font-size:14.8px}}
@media(orientation:landscape) and (max-height:540px){.eyebrow{font-size:10.9px}.optcard .sig-status{font-size:14.8px}}

/* ===== options block compact, controls block bigger ===== */
.optcard{flex:0 0 auto;justify-content:flex-start;padding:14px 16px 16px}
.ctrl{flex:1 1 auto;justify-content:flex-start;gap:clamp(10px,1.8vh,16px);padding:18px 20px 20px}

.ctrl .conn .dot{width:18px;height:18px}
.ctrl .btn{margin:0}
.ctrl #hearBtn{margin-bottom:auto}
.btn-purple{background:var(--purple);color:#fff;box-shadow:0 4px 0 var(--purple-deep)}
.btn-purple:active{box-shadow:0 1px 0 var(--purple-deep)}
.btn-purple .ear{display:inline-block;transition:transform .3s var(--spring)}
.btn-purple:hover .ear{transform:scale(1.18) rotate(-8deg)}
html[data-layout-mode="auto-fit"] .ctrl{padding:11px 13px 13px}
html[data-layout-mode="auto-fit"] .ctrl .conn{font-size:13px;padding:7px 11px;margin:0}
html[data-layout-mode="auto-fit"] .ctrl #hearBtn{margin-bottom:0}
@media(max-width:760px) and (orientation:portrait){
  .ctrl{padding:8px 10px 9px;gap:6px}

/* Connect Arduino: exactly the original glass-pink button and press feel */
#connBtn{
  transition:transform .16s cubic-bezier(.22,1,.36,1),filter .16s cubic-bezier(.22,1,.36,1),box-shadow .16s cubic-bezier(.22,1,.36,1)}
/* Hear the question: bright yellow slab with a darker lip, black rounded type */
.ctrl .btn-hear{display:flex;align-items:center;justify-content:center;gap:12px;background:#FFF012;color:#141414;
  font:700 clamp(19px,2.9vh,25px) var(--font-display);letter-spacing:.2px;border-radius:22px;

.ctrl .btn-hear:hover{filter:brightness(1.04);transform:translateY(-1px)}
.ctrl .btn-hear:active{transform:translateY(5px);box-shadow:0 2px 0 #D8C800}
.ctrl .btn-hear:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.btn-hear .spk{width:32px;height:28px;flex:0 0 auto}

@media(max-width:760px) and (orientation:portrait),(orientation:landscape) and (max-height:540px){

  html .ctrl .btn-hear .spk{width:20px;height:17px}

/* ===== railway crossing ===== */
#opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#opts .opt{min-width:0;width:auto}
.lens.barlens{background:none!important;box-shadow:none!important;border:0!important}
.lens.barlens::before,.lens.barlens::after{display:none!important}
.lens.barlens svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.ctrl .btn-ir{display:flex;align-items:center;justify-content:center;gap:10px;position:relative;background:#2F7FEE;color:#fff;
  font:700 clamp(16px,2.3vh,20px) var(--font-display);border-radius:18px;padding:clamp(12px,2vh,17px) 14px;box-shadow:0 6px 0 #1B54B5}
.ctrl .btn-ir:active{transform:translateY(4px);box-shadow:0 2px 0 #1B54B5}
.ctrl .btn-ir .irdot{display:none}
@keyframes irPing{0%{transform:scale(.96);opacity:.95}100%{transform:scale(1.07);opacity:0}}
#irBeam{animation:beamFlow .9s linear infinite}
@keyframes beamFlow{to{stroke-dashoffset:-18}}
#irBeam.hit{stroke:#FFE45C;stroke-width:5;opacity:1;animation:beamFlow .25s linear infinite}
.irglow{animation:irBlink 1s ease-in-out infinite}
@keyframes irBlink{50%{opacity:.25}}
#irHint{transform-box:fill-box;transform-origin:center;animation:irHintP 1.2s ease-out infinite;opacity:0}
#irHint.on{opacity:1}
@keyframes irHintP{0%{transform:scale(.7);opacity:.95}100%{transform:scale(1.5);opacity:0}}
.chip{display:inline-flex;font-size:0;line-height:0;margin:0 3px;opacity:.38;filter:grayscale(.7);transition:opacity .3s,transform .3s var(--spring)}
.chip.done{opacity:1;filter:none}.chip.cur{opacity:1;filter:none;transform:scale(1.28)}
.ctrl #irBtn{margin-bottom:auto}
.ctrl{gap:clamp(8px,1.4vh,12px);padding:14px 18px 16px}
.ctrl .btn{flex:0 0 auto}
.ctrl .conn{padding:clamp(9px,1.5vh,13px) 16px;font-size:17px}
.ctrl .btn-hear{padding:clamp(12px,2vh,17px) 14px;font-size:clamp(18px,2.6vh,23px)}
.ctrl .btn-ir{padding:clamp(10px,1.7vh,14px) 14px}
.opts.idle .opt{opacity:.55;filter:saturate(.7)}
.ctrl #hearBtn{margin-bottom:0}
@media(max-width:760px) and (orientation:portrait),(orientation:landscape) and (max-height:540px){
  .ctrl #irBtn{grid-column:1/-1;padding:7px;font-size:12.5px;border-radius:12px;margin:0;box-shadow:0 4px 0 #1B54B5}
}

/* ===== controls card: every control stays inside the card, at any height ===== */
body.kitmode #irBtn{display:none}
#opts .opt{padding:clamp(5px,1.1vh,12px) 6px}
#opts .lens{width:clamp(34px,6.4vh,58px)!important;height:clamp(34px,6.4vh,58px)!important}
#opts .opt b{font-size:clamp(12px,1.9vh,17px)}
#opts{gap:clamp(6px,1.2vh,10px)}
.optcard{padding:clamp(8px,1.5vh,14px) 16px clamp(8px,1.5vh,16px)}
.optcard .sig-status{font-size:clamp(14px,2.2vh,19px)}
.ctrl{display:flex;flex-direction:column;justify-content:flex-start;gap:clamp(7px,1.3vh,12px);padding:clamp(9px,1.7vh,16px) 18px clamp(14px,2.2vh,20px);overflow:hidden}
.ctrl .card-title{font-size:clamp(15px,2.3vh,19.5px);margin:0;padding:0 4px}
.ctrl .conn{margin:0;padding:clamp(6px,1.1vh,11px) 14px;font-size:clamp(13px,2vh,17px);gap:10px}
.ctrl .conn .dot{width:clamp(12px,1.9vh,17px);height:clamp(12px,1.9vh,17px)}
.ctrl #connBtn{margin:0;padding:clamp(8px,1.5vh,11px) 12px;font-size:clamp(13px,1.9vh,15px)}
.ctrl #hearBtn{margin:0;padding:clamp(8px,1.7vh,15px) 14px;font-size:clamp(15px,2.4vh,22px);box-shadow:0 clamp(4px,.7vh,6px) 0 #D8C800}
.ctrl #irBtn{margin:0;padding:clamp(8px,1.5vh,13px) 14px;font-size:clamp(14px,2.1vh,19px);box-shadow:0 clamp(4px,.7vh,6px) 0 #1B54B5}
.ctrl .btn-hear .spk{width:clamp(22px,3.4vh,30px);height:clamp(19px,3vh,26px)}

/* Slightly deeper glossy-town facades; original scene palette and geometry retained. */
#town .bld{filter:brightness(.89) saturate(1.04)}

/* Requested signal/barrier pairing: RED + DOWN, then GREEN + UP. */
#opts{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"red down" "green up"}
#opts .opt[data-c="red"]{grid-area:red}
#opts .opt[data-c="down"]{grid-area:down}
#opts .opt[data-c="green"]{grid-area:green}
#opts .opt[data-c="up"]{grid-area:up}

/* Hear the question + Train approaching: one row at the bottom of the Controls card,
   two equal buttons side by side — the same place and layout as Undo / Reset in Distance Explorer */
html[data-layout-mode] .ctrl{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:clamp(8px,1.4vh,12px)}
.ctrl .control-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;width:100%}
html .ctrl .control-pair>#hearBtn,html .ctrl .control-pair>#irBtn{
  grid-column:auto;width:100%;height:auto;aspect-ratio:auto;min-width:0;min-height:44px;margin:0;padding:11px 8px;
  display:flex;flex-direction:row;align-items:center;justify-content:center;gap:6px;
  border-radius:14px;white-space:normal;overflow-wrap:anywhere;text-align:center;line-height:1.2;
  font-size:clamp(13px,1.15vw,16px);
}
html .ctrl .control-pair>#hearBtn{box-shadow:0 5px 0 #D8C800}
html .ctrl .control-pair>#hearBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C800}
html .ctrl .control-pair>#hearBtn .spk{width:20px;height:17px;flex:0 0 auto;margin:0}
html .ctrl .control-pair>#irBtn{box-shadow:0 5px 0 #1B54B5}
html .ctrl .control-pair>#irBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #1B54B5}
html .ctrl .control-pair>#irBtn #irTxt{display:block;max-width:100%;font-size:inherit;line-height:1.2;text-align:center;white-space:normal}
@media(max-width:760px) and (orientation:portrait),(orientation:landscape) and (max-height:540px){
  html .ctrl .control-pair>#hearBtn,html .ctrl .control-pair>#irBtn{min-height:40px;padding:8px 6px;font-size:12.5px;border-radius:12px}
  html .ctrl .control-pair>#hearBtn .spk{width:17px;height:15px}
}

@media(orientation:landscape) and (max-height:540px){
  /* short landscape phones: nothing is squashed — the side column scrolls so the buttons are always reachable */
  aside.col{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  aside.col>.card{flex:0 0 auto}
  html[data-layout-mode] .ctrl{overflow:visible}
}

.ctrl .btn>*{position:relative;z-index:1}

html[data-layout-mode="auto-fit"] .chip svg{width:19px;height:19px}
.train{will-change:auto;pointer-events:none}
.chip.pop{animation:chipPop .55s var(--spring)}
@keyframes chipPop{0%{transform:scale(.5)}60%{transform:scale(1.35)}100%{transform:scale(1)}}

html[data-layout-mode] .ctrl .control-pair>#hearBtn,html[data-layout-mode] .ctrl .control-pair>#irBtn{font-size:13.46px;min-height:39.6px;padding:9.9px 7.2px;border-radius:12.6px;gap:5.4px}
html[data-layout-mode] .ctrl .control-pair>#hearBtn .spk{width:18px;height:15.3px}
html[data-layout-mode="auto-fit"] .ctrl #connBtn{font-size:16.5px;padding:12.1px 13.2px}
html[data-layout-mode="auto-fit"] .ctrl .control-pair>#hearBtn,html[data-layout-mode="auto-fit"] .ctrl .control-pair>#irBtn{font-size:11.7px}
@media(max-width:760px) and (orientation:portrait),(orientation:landscape) and (max-height:540px){

  html[data-layout-mode] .ctrl .control-pair>#hearBtn .spk{width:15.3px;height:13.5px}
}
@media(max-width:760px) and (orientation:portrait){html[data-layout-mode] .ctrl #connBtn{font-size:16.5px;padding:12.1px 13.2px}}
@media(orientation:landscape) and (max-height:540px){html[data-layout-mode] .ctrl #connBtn{font-size:14.3px;padding:8.8px 13.2px}}

/* ===== CONTROLS: one clean layout =====
   Simulation toggle on top · Connect Arduino alone on its own row ·
   Hear the question + Train side by side (equal width, equal height, one line each).
   Everything is sized from variables so nothing is cut, wrapped or overlapped. */
html[data-layout-mode] .ctrl{
  --cg:clamp(8px,1.5vh,13px);          /* gap between rows            */
  --tg:clamp(11px,1.9vh,15px);         /* toggle text                 */
  --cb:clamp(14px,2.1vh,16.5px);       /* Connect Arduino text        */
  --bh:clamp(40px,6vh,48px);           /* height of the pair buttons  */
  display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;
  gap:var(--cg);padding:clamp(10px,1.8vh,16px) clamp(12px,1.6vw,18px) clamp(14px,2.2vh,20px);overflow:visible;
}
html[data-layout-mode] .ctrl .card-title{margin:0;padding:0 4px;font-size:clamp(15px,2.3vh,19.5px);flex:0 0 auto}
/* the toggle */
html[data-layout-mode] .ctrl .conn{margin:0;flex:0 0 auto;width:100%;box-sizing:border-box;
  padding:clamp(7px,1.2vh,11px) 14px;gap:10px;font-size:var(--tg);line-height:1.2;border-radius:12px;align-self:stretch}
html[data-layout-mode] .ctrl .conn .dot{width:clamp(11px,1.7vh,15px);height:clamp(11px,1.7vh,15px)}
/* Connect Arduino — alone on its row */
html[data-layout-mode] .ctrl #connBtn{margin:0;flex:0 0 auto;width:100%;box-sizing:border-box;min-height:var(--bh);
  padding:0 14px;display:flex;align-items:center;justify-content:center;font-size:var(--cb);line-height:1.2;
  white-space:nowrap;border-radius:14px}
/* older-Chrome fallback: vh-only button sizes; container-query cqw sizes below override where supported */
html[data-layout-mode] .ctrl .control-pair>#hearBtn,html[data-layout-mode] .ctrl .control-pair>#irBtn{font-size:clamp(10px,1.75vh,13px);line-height:1.2}
@media (orientation:portrait),(min-height:541px){
html[data-layout-mode] .ctrl .control-pair>#hearBtn,html[data-layout-mode] .ctrl .control-pair>#irBtn{font-size:clamp(11px,2vh,14.5px)}
}
/* the pair: two equal buttons in one row, pinned to the bottom of the card */
html[data-layout-mode] .ctrl .control-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(7px,1.2vw,10px);
  width:100%;margin:auto 0 0;padding:0;align-items:stretch;container-type:inline-size;flex:0 0 auto}
html[data-layout-mode] .ctrl .control-pair>#hearBtn,html[data-layout-mode] .ctrl .control-pair>#irBtn{
  grid-column:auto;width:100%;min-width:0;max-width:none;margin:0;box-sizing:border-box;height:auto;min-height:var(--bh);aspect-ratio:auto;
  padding:0 6px;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:4px;
  font-size:clamp(9.5px,3.55cqw,12.8px);line-height:1.25;white-space:nowrap;text-align:center;border-radius:14px}
html[data-layout-mode] .ctrl .control-pair>#hearBtn>span:not(.spk),html[data-layout-mode] .ctrl .control-pair>#irBtn #irTxt{
  display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:clip;text-align:center}
html[data-layout-mode] .ctrl .control-pair>#hearBtn .spk{width:1.2em;height:1.06em;flex:0 0 auto;margin:0}
@container (max-width:250px){html[data-layout-mode] .ctrl .control-pair>#hearBtn .spk{display:none}}
@container (max-width:200px){html[data-layout-mode] .ctrl .control-pair>#hearBtn,html[data-layout-mode] .ctrl .control-pair>#irBtn{padding:0 4px;line-height:1.05}html[data-layout-mode] .ctrl .control-pair>#hearBtn>span:not(.spk),html[data-layout-mode] .ctrl .control-pair>#irBtn #irTxt{white-space:normal;overflow:visible}}
html[data-layout-mode] .ctrl .control-pair>#hearBtn{box-shadow:0 5px 0 #D8C800}
html[data-layout-mode] .ctrl .control-pair>#irBtn{box-shadow:0 5px 0 #1B54B5}
html[data-layout-mode] .ctrl .control-pair>#hearBtn:active,html[data-layout-mode] .ctrl .control-pair>#irBtn:active{transform:translateY(3px)}
html[data-layout-mode] .ctrl .control-pair>#hearBtn:active{box-shadow:0 2px 0 #D8C800}
html[data-layout-mode] .ctrl .control-pair>#irBtn:active{box-shadow:0 2px 0 #1B54B5}
/* room for the coloured lip under the buttons */
html[data-layout-mode] .ctrl .control-pair{padding-bottom:5px}
/* short landscape phones: tighter, and the column may scroll instead of squashing */
@media(orientation:landscape) and (max-height:540px){
  html[data-layout-mode] .ctrl{--cg:6px;--tg:11px;--cb:13px;--bh:34px;padding:8px 10px 10px}
  html[data-layout-mode] .ctrl .card-title{display:none}
  html[data-layout-mode] .ctrl .conn{padding:5px 10px}
  html[data-layout-mode] .ctrl .control-pair{margin-top:0}
  html[data-layout-mode] .ctrl .control-pair>#hearBtn,html[data-layout-mode] .ctrl .control-pair>#irBtn{padding:0 5px;border-radius:11px;box-shadow:0 4px 0 var(--lip)}
  html[data-layout-mode] .ctrl .control-pair>#hearBtn{--lip:#D8C800}html[data-layout-mode] .ctrl .control-pair>#irBtn{--lip:#1B54B5}
  aside.col{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  aside.col>.card{flex:0 0 auto}
}
/* phones in portrait */
@media(max-width:760px) and (orientation:portrait){
  html[data-layout-mode] .ctrl{--cg:9px;--tg:12.5px;--cb:16px;--bh:44px;padding:11px 13px 15px}
  html[data-layout-mode] .ctrl .card-title{display:none}
  html[data-layout-mode] .ctrl .control-pair{margin-top:0}
}

@media(orientation:landscape) and (max-height:540px){html[data-layout-mode] .ctrl{--bh:36px}}

/* ===== plant growth ===== */
.stage{background:linear-gradient(#8FC6EC,#DFF1FB 66%,#94CC70 66.2%,#72B04C)}
/* the four cells are positional: the script deals the choices into slots 0-3
   (growing order for the very first game, a fresh shuffle for every game after) */
#opts{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"s0 s1" "s2 s3"}
#opts .opt[data-slot="0"]{grid-area:s0}#opts .opt[data-slot="1"]{grid-area:s1}
#opts .opt[data-slot="2"]{grid-area:s2}#opts .opt[data-slot="3"]{grid-area:s3}
.lens.ic{display:grid;place-items:center;font-size:clamp(18px,3.3vh,30px);line-height:1}
.lens.ic>i{font-style:normal;position:relative;z-index:1}
.lens.sprout{background:radial-gradient(circle at 42% 36%,#E9FFE9 0%,#7FE08A 38%,#2FA84E 76%,#0D5E28 100%)}
.lens.small{background:radial-gradient(circle at 42% 36%,#DFF7D6 0%,#5DBB5A 38%,#2E7D32 76%,#14481B 100%)}
.lens.flower{background:radial-gradient(circle at 42% 36%,#FFF6D6 0%,#FFD43B 38%,#F59E00 76%,#8A5A00 100%)}
.lens.fruit{background:radial-gradient(circle at 42% 36%,#FFE3DC 0%,#FF6A5A 38%,#E0281E 76%,#7E0A08 100%)}
.opt.right[data-c="sprout"]{box-shadow:0 0 0 4px rgba(47,191,109,.35),0 0 24px rgba(47,191,109,.55),0 5px 0 rgba(20,120,60,.35)}
.opt.right[data-c="small"]{box-shadow:0 0 0 4px rgba(46,125,50,.32),0 0 24px rgba(46,125,50,.5),0 5px 0 rgba(20,80,30,.35)}
.opt.right[data-c="flower"]{box-shadow:0 0 0 4px rgba(255,196,0,.38),0 0 24px rgba(255,196,0,.55),0 5px 0 rgba(190,140,0,.35)}
.opt.right[data-c="fruit"]{box-shadow:0 0 0 4px rgba(255,45,45,.35),0 0 24px rgba(255,45,45,.55),0 5px 0 rgba(200,40,40,.35)}
.chip{font-size:clamp(18px,3.2vh,26px);line-height:1}
html[data-layout-mode="auto-fit"] .chip{font-size:18px}
.pstrip{gap:clamp(6px,1.2vh,12px)}
.pstrip .chip{margin:0}
.ov-icons svg text{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

/* --- the garden scene --- */
.sun-rays{transform-box:fill-box;transform-origin:50% 50%;animation:pSpin 60s linear infinite}
@keyframes pSpin{to{transform:rotate(360deg)}}
.sun-halo{transform-box:fill-box;transform-origin:50% 50%;animation:pGlow 4.8s ease-in-out infinite}
@keyframes pGlow{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.07);opacity:1}}
.birdF{animation:flit 9s ease-in-out infinite alternate}
.birdF.b2{animation-duration:11s;animation-delay:-4s}
@keyframes flit{from{transform:translate(-10px,2px)}to{transform:translate(14px,-4px)}}
.birdF .wing{transform-box:fill-box;transform-origin:50% 100%;animation:pFlap .9s ease-in-out infinite alternate}
.birdF.b2 .wing{animation-duration:1.1s;animation-delay:-.4s}
@keyframes pFlap{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
.swf{transform-box:fill-box;transform-origin:50% 100%;animation:pSway 4.4s ease-in-out infinite}
.swf.d2{animation-duration:5.3s;animation-delay:-1.9s}
@keyframes pSway{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.6deg)}}
/* the gardener kid walks over and plants the seed */
#kid{animation:kidBob 2.6s ease-in-out infinite}
#kidLean{transform-box:fill-box;transform-origin:50% 100%}
.armL{transform-box:fill-box;transform-origin:90% 55%}
#scene.planting #kidWalk{animation:kWalk 2.4s cubic-bezier(.33,.72,.3,1) both}
@keyframes kWalk{0%{transform:translateX(0)}20%{transform:translateX(-84px)}72%{transform:translateX(-84px)}100%{transform:translateX(0)}}
#scene.planting #kidLean{animation:kLean 2.4s ease-in-out both}
@keyframes kLean{0%,16%{transform:rotate(0deg)}30%,60%{transform:rotate(-11deg)}78%,100%{transform:rotate(0deg)}}
#scene.planting .armL{animation:kArmL 2.4s ease-in-out both}
@keyframes kArmL{0%,16%{transform:rotate(0deg)}30%,56%{transform:rotate(-60deg)}74%,100%{transform:rotate(0deg)}}
#scene[data-s="fruit"] #kid{animation:jump .5s ease-in-out infinite alternate}

.bfly{animation:pFly 12s ease-in-out infinite alternate}
@keyframes pFly{0%{transform:translate(0,0)}35%{transform:translate(-46px,-26px)}70%{transform:translate(18px,-44px)}100%{transform:translate(-28px,-8px)}}
.bfly .wl,.bfly .wr{transform-box:fill-box;animation:pWing .45s ease-in-out infinite alternate}
.bfly .wl{transform-origin:100% 50%}
.bfly .wr{transform-origin:0% 50%;animation-direction:alternate-reverse}
@keyframes pWing{from{transform:scaleX(1)}to{transform:scaleX(.35)}}

/* the plant: one attribute on the scene drives the whole garden */
#g-sprout,#g-small,#g-flower,#g-fruit,#bump,#spk{opacity:0;transition:opacity .45s ease}
#g-seed{opacity:0}
.grow{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);
  transition:transform 1.1s var(--spring)}
#plantSway{transform-box:fill-box;transform-origin:50% 100%;animation:pSwaySoft 6.5s ease-in-out infinite}

/* ===================== GARDEN DETAILS & GROWTH PASS =====================
   More life in the garden (fence, trees, watering can, ladybug, bee, snail, pollen),
   stems that draw themselves upward, leaves that unfurl one by one, petals that open
   with a twist, fruit that ripens from green — and a different plant every game.   */
/* the kid: idle breathing, a jump when the fruit arrives (both were referenced but never defined) */
@keyframes kidBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes jump{from{transform:translateY(0)}to{transform:translateY(-16px)}}
.armR{transform-box:fill-box;transform-origin:4% 4%}
#scene[data-s="fruit"] .armR{animation:cheerR .46s ease-in-out infinite alternate}
#scene[data-s="fruit"] .armL{animation:cheerL .46s ease-in-out infinite alternate}
@keyframes cheerR{from{transform:rotate(-128deg)}to{transform:rotate(-156deg)}}
@keyframes cheerL{from{transform:rotate(52deg)}to{transform:rotate(76deg)}}
/* everyone blinks now and then */
.eyes,.potEyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5.4s ease-in-out infinite}
.potEyes{animation-delay:-2.6s}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
/* foreground grass sways with the garden flowers */
.tuft{transform-box:fill-box;transform-origin:50% 100%;animation:pSway 3.8s ease-in-out infinite}
.tuft.t2{animation-duration:4.6s;animation-delay:-1.3s}.tuft.t3{animation-duration:5.2s;animation-delay:-2.7s}
/* pollen drifts up through the sunlight */
.mote{animation:mote 9s linear infinite;opacity:0}
.mote.m2{animation-delay:-2.2s}.mote.m3{animation-delay:-4.1s}.mote.m4{animation-delay:-6.3s}.mote.m5{animation-delay:-7.5s}
@keyframes mote{0%{opacity:0;transform:translate(0,0)}18%{opacity:.75}80%{opacity:.55}100%{opacity:0;transform:translate(14px,-78px)}}
/* the ladybug patrols the rim of the pot */
.bugWalk{animation:bugWalk 26s linear infinite}
@keyframes bugWalk{0%{transform:translateX(0) scaleX(1)}46%{transform:translateX(150px) scaleX(1)}50%{transform:translateX(150px) scaleX(-1)}96%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
.bugLegs{animation:bugLegs .3s steps(2) infinite}
@keyframes bugLegs{from{transform:translateY(0)}to{transform:translateY(.8px)}}
/* the snail takes all day */
.snailGo{animation:snailGo 44s ease-in-out infinite alternate}
@keyframes snailGo{from{transform:translateX(0)}to{transform:translateX(-30px)}}
.snEyes{transform-box:fill-box;transform-origin:30% 100%;animation:snEye 3.2s ease-in-out infinite alternate}
@keyframes snEye{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
/* the bee arrives with the flower and stays for the fruit */
#bee{opacity:0;transition:opacity .6s ease 1s}
#scene:is([data-s="flower"],[data-s="fruit"]) #bee{opacity:1}
.beeFly{animation:beeHover 7.5s ease-in-out infinite}
@keyframes beeHover{0%{transform:translate(0,0)}22%{transform:translate(-58px,-18px)}48%{transform:translate(-26px,16px)}74%{transform:translate(-86px,-32px)}100%{transform:translate(0,0)}}
.bw{transform-box:fill-box;transform-origin:50% 100%;animation:beeWing .13s linear infinite alternate}
@keyframes beeWing{from{transform:scaleY(1)}to{transform:scaleY(.25)}}
/* the watering can hops over and gives the sprout a drink */
#canRig{transform-box:fill-box;transform-origin:40% 64%}
#can.pour #canRig{animation:canPour 1.95s cubic-bezier(.45,0,.2,1) both}
@keyframes canPour{0%{transform:translate(0,0) rotate(0deg)}24%{transform:translate(82px,-164px) rotate(-8deg)}38%,74%{transform:translate(92px,-170px) rotate(36deg)}100%{transform:translate(0,0) rotate(0deg)}}
.wdrop,.wstream{opacity:0}
#can.flow .wstream{opacity:1;animation:wflow .35s linear infinite}
@keyframes wflow{to{stroke-dashoffset:-9}}
#can.flow .wdrop{animation:wdrop .42s linear infinite}
#can.flow .wdrop:nth-child(2){animation-delay:.1s}#can.flow .wdrop:nth-child(3){animation-delay:.21s}#can.flow .wdrop:nth-child(4){animation-delay:.32s}
@keyframes wdrop{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(40px,62px);opacity:0}}
#soil{transition:filter .7s ease}
#scene.wet #soil{filter:brightness(.78) saturate(1.1)}
/* the sun leans in while the small plant grows */
#scene.shine .sun-halo{animation:sunBurst 2.4s ease-in-out both}
@keyframes sunBurst{0%,100%{transform:scale(1);opacity:.9}40%{transform:scale(1.5);opacity:1}}
/* a puff of soil when the seed lands */
.sp{opacity:0}
#soilPuff.go .sp{animation:soilPuff .8s ease-out both}
@keyframes soilPuff{0%{opacity:0;transform:translate(0,0) scale(.5)}18%{opacity:.95}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.15)}}
/* stems draw themselves upward, leaves unfurl from the stem one after another */
.stemA,.stemB,.stemC{stroke-dasharray:1 1.1;stroke-dashoffset:1.02;transition:stroke-dashoffset 1.3s cubic-bezier(.3,.5,.3,1)}
.stemA{transition-duration:.8s}.stemC{transition-duration:.6s}
#scene[data-s="sprout"] #g-sprout .stemA,
#scene:is([data-s="small"],[data-s="flower"],[data-s="fruit"]) #g-small .stemB,
#scene:is([data-s="flower"],[data-s="fruit"]) #g-flower .stemC{stroke-dashoffset:0}
.leaf{transform-box:fill-box;transform-origin:100% 100%;transform:scale(0) rotate(16deg);transition:transform .9s var(--spring)}
.leaf.rt{transform-origin:0% 100%;transform:scale(0) rotate(-16deg)}
#scene[data-s="sprout"] #g-sprout .leaf,
#scene:is([data-s="small"],[data-s="flower"],[data-s="fruit"]) #g-small .leaf{transform:scale(1) rotate(0deg)}
#g-sprout .lfA{transition-delay:.38s}#g-sprout .lfB{transition-delay:.52s}
#g-small .lf1{transition-delay:.3s}#g-small .lf2{transition-delay:.55s}#g-small .lf3{transition-delay:.8s}#g-small .lf4{transition-delay:1.05s}
/* petals open with a little twist */
.petal{transform:scale(0) rotate(-30deg)}
#scene:is([data-s="flower"],[data-s="fruit"]) .petal{transform:scale(1) rotate(0deg)}
/* small blooms on the side branches: they open with the flower and turn into the fruit */
.sbloom{transform-box:fill-box;transform-origin:50% 50%;transform:scale(0);opacity:1;transition:transform .6s var(--spring) .75s,opacity .35s ease}
.sbloom.s2{transition-delay:.9s,0s}.sbloom.s3{transition-delay:1.05s,0s}
#scene[data-s="flower"] .sbloom{transform:scale(1)}
#scene[data-s="fruit"] .sbloom{transform:scale(0);opacity:0;transition:transform .45s ease-in,opacity .3s ease}
/* fruit pops where the blooms were, hangs and sways, then ripens from green */
.frtSw{transform-box:fill-box;transform-origin:50% 0%;animation:frtSwing 5s ease-in-out infinite}
.frtSw.sw2{animation-delay:-1.7s}.frtSw.sw3{animation-delay:-3.3s}
@keyframes frtSwing{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.frt{transform-box:fill-box;transform-origin:50% 6%;transform:scale(0);transition:transform .75s var(--spring) .3s}
#scene[data-s="fruit"] .frt{transform:scale(1)}
#scene[data-s="fruit"] .frt.f2{transition-delay:.5s}#scene[data-s="fruit"] .frt.f3{transition-delay:.7s}
.frt .unripe{opacity:1;transition:opacity 1.5s ease 1.45s}
#scene[data-s="fruit"] .frt .unripe{opacity:0}
#scene:not([data-s="fruit"]) .frt .unripe{transition:none}
/* the option tiles and the strip show this game's own flower and fruit */
#opts{--fg:255,196,0;--fr:255,45,45}
.lens.flower{background:radial-gradient(circle at 42% 36%,#EAF6FF 0%,#8EC9F5 38%,#3A8FD9 76%,#163F73 100%)}
.opt.right[data-c="flower"]{box-shadow:0 0 0 4px rgba(var(--fg),.38),0 0 24px rgba(var(--fg),.55),0 5px 0 rgba(var(--fg),.4)}
.opt.right[data-c="fruit"]{box-shadow:0 0 0 4px rgba(var(--fr),.35),0 0 24px rgba(var(--fr),.55),0 5px 0 rgba(var(--fr),.4)}
.lens.ic>svg{width:1.3em;height:1.3em;position:relative;z-index:1;overflow:visible;filter:drop-shadow(0 1px 1px rgba(0,0,0,.28))}
.lite .mote,.lite .tuft,.lite .snailGo,.lite .bugWalk,.lite .frtSw{animation:none!important}
@media (prefers-reduced-motion:reduce){
  .leaf,.stemA,.stemB,.stemC,.frt,.frt .unripe,.sbloom,#bee,#soil{transition:none}
  .sp,.wdrop,.wstream{display:none}
}

/* ===================== AUTO-FIT PASS 3 — fit check =====================
   Measured on 360×640, 375×667, 375×553, 412×732 and 320×568 phones, 768×954 /
   768×1024 tablets and 667×375 / 844×390 landscape phones. Earlier passes left
   two floors under the picture (31vh on ≤360 px phones, 140 px on short phones)
   that pushed the Controls card below the screen edge; on portrait tablets the
   picture's own aspect ratio set the row height. The picture now takes whatever
   is left after the choices and the two buttons — which keep finger-sized pads. */
/* the drawn flower chip sits in the strip at the same size as the emoji chips */
.chip svg{width:1.22em;height:1.22em}
html[data-layout-mode="auto-fit"] .chip svg{width:1.22em;height:1.22em}

/* portrait tablets (601–940 px): the picture keeps its box but stops dictating the row's height */
@media(min-width:601px) and (max-width:940px) and (orientation:portrait){
  html[data-layout-mode="auto-fit"] .scene{position:absolute;inset:0;width:100%;height:100%}
  html[data-layout-mode="auto-fit"] .stage{min-height:clamp(220px,34vh,560px)}
  html[data-layout-mode="auto-fit"] #opts .lens{width:clamp(44px,6vh,56px);height:clamp(44px,6vh,56px)}
  html[data-layout-mode="auto-fit"] #opts .opt{padding:8px 6px 7px}
  html[data-layout-mode="auto-fit"] .ctrl{--bh:clamp(42px,5.4vh,48px)}
}
/* portrait phones (≤600 px, up to 760 px tall): one coherent compact scale */
@media(max-width:600px) and (max-height:760px) and (orientation:portrait){
  html[data-layout-mode="auto-fit"] .topbar{height:clamp(40px,6.4vh,48px)}
  html[data-layout-mode="auto-fit"] .layout{gap:6px;padding:6px 6px 5px}
  html[data-layout-mode="auto-fit"] .stage-card{padding:6px}
  html[data-layout-mode="auto-fit"] .task-header{gap:3px;padding:0 2px 5px}
  html[data-layout-mode="auto-fit"] .task-header>.banner{min-height:36px;font-size:clamp(12px,1.9vh,13px);padding:2px 10px}
  html[data-layout-mode="auto-fit"] .progress .dot{width:18px;height:18px;font-size:9px}
  /* a floor that scales with the screen and no ceiling: the 1fr row hands the picture every spare pixel */
  html[data-layout-mode="auto-fit"] .stage{min-height:clamp(100px,18vh,260px);max-height:none}
  html[data-layout-mode="auto-fit"] .rightcol{gap:6px}
  html[data-layout-mode="auto-fit"] .optcard{padding:5px 8px 5px}
  html[data-layout-mode="auto-fit"] .optcard .opts{margin-top:4px;padding:5px}
  html[data-layout-mode="auto-fit"] #opts{gap:5px}
  html[data-layout-mode="auto-fit"] #opts .opt{padding:4px 4px 3px;gap:2px;min-height:46px}
  html[data-layout-mode="auto-fit"] #opts .lens{width:32px!important;height:32px!important}
  html[data-layout-mode="auto-fit"] #opts .opt b{font-size:12.5px;line-height:1.05}
  html[data-layout-mode="auto-fit"] .optcard .legend{margin-top:3px;font-size:9.8px}
  html[data-layout-mode="auto-fit"] .optcard .sig-status{margin:3px 0 0;font-size:12px}
  html[data-layout-mode="auto-fit"] .ctrl{--cg:5px;--bh:40px;--cb:14px;padding:5px 10px 5px}
  html[data-layout-mode="auto-fit"] .ctrl .conn{margin:0;padding:3px 10px;font-size:11px}
  html[data-layout-mode="auto-fit"] .ctrl #connBtn{min-height:38px;padding:4px 12px;font-size:14px}
  html[data-layout-mode="auto-fit"] .ctrl .control-pair{padding-bottom:4px}
  html[data-layout-mode="auto-fit"] .ctrl .control-pair>#hearBtn,html[data-layout-mode="auto-fit"] .ctrl .control-pair>#irBtn{min-height:44px;padding:5px 8px}
}
/* the shortest portrait screens (phones with the browser bars showing) */
@media(max-width:600px) and (max-height:580px) and (orientation:portrait){
  html[data-layout-mode="auto-fit"] .topbar{height:40px}
  html[data-layout-mode="auto-fit"] .stage{min-height:clamp(80px,15vh,200px)}
  html[data-layout-mode="auto-fit"] .task-header>.banner{min-height:32px;font-size:12px}
  html[data-layout-mode="auto-fit"] #opts .lens{width:26px!important;height:26px!important}

}

}

<script>
/* Keep the auto-fit shell inside the actually visible viewport when mobile browser chrome moves. */
(function(){
  const el=document.documentElement;
  function sizeToViewport(){
    try{
      const vv=window.visualViewport;
      const h=Math.round(vv?(vv.height*(vv.scale||1)):window.innerHeight);
      if(h>0)el.style.setProperty('--vvh',h+'px');
    }catch(e){}
  }
  sizeToViewport();
  addEventListener('resize',sizeToViewport,{passive:true});
  addEventListener('orientationchange',sizeToViewport,{passive:true});
  if(window.visualViewport){
    visualViewport.addEventListener('resize',sizeToViewport,{passive:true});
    visualViewport.addEventListener('scroll',sizeToViewport,{passive:true});
  }
})();
</script>
<script>
/* The layout mode is decided before the first paint — the same query the
   detective series uses — so a phone or tablet never flashes the laptop
   layout on the way in, and the laptop page never flickers into auto-fit. */
try{
  const layoutQuery=matchMedia('(any-hover:hover) and (any-pointer:fine)');
  document.documentElement.dataset.layoutMode=layoutQuery.matches?'original-laptop':'auto-fit';
}catch(e){document.documentElement.dataset.layoutMode='auto-fit';}
</script>

<script>

/* ===================== SMART BLOCK · PLANT GROWTH =====================
   Five steps, one real-life sequence the child learns to predict:

        🌰 Seed → 🌱 Sprout → 🪴 Small Plant → 🌼 Flower → 🍅 Fruit

   Step 1 plants the seed (IR sensor sees a hand / the 🌱 Plant the seed
   button); the seed appears and sinks into the soil. Steps 2–5 ask
   "what happens next?" and the plant on screen shows what the child chose.
   Every game grows a different plant (tomato, strawberry, brinjal, chilli,
   lemon or orange): the stake in the pot names it, the flower and the fruit
   on screen, on the option tiles and in the strip all match.
   The kit is optional. Arduino (Uno / Nano, 9600 baud), IR sensor on D2,
   LEDs on D7 / D8 / D9:
     board → page : "DETECTED"   (IR sensor sees a hand / object)
     page → board : P seed=D7 · S sprout=D8 · G small plant=D9 ·
                    F flower=D7+D8 · T fruit=D7+D9 · O all off          */
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const motion=matchMedia('(prefers-reduced-motion: reduce)');
const NS='http://www.w3.org/2000/svg';
const easeOutCubic=t=>1-Math.pow(1-t,3);


const TOTAL=5;
const CH={off:'O',seed:'P',sprout:'S',small:'G',flower:'F',fruit:'T'};   /* letter → LED combo on the board: P=D7 · S=D8 · G=D9 · F=D7+D8 · T=D7+D9 · O=off */
const FLOW=['seed','sprout','small','flower','fruit'], ORDER=['sprout','small','flower','fruit'];
const CYCLE_TEXT='Order : Seed - Sprout - Small Plant - Flower - Fruit';
const n={stage:$('stage'),banner:$('banner'),status:$('sigStatus'),opts:$('opts'),live:$('live'),strip:$('pstrip'),optTitle:$('optTitle')};
/* the banner is a flex box on phones (vertical centring) - one inline wrapper keeps the spaces between its words */
const setBanner=h=>{n.banner.innerHTML='<span class="bt">'+h+'</span>';};
const optEls=[...document.querySelectorAll('.opt')];
/* ---------- the order of the four choices ----------
   The very first game on this device shows them in growing order - a worked example.
   Every game after that (a refresh, or Play again) deals them out at random, so the
   child has to know what comes next rather than read it off the tiles.            */
const GROW_ORDER=['sprout','small','flower','fruit'];
let optOrder=GROW_ORDER.slice();                  /* which answer sits in slot 0..3 */
const playedBefore=()=>{try{return localStorage.getItem('pg-played')==='1';}catch(e){return false;}};
const markPlayed=()=>{try{localStorage.setItem('pg-played','1');}catch(e){}};
function dealOptions(shuffle){
  let order=GROW_ORDER.slice();
  if(shuffle){
    let last=optOrder.join(',');try{last=localStorage.getItem('pg-order')||last;}catch(e){}   /* last game's order, even across a refresh */
    let guard=0;
    do{                                            /* Fisher-Yates; never the textbook order, never the same deal twice running */
      for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
    }while((order.join(',')===GROW_ORDER.join(',')||order.join(',')===last)&&++guard<40);
    try{localStorage.setItem('pg-order',order.join(','));}catch(e){}
  }
  optOrder=order;
  order.forEach((c,i)=>{const b=optEls.find(x=>x.dataset.c===c);b.dataset.slot=i;n.opts.appendChild(b);});   /* DOM order = visual order (tab order, screen readers) */
}
let round=0,score=0,tries=0,phase='intro',started=false,justDone=-1,epoch=0,timers=[],audio=null,speech=null,light='off',stripDone=0,stripPop=-1;
let lastSay='A pot full of soil is ready for a seed.';
function later(fn,ms){const e=epoch;const id=setTimeout(()=>{if(e===epoch)fn();},ms);timers.push(id);return id;}
function clearTimers(){timers.forEach(clearTimeout);timers=[];}
/* ---------- sound ---------- */
function ctx(){
  try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();
    if(audio.state==='suspended')audio.resume();}catch(e){audio=null;}
  return audio;
}
function tone(freq,duration=.12,delay=0,type='sine',vol=.06){
  const a=ctx();if(!a)return;
  try{
    const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+.015);
    g.gain.exponentialRampToValueAtTime(.0001,t+duration);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+duration+.03);
  }catch(e){}
}
function sweep(f0,f1,duration,type='sawtooth',vol=.035,delay=0){
  const a=ctx();if(!a)return;
  try{
    const o=a.createOscillator(),g=a.createGain(),lp=a.createBiquadFilter(),t=a.currentTime+delay;
    o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+duration);
    lp.type='lowpass';lp.frequency.value=900;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.08);
    g.gain.exponentialRampToValueAtTime(.0001,t+duration);
    o.connect(lp);lp.connect(g);g.connect(a.destination);o.start(t);o.stop(t+duration+.05);
  }catch(e){}
}
const rightSnd=()=>{tone(523,.16,0,'triangle',.1);tone(659,.16,.12,'triangle',.1);tone(784,.3,.24,'triangle',.12);};
const wrongSnd=()=>{tone(250,.2,0,'sawtooth',.06);tone(220,.3,.2,'sawtooth',.06);};
const clickSnd=()=>{tone(1500,.03,0,'square',.025);tone(950,.05,.035,'square',.02);};
const waterSnd=()=>{for(let i=0;i<7;i++)tone(1500+Math.random()*1000,.05,.74+i*.09,'sine',.028);sweep(700,420,.7,'sine',.02,.7);};
function cheerSnd(){
  tone(523,.3,0,'triangle',.075);tone(659,.3,.14,'triangle',.075);tone(784,.34,.28,'triangle',.08);
  tone(1047,.5,.44,'triangle',.085);tone(1319,.44,.6,'sine',.05);
}

/* ---------- speech: read on arrival; tap the banner (or press H) to hear it again ---------- */
function stopSpeech(){
  if(speech){speech.onend=speech.onerror=null;speech=null;}
  if('speechSynthesis' in window)try{speechSynthesis.cancel();}catch(e){}
}
function speak(text){
  if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window))return;
  stopSpeech();
  const u=new SpeechSynthesisUtterance(text);
  speech=u;u.lang='en';u.rate=.9;u.pitch=1.08;
  u.onend=u.onerror=()=>{if(speech===u)speech=null;};
  try{speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){}
}
function announce(t){n.live.textContent='';setTimeout(()=>{n.live.textContent=t;},30);}

/* ---------- small animation helpers ---------- */
function pop(el,frames,dur){
  if(!el||motion.matches||!el.animate)return;
  try{el.animate(frames,{duration:dur,easing:'cubic-bezier(.22,1,.36,1)'});}catch(e){}
}
function confetti(count){
  if(motion.matches)return;
  const shell=document.createElement('div');shell.className='confetti';
  const colors=['#83358C','#F01A8C','#FFF212','#2FBF6D','#70CDF0'];
  for(let i=0;i<count;i++){
    const s=document.createElement('i');
    s.style.left=Math.random()*100+'vw';
    s.style.background=colors[i%colors.length];
    s.style.animation=`cf${i%3} ${1.5+Math.random()*.7}s linear ${Math.random()*.3}s forwards`;
    shell.appendChild(s);
  }
  const st=document.createElement('style');
  st.textContent='@keyframes cf0{to{transform:translate3d(0,105vh,0) rotate(720deg);opacity:.9}}'+
    '@keyframes cf1{to{transform:translate3d(0,105vh,0) rotate(-540deg);opacity:.9}}'+
    '@keyframes cf2{to{transform:translate3d(0,105vh,0) rotate(360deg);opacity:.9}}';
  shell.appendChild(st);document.body.appendChild(shell);
  setTimeout(()=>shell.remove(),2400);
}

const TIC_OK='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#2FBF6D"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const TIC_AGAIN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#FFC21A"/><circle cx="12" cy="12" r="11" fill="none" stroke="#E0A400" stroke-width="1.2"/><path d="M9.2 9.3a2.9 2.9 0 1 1 3.9 2.7c-.8.4-1.1.9-1.1 1.7v.5" fill="none" stroke="#5C2563" stroke-width="2.3" stroke-linecap="round"/><circle cx="12" cy="17.6" r="1.4" fill="#5C2563"/></svg>';
function toast(kind,title){
  n.stage.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');
  t.className='toast'+(kind==='again'?' again':'');
  t.innerHTML=`<span class="tic">${kind==='again'?TIC_AGAIN:TIC_OK}</span><b>${title}</b>`;
  n.stage.appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320);},1100);
}


const SFX={
  seed:()=>{sweep(600,180,.4,'sine',.05);tone(180,.16,.32,'triangle',.08);},
  sprout:()=>{tone(392,.14,0,'triangle',.08);tone(523,.2,.12,'triangle',.08);},
  small:()=>{tone(523,.14,0,'triangle',.08);tone(587,.14,.11,'triangle',.08);tone(659,.22,.22,'triangle',.09);},
  flower:()=>{tone(880,.16,0,'sine',.07);tone(1175,.16,.12,'sine',.06);tone(1568,.3,.24,'sine',.06);},
  fruit:()=>{tone(659,.14,0,'triangle',.09);tone(784,.14,.12,'triangle',.09);tone(1047,.34,.24,'triangle',.1);}
};
const ASK={
  seed:    {banner:'Press <b>🌱 Plant the seed</b> to plant the seed',status:'A pot full of <b>soil</b> is ready.',say:'Press the Plant the seed button to plant the seed.'},
  seedKit: {banner:'Wave your <b>hand</b> over the sensor',status:'A pot full of <b>soil</b> is ready.',say:'Wave your hand over the sensor.'},
  sprout:  {banner:'We planted a <b>seed</b>. What happens next?',status:'The seed is sleeping <b>in the soil</b>.',say:'We planted a seed. What happens next?'},

<script>
/* Select the responsive shell by input capability, not laptop window size.
   A mouse/trackpad laptop keeps its original UI even in a narrow window.
   Phones and tablets get the auto-fit shell, including in either orientation. */
(function(){
  var root=document.documentElement,frame=0;
  var fineHover=window.matchMedia?window.matchMedia('(any-hover: hover) and (any-pointer: fine)'):null;
  function syncLayout(){
    frame=0;
    root.setAttribute('data-layout-mode',fineHover&&fineHover.matches?'original-laptop':'auto-fit');
    if(root.getAttribute('data-layout-mode')==='auto-fit'){
      var vv=window.visualViewport;
      var height=vv?vv.height*(vv.scale||1):window.innerHeight;
      if(height>0)root.style.setProperty('--vvh',Math.round(height)+'px');
    }else root.style.removeProperty('--vvh');
  }
  function schedule(){if(!frame)frame=window.requestAnimationFrame(syncLayout);}
  syncLayout();
  if(fineHover){
    if(fineHover.addEventListener)fineHover.addEventListener('change',schedule);
    else if(fineHover.addListener)fineHover.addListener(schedule);
  }
  window.addEventListener('resize',schedule,{passive:true});
  window.addEventListener('orientationchange',schedule,{passive:true});
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',schedule,{passive:true});
    window.visualViewport.addEventListener('scroll',schedule,{passive:true});
  }
})();
</script>

}

.right{position:relative;display:flex;flex-direction:column;gap:clamp(8px,1.1vh,13px);min-height:0}.question-card{padding:clamp(11px,1.5vh,17px);flex:1 1 auto;min-height:0;display:flex;flex-direction:column}.question-card p{margin:0 0 clamp(7px,1.1vh,12px);font-size:clamp(11px,1.35vh,13px);color:var(--muted);flex:0 0 auto}.shape-zone{display:none}.shape{width:125px;height:125px;background:var(--pink);box-shadow:0 9px 0 rgba(176,18,104,.40);animation:shapeIn .45s cubic-bezier(.2,1.5,.4,1)}@keyframes shapeIn{from{transform:scale(.35) rotate(-15deg);opacity:.2}to{transform:scale(1);opacity:1}}.circle{border-radius:50%}.rectangle{width:165px;height:105px;border-radius:10px}.square{border-radius:10px}.triangle{width:0;height:0;background:transparent;box-shadow:none;border-left:72px solid transparent;border-right:72px solid transparent;border-bottom:130px solid var(--pink)}.oval{width:155px;height:105px;border-radius:50%}

.ov{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.80);display:flex;align-items:center;justify-content:center;transition:opacity .35s}.ov.hide{opacity:0;pointer-events:none}.ov.hide .ov-box{transform:scale(.9) translateY(10px)}.ov-box{background:var(--yellow);border-radius:28px;padding:30px 42px;text-align:center;box-shadow:0 22px 50px -20px #000;max-width:413px;border:5px solid var(--purple);transition:transform .35s cubic-bezier(.22,1,.36,1)}.ov-icon{font-size:64px;line-height:1;margin-bottom:4px;animation:ovBob 2.4s ease-in-out infinite}.shape-burst{height:94px;display:flex;align-items:center;justify-content:center;gap:13px;margin:0 auto 7px;animation:ovBob 2.4s ease-in-out infinite}.mini-shape{display:block;width:48px;height:48px;box-shadow:0 5px 0 rgba(92,37,99,.28)}.mini-circle{background:#F01A8C;border-radius:50%}.mini-triangle{width:0;height:0;background:transparent;box-shadow:none;border-left:28px solid transparent;border-right:28px solid transparent;border-bottom:50px solid var(--purple)}.mini-square{background:var(--black);border-radius:10px}.ov-box h2{font-family:var(--font-display);font-size:clamp(26px,4.6vh,40px);font-weight:700;margin:0 0 12px;color:var(--deep);line-height:1.15}.ov-lead{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--pink);margin:0 0 8px;line-height:1.25}.ov-task{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--ink);margin:0 0 22px;line-height:1.25}.ov-task span{display:inline-block;min-width:44px;padding:2px 10px;border-radius:11px;background:var(--purple);color:var(--yellow)}#start{background:var(--pink);color:#fff;border:0;border-radius:18px;padding:13px 36px;font-family:var(--font-display);font-size:21px;font-weight:700;line-height:1.2;
  box-shadow:0 7px 0 var(--pink-dk),0 14px 22px -10px rgba(0,0,0,.55);
  position:relative;overflow:hidden;-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
#start::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.10) 40%,rgba(255,255,255,0) 60%)}
#start::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.12)}
#start:hover{transform:translateY(-3px);box-shadow:0 10px 0 var(--pink-dk),0 18px 26px -12px rgba(0,0,0,.5)}
#start:active{transform:translateY(4px);box-shadow:0 3px 0 var(--pink-dk)}
@keyframes shRise{from{opacity:0;transform:translateY(14px)}}
.ov-box h2{animation:shRise .5s cubic-bezier(.22,1,.36,1) backwards}
.ov-box .ov-lead{animation:shRise .5s .1s cubic-bezier(.22,1,.36,1) backwards}
.ov-box #start{animation:shRise .5s .2s cubic-bezier(.22,1,.36,1) backwards}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;display:grid;place-items:center}.welcome{background:var(--yellow);border:5px solid var(--purple);border-radius:26px;padding:28px 42px;text-align:center;max-width:450px;box-shadow:0 20px 50px rgba(0,0,0,.5)}.welcome h2{margin:4px 0 8px;font:700 39px var(--font-display);color:var(--deep)}.welcome p{margin:0 0 18px;font:600 20px var(--font-display);color:var(--pink)}.start{border:0;border-radius:15px;background:var(--pink);color:white;padding:13px 30px;font:700 21px var(--font-display);box-shadow:0 6px 0 var(--pink-dk)}.hide{opacity:0;pointer-events:none;transition:.3s}
@media(max-width:850px){html[data-layout-mode="auto-fit"] body{overflow:auto}html[data-layout-mode="auto-fit"] .layout{height:auto;min-height:0;grid-template-columns:1fr;padding:12px}html[data-layout-mode="auto-fit"] .stage-card{min-height:min(60vh,430px)}html[data-layout-mode="auto-fit"] .option{min-height:96px}html[data-layout-mode="auto-fit"] .mini{width:56px;height:56px}html[data-layout-mode="auto-fit"] .right{min-height:0}html[data-layout-mode="auto-fit"] .options{gap:5px}html[data-layout-mode="auto-fit"] .option{font-size:10px}html[data-layout-mode="auto-fit"] .topbar{padding:8px 14px}}
@media(max-width:530px){html[data-layout-mode="auto-fit"] .options{grid-template-columns:repeat(3,1fr)}html[data-layout-mode="auto-fit"] .layout{grid-template-columns:minmax(0,1fr)}html[data-layout-mode="auto-fit"] .board{width:190px;font-size:16px}html[data-layout-mode="auto-fit"] .speech{font-size:17px}html[data-layout-mode="auto-fit"] .welcome{margin:18px;padding:24px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}}

/* ================= Kit: motion polish ================= */
/* Missing keyframes referenced by the original markup */
@keyframes ovBob{50%{transform:translateY(-9px)}}
@keyframes loadPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}

/* --- Option tiles: staggered entrance --- */
@keyframes optIn{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
.option{animation:optIn .34s cubic-bezier(.2,1.2,.3,1) backwards}
.option:nth-child(1){animation-delay:.03s}.option:nth-child(2){animation-delay:.08s}
.option:nth-child(3){animation-delay:.13s}.option:nth-child(4){animation-delay:.18s}
.option:nth-child(5){animation-delay:.23s}

/* Richer hover/press on the big tiles */
.option{transition:transform .18s cubic-bezier(.2,1.3,.35,1),box-shadow .18s,border-color .18s,background .25s}
.option:hover:not(.correct):not(.wrong){transform:translateY(-5px) scale(1.02);box-shadow:0 12px 20px -12px rgba(92,37,99,.55)}
.option:active:not(.correct):not(.wrong){transform:translateY(-1px) scale(.99)}
.option .mini{transition:transform .22s cubic-bezier(.2,1.4,.35,1)}
.option:hover:not(.correct):not(.wrong) .mini{transform:scale(1.08) rotate(-3deg)}

/* --- Answer feedback --- */
@keyframes tileRight{0%{transform:scale(1)}35%{transform:scale(1.07)}70%{transform:scale(.98)}100%{transform:scale(1)}}
@keyframes tileWrong{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.option.correct{animation:tileRight .5s cubic-bezier(.3,1.5,.4,1)}
.option.wrong{animation:tileWrong .42s ease}
.option.correct .mini{animation:miniPop .45s cubic-bezier(.3,1.6,.4,1)}
@keyframes miniPop{0%{transform:scale(1)}45%{transform:scale(1.22) rotate(5deg)}100%{transform:scale(1)}}

/* Dim the non-answers once a choice is locked in */
.options.locked .option:not(.correct):not(.wrong){opacity:.5;filter:saturate(.6);transition:opacity .3s,filter .3s}

/* --- Speech bubble reacts to each new question --- */
@keyframes speechIn{0%{transform:scale(.9) translateY(6px);opacity:0}60%{transform:scale(1.03)}100%{transform:none;opacity:1}}
.speech.pop{animation:speechIn .38s cubic-bezier(.2,1.4,.35,1)}

/* --- Status strip + score --- */
@keyframes statusIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.status{animation:statusIn .3s ease}
@keyframes scoreBump{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
.score.bump{animation:scoreBump .45s cubic-bezier(.3,1.6,.4,1)}
.status-icon{display:inline-block;flex:0 0 auto;line-height:1}
@keyframes iconCheer{0%{transform:scale(1) rotate(0)}30%{transform:scale(1.3) rotate(-12deg)}60%{transform:scale(1.15) rotate(9deg)}100%{transform:scale(1) rotate(0)}}
.status-icon.cheer{animation:iconCheer .6s cubic-bezier(.3,1.5,.4,1)}

/* --- Tinyo reacts --- */
@keyframes tinyoHop{0%,100%{transform:translateY(0)}30%{transform:translateY(-13px)}55%{transform:translateY(0)}75%{transform:translateY(-6px)}}
@keyframes tinyoShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.stage.happy{animation:tinyoHop .75s cubic-bezier(.3,1.3,.4,1)}
.stage.oops{animation:tinyoShake .45s ease}

/* --- Buttons --- */
.next,.hear,.retry,.new-quiz{transition:transform .14s cubic-bezier(.2,1.3,.35,1),filter .14s,box-shadow .14s}
.next:not(:disabled):hover,.hear:hover{transform:translateY(-2px)}
.next.ready{animation:loadPulse 1.5s ease-in-out 2}
.next:disabled{animation:none}

/* --- Final card --- */
@keyframes finalIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.final.show{animation:finalIn .4s cubic-bezier(.2,1.3,.35,1)}

/* --- Confetti for a perfect finish --- */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:1200;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:10px;height:14px;border-radius:2px;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}

@media (prefers-reduced-motion:reduce){
  .option,.option.correct,.option.wrong,.option.correct .mini,
  .speech.pop,.status,.score.bump,.status-icon.cheer,
  .stage.happy,.stage.oops,.next:not(:disabled),.final.show,.confetti i,.sparkles i{animation:none !important}
  .option:hover{transform:none !important}
}

/* ================= Tinyo — live character ================= */
.stage .ground{position:absolute;left:0;right:0;bottom:0;height:27%;
  background:linear-gradient(180deg,#9BDCA6 0%,#7FCF90 100%);
  border-top:4px solid #6FC080;z-index:1}
.stage .ground:after{content:"";position:absolute;left:0;right:0;top:38%;height:5px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 26px,transparent 26px 58px);border-radius:3px}

.tinyo{position:absolute;left:50%;bottom:16%;height:64%;aspect-ratio:1/1;
  transform:translateX(-50%);z-index:4;will-change:transform}
.tinyo svg{display:block;width:100%;height:100%;overflow:visible}

/* body-part rigging */
.arm-l,.arm-r{transform-box:fill-box;transform-origin:top center}
.leg-l,.leg-r{transform-box:fill-box;transform-origin:top center}
.pupil{transform-box:fill-box;transform-origin:center}
.ant{transform-box:fill-box;transform-origin:bottom center}
.lid{opacity:0;transition:opacity .12s}

/* ---- IDLE: gentle breathing, antenna wobble, blinking ---- */
.tinyo{animation:tBreathe 3.6s ease-in-out infinite}
@keyframes tBreathe{0%,100%{transform:translateX(-50%) translateY(0) scale(1,1)}
  50%{transform:translateX(-50%) translateY(-5px) scale(1.012,.988)}}
.ant{animation:antWob 3.1s ease-in-out infinite}
@keyframes antWob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.t-idle .pupil{animation:eyeWander 5.2s ease-in-out infinite}
@keyframes eyeWander{0%,100%{transform:translate(0,0)}30%{transform:translate(-3px,1px)}60%{transform:translate(3px,-1px)}}
.tinyo.blink .lid{opacity:1}

/* ---- HAPPY: dance, wave, kick, eyes bounce ---- */
.tinyo.anim-happy{animation:tDance .62s ease-in-out 5}
@keyframes tDance{
  0%{transform:translateX(-50%) translateY(0) rotate(-6deg) scale(1)}
  25%{transform:translateX(-50%) translateY(-20px) rotate(0) scale(1.05)}
  50%{transform:translateX(-50%) translateY(0) rotate(6deg) scale(1)}
  75%{transform:translateX(-50%) translateY(-20px) rotate(0) scale(1.05)}
  100%{transform:translateX(-50%) translateY(0) rotate(-6deg) scale(1)}}
.t-happy .arm-l{animation:wave1 .62s ease-in-out 5}
.t-happy .arm-r{animation:wave2 .62s ease-in-out 5}
.t-happy .leg-l{animation:kick1 .62s ease-in-out 5}
.t-happy .leg-r{animation:kick2 .62s ease-in-out 5}
.t-happy .pupil{animation:eyeDance .62s ease-in-out 5}
.t-happy .ant{animation:antExcited .31s ease-in-out 10}
@keyframes wave1{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(54deg)}}
@keyframes wave2{0%,100%{transform:rotate(54deg)}50%{transform:rotate(-26deg)}}
@keyframes kick1{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@keyframes kick2{0%,100%{transform:rotate(10deg)}50%{transform:rotate(-10deg)}}
@keyframes eyeDance{0%,100%{transform:translate(-2px,-1px)}50%{transform:translate(2px,1px)}}
@keyframes antExcited{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}

/* ---- SAD: slump, sway, droopy arms, eyes down ---- */
.tinyo.anim-sad{animation:tSad 2.0s ease-in-out 2}
@keyframes tSad{0%,100%{transform:translateX(-50%) translateY(6px) rotate(0) scale(1,.985)}
  50%{transform:translateX(-50%) translateY(9px) rotate(-2deg) scale(1,.975)}}
.t-sad .arm-l{animation:droopL 2.0s ease-in-out 2}
.t-sad .arm-r{animation:droopR 2.0s ease-in-out 2}
@keyframes droopL{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(-14deg)}}
@keyframes droopR{0%,100%{transform:rotate(4deg)}50%{transform:rotate(14deg)}}
.t-sad .pupil{transform:translateY(4px)}
.t-sad .ant{animation:antDroop 2.0s ease-in-out 2}
@keyframes antDroop{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(-26deg)}}

/* sparkles on a correct answer */
.sparkles{position:absolute;inset:0;z-index:8;pointer-events:none}
.sparkles i{position:absolute;font-size:26px;opacity:0;animation:cheerUp 1.1s ease-out forwards}
@keyframes cheerUp{0%{opacity:0;transform:translateY(10px) scale(.6)}
  30%{opacity:1}100%{opacity:0;transform:translateY(-64px) scale(1.25) rotate(18deg)}}

@media (prefers-reduced-motion:reduce){
  .tinyo,.tinyo.anim-happy,.tinyo.anim-sad,.ant,.t-idle .pupil,
  .t-happy .arm-l,.t-happy .arm-r,.t-happy .leg-l,.t-happy .leg-r,.t-happy .pupil,.t-happy .ant,
  .t-sad .arm-l,.t-sad .arm-r,.t-sad .ant,.sparkles i{animation:none !important}
}

/* Auto-advance: the Next button fills to show time remaining */
.next{position:relative;overflow:hidden}
.next.auto{background:var(--pink)}
.next.auto:after{content:"";position:absolute;left:0;top:0;bottom:0;width:100%;
  background:rgba(255,255,255,.30);transform-origin:left center;
  animation:autoFill 2.3s linear forwards;pointer-events:none}
@keyframes autoFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.next.auto:after{animation:none;transform:scaleX(0)}}

/* ===== Answer feedback: recolour the SHAPE itself, not a box behind it =====
   .mini.triangle is drawn with CSS borders and has no background, so setting
   background: green painted a green square behind a still-purple triangle.
   Border-drawn shapes must have their border-color set instead.           */
.option.correct .mini{background:var(--green)}
.option.wrong   .mini{background:var(--red)}
.option.correct .mini.triangle{background:transparent;border-bottom-color:var(--green)}
.option.wrong   .mini.triangle{background:transparent;border-bottom-color:var(--red)}

/* ================= Colour polish: bold where it carries meaning ================= */

/* --- Answer tiles: stronger fill, thicker border, high-contrast label --- */
.option.correct{
  background:#D6F7E2;border-color:var(--green);border-width:3px;color:#12693A;
  box-shadow:0 0 0 4px rgba(47,191,109,.20),0 10px 20px -14px rgba(18,105,58,.7)}
.option.wrong{
  background:#FFE0DD;border-color:var(--red);border-width:3px;color:#8F2119;
  box-shadow:0 0 0 4px rgba(224,67,58,.20),0 10px 20px -14px rgba(143,33,25,.7)}
.option.correct,.option.wrong{font-weight:700}

/* Shapes in feedback state: deeper, fully saturated */
.option.correct .mini{background:#1FA85B}
.option.wrong   .mini{background:#D6291F}
.option.correct .mini.triangle{background:transparent;border-bottom-color:#1FA85B}
.option.wrong   .mini.triangle{background:transparent;border-bottom-color:#D6291F}
.option.correct .mini,.option.wrong .mini{filter:drop-shadow(0 3px 0 rgba(0,0,0,.13))}

/* Unpicked tiles: recede without turning grey-muddy */
.options.locked .option:not(.correct):not(.wrong){
  opacity:.42;filter:none;transition:opacity .3s}

/* Idle tiles: give the brand purple more presence */
.mini{filter:drop-shadow(0 3px 0 rgba(92,37,99,.22))}
.option{border-width:2.5px}
.option:hover:not(.correct):not(.wrong){border-color:var(--pink);background:#FFF8FC}

/* --- Status strip colour-codes the result --- */
.status{transition:background .35s,color .35s;border:2px solid transparent}







/* --- Speech bubble: bolder brand frame --- */
.speech{border-width:4px;box-shadow:0 6px 0 rgba(92,37,99,.16)}
.speech.good{border-color:var(--green);color:#12693A}
.speech.good:after{border-top-color:var(--green)}
.speech.bad{border-color:var(--pink);color:var(--pink-dk)}
.speech.bad:after{border-top-color:var(--pink)}

/* --- Buttons: solid, confident --- */
.new-quiz{background:var(--purple);color:#fff}
.new-quiz:hover{filter:brightness(1.08)}
.retry{border-width:3px;font-weight:700}
.retry:hover{background:var(--pink);color:#fff}
.hear{box-shadow:0 5px 0 var(--yellow-dk)}
.hear:active{transform:translateY(3px);box-shadow:0 2px 0 var(--yellow-dk)}
.next{font-weight:700}

/* --- Instruction line: readable, not faint --- */
.question-card p{color:var(--purple-deep);font-weight:600}

/* ================= Results card: the celebration moment ================= */
.final{
  background:linear-gradient(165deg,var(--yellow) 0%,#FFF9A8 55%,#FFF6D0 100%);
  border:5px solid var(--purple);
  box-shadow:0 20px 44px -22px rgba(92,37,99,.75);
  padding:clamp(16px,3vh,30px)}
.final>div{display:flex;flex-direction:column;align-items:center;gap:clamp(5px,1vh,10px)}
.final .trophy{font-size:clamp(42px,8.5vh,66px);line-height:1;
  filter:drop-shadow(0 6px 0 rgba(92,37,99,.20));animation:trophyPop .6s cubic-bezier(.3,1.6,.4,1)}
@keyframes trophyPop{0%{transform:scale(.4) rotate(-14deg);opacity:0}
  60%{transform:scale(1.12) rotate(5deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.final h2{margin:0;font:700 clamp(24px,4.6vh,38px) var(--font-display);color:var(--purple-deep)}
.final p{margin:0;font-size:clamp(13px,2vh,17px);font-weight:600;color:var(--purple-deep);max-width:30ch}
/* the score, front and centre */
.final .tally{font:700 clamp(34px,7vh,58px) var(--font-display);color:var(--pink);line-height:1}
.final .tally small{font-size:.45em;color:var(--purple-deep);font-weight:600}
.final .next{max-width:290px;background:var(--pink);box-shadow:0 6px 0 var(--pink-dk)}
.final .next:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-dk)}
@media (prefers-reduced-motion:reduce){.final .trophy{animation:none}}


/* ============ Bottom bar — matched to reference (rocket_launch .verdict)
   Measured from the reference screenshot pixel-by-pixel:
     title   #161016  SB Display 19px / 700
     subline #161016  SB Text 14.5px / 400
     tally   #5D2465  SB Display 34px / 700   (purple-deep, NOT black)
     bg      #F5F1F7
   Tally recolours per state: purple-deep -> green / red.        */
.status{gap:13px;border-radius:12px;background:#F5F1F7;color:#161016}
.status b{
  font-family:var(--font-display);
  font-size:clamp(16px,2.6vh,19px);
  font-weight:700;line-height:1.25;color:inherit}
.status span{
  font-family:var(--font-text);
  font-size:clamp(12.5px,2vh,14.5px);
  font-weight:400;line-height:1.4;color:inherit}
.status-icon{font-size:clamp(26px,4vh,32px)}
.score{
  margin-left:auto;
  font-family:var(--font-display);
  font-size:clamp(26px,4.6vh,34px);
  font-weight:700;line-height:1;white-space:nowrap;
  color:#5D2465;transition:color .35s ease}

/* States: bar tint + text, with the tally carrying its own accent */
.status.ok{background:#DFF7E8;color:#1D7A45;border-color:var(--green)}
.status.no{background:#FFE9E7;color:#A32A22;border-color:var(--red)}
.status.ok .score{color:#1D7A45}
.status.no .score{color:#A32A22}

/* ============ Action buttons — matched to reference (rocket_launch .btn)
   Sampled from the reference image:
     yellow  bg #FFF212  text #161016  shadow #DEC400   (no border)
     ghost   bg #F0E8F2  text #5D2465                   (no border)
   Premium feel comes from flat fills + a solid bottom edge,
   not outlines. Borders removed; text colour corrected.        */
.hear{
  border:0;
  background:var(--yellow);
  color:#161016;
  border-radius:14px;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.12),0 5px 0 #DEC400;
  font-family:var(--font-display);
  font-weight:700;
  letter-spacing:.01em;
  position:relative;overflow:hidden;
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
  transition:transform .16s cubic-bezier(.22,1,.36,1),box-shadow .16s cubic-bezier(.22,1,.36,1),filter .16s}
.hear::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.10) 40%,rgba(255,255,255,0) 60%)}
.hear:hover{transform:translateY(-2px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.12),0 7px 0 #DEC400;filter:brightness(1.02)}
.hear:active{transform:translateY(3px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.12),0 2px 0 #DEC400}

.new-quiz{
  border:0;
  background:#F0E8F2;
  color:#5D2465;
  border-radius:14px;
  box-shadow:0 4px 0 #DCCFE0;
  font-family:var(--font-display);
  font-weight:700;
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease}
.new-quiz:hover{transform:translateY(-2px);box-shadow:0 6px 0 #DCCFE0;filter:brightness(1.01)}
.new-quiz:active{transform:translateY(2px);box-shadow:0 2px 0 #DCCFE0}

.retry{
  border:0;
  background:#FFE3F1;
  color:var(--pink-dk);
  border-radius:14px;
  box-shadow:0 4px 0 #F4C2DC;
  font-family:var(--font-display);
  font-weight:700;
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease}
.retry:hover{transform:translateY(-2px);box-shadow:0 6px 0 #F4C2DC;background:#FFD6EA;color:var(--pink-dk)}
.retry:active{transform:translateY(2px);box-shadow:0 2px 0 #F4C2DC}

.next{
  border-radius:14px;
  font-weight:700;
  letter-spacing:.01em;
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
  transition:transform .16s cubic-bezier(.22,1,.36,1),box-shadow .16s cubic-bezier(.22,1,.36,1),filter .16s}
.next::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.10) 40%,rgba(255,255,255,0) 60%)}
.next:not(:disabled){box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.12),0 6px 0 var(--pink-dk)}
.next:not(:disabled):hover{transform:translateY(-2px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.12),0 8px 0 var(--pink-dk)}
.next:disabled{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.12),0 6px 0 rgba(176,18,104,.35)}

/* ============ Option tiles + shapes: sharp corners, black borders, bigger ============ */

/* Tiles: rounded card with a crisp black border */
.option{
  border:3px solid var(--black);
  border-radius:18px;
  padding:clamp(8px,1.4vh,14px);
  gap:clamp(7px,1.3vh,14px)}
.option:hover:not(.correct):not(.wrong){
  border-color:var(--black);
  background:#FFF8FC;
  transform:translateY(-4px);
  box-shadow:0 8px 0 rgba(0,0,0,.16)}
.option:active:not(.correct):not(.wrong){transform:translateY(-1px);box-shadow:0 3px 0 rgba(0,0,0,.16)}
/* feedback states keep their own colour but the same weight */
.option.correct,.option.wrong{border-width:3px}

/* Shapes: noticeably larger, filling the empty tile space */
.mini{
  width:clamp(58px,13.4vh,158px);
  height:clamp(58px,13.4vh,158px)}
.mini.rectangle{
  width:clamp(76px,17vh,198px);
  height:clamp(48px,10.8vh,126px);
  border-radius:0}                      /* sharp corners */
.mini.square{border-radius:0}           /* sharp corners */
.mini.oval{
  width:clamp(76px,17vh,198px);
  height:clamp(50px,11.2vh,130px);
  border-radius:50%}
.mini.circle{border-radius:50%}
.mini.triangle{
  width:0;height:0;
  border-left:clamp(33px,7.6vh,90px) solid transparent;
  border-right:clamp(33px,7.6vh,90px) solid transparent;
  border-bottom:clamp(58px,13.4vh,158px) solid var(--purple);

.stage{background:linear-gradient(180deg,#A9DDFF 0%,#C7E9FF 40%,#DDF2FF 68%,#EAF7E8 100%) !important}

/* ================= CRASH: Tinyo topples and parts fly off ================= */
.tinyo.anim-crash{animation:tCrash 1.15s cubic-bezier(.3,.8,.5,1) forwards}
@keyframes tCrash{
  0%  {transform:translateX(-50%) translateY(0) rotate(0)}
  16% {transform:translateX(-50%) translateY(-16px) rotate(-9deg)}
  42% {transform:translateX(-50%) translateY(6px) rotate(24deg)}
  62% {transform:translateX(-52%) translateY(26px) rotate(58deg)}
  80% {transform:translateX(-53%) translateY(40px) rotate(80deg)}
  100%{transform:translateX(-53%) translateY(42px) rotate(80deg)}}
/* limbs detach and tumble away */
.t-crash .arm-l{animation:flyOffL 1.0s cubic-bezier(.25,.7,.4,1) forwards}
.t-crash .arm-r{animation:flyOffR 1.0s cubic-bezier(.25,.7,.4,1) forwards}
.t-crash .leg-l{animation:flyOffLegL .95s cubic-bezier(.25,.7,.4,1) .06s forwards}
.t-crash .leg-r{animation:flyOffLegR .95s cubic-bezier(.25,.7,.4,1) .06s forwards}
.t-crash .ant  {animation:flyOffAnt 1.05s cubic-bezier(.25,.7,.4,1) forwards}
@keyframes flyOffL{0%{transform:translate(0,0) rotate(0);opacity:1}
  30%{transform:translate(-34px,10px) rotate(-60deg)}
  100%{transform:translate(-86px,74px) rotate(-230deg);opacity:0}}
@keyframes flyOffR{0%{transform:translate(0,0) rotate(0);opacity:1}
  30%{transform:translate(36px,12px) rotate(58deg)}
  100%{transform:translate(92px,70px) rotate(220deg);opacity:0}}
@keyframes flyOffLegL{0%{transform:translate(0,0) rotate(0);opacity:1}
  35%{transform:translate(-22px,8px) rotate(-40deg)}
  100%{transform:translate(-62px,58px) rotate(-150deg);opacity:0}}
@keyframes flyOffLegR{0%{transform:translate(0,0) rotate(0);opacity:1}
  35%{transform:translate(24px,10px) rotate(38deg)}
  100%{transform:translate(66px,54px) rotate(145deg);opacity:0}}
@keyframes flyOffAnt{0%{transform:translate(0,0) rotate(0);opacity:1}
  28%{transform:translate(16px,6px) rotate(50deg)}
  100%{transform:translate(50px,62px) rotate(280deg);opacity:0}}
.t-crash .pupil{animation:dizzy .55s linear infinite}
@keyframes dizzy{0%{transform:translate(0,0)}25%{transform:translate(3px,-2px)}
  50%{transform:translate(0,3px)}75%{transform:translate(-3px,-2px)}100%{transform:translate(0,0)}}

.impact i{position:absolute;border-radius:50%;background:#CBB68E;opacity:0;
  animation:puff .85s ease-out forwards}

@media (prefers-reduced-motion:reduce){

/* --- birds --- */
.bird{position:absolute;width:clamp(14px,2.3vh,26px);height:clamp(7px,1.2vh,13px);z-index:1;opacity:.7}
.bird:before,.bird:after{content:"";position:absolute;top:0;width:52%;height:100%;

.bird:before{left:0;transform:rotate(-18deg)}
.bird:after{right:0;transform:rotate(18deg) scaleX(-1)}
.bd1{left:33%;top:14%;animation:fly 13s ease-in-out infinite}
.bd2{left:46%;top:9%;transform:scale(.76);animation:fly 17s ease-in-out infinite 1.5s}
.bd3{left:68%;top:20%;transform:scale(.62);animation:fly 21s ease-in-out infinite 3s}
@keyframes fly{0%,100%{transform:translate(-26px,0)}50%{transform:translate(26px,-11px)}}

/* --- balloons --- */
.balloon{position:absolute;width:clamp(19px,3.2vh,35px);height:clamp(24px,4.1vh,45px);
  border-radius:50% 50% 47% 47%;z-index:2;box-shadow:inset -4px -4px 0 rgba(0,0,0,.08)}
.balloon:after{content:"";position:absolute;left:50%;top:100%;width:1.6px;
  height:clamp(16px,2.7vh,30px);background:rgba(60,40,70,.3);transform:translateX(-50%)}
.bl1{left:11%;top:27%;background:#F01A8C;animation:floatY 6.2s ease-in-out infinite}
.bl2{right:11%;top:34%;background:#FFD62C;animation:floatY 7.6s ease-in-out infinite reverse}
.bl3{left:16%;top:14%;background:#8FC7F5;transform:scale(.8);animation:floatY 9s ease-in-out infinite 1s}
@keyframes floatY{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-18px) rotate(4deg)}}

/* --- rolling hills --- */
.stage .hill{display:block !important;position:absolute;border-radius:50% 50% 0 0;
  width:auto;border-top:0;z-index:0}
.stage .hill.h1{left:-8%;bottom:25%;width:46%;height:15%;background:#A5E3B2}
.stage .hill.h2{right:-10%;bottom:25%;width:54%;height:20%;background:#8FD99F}
.stage .hill.h3{left:26%;bottom:25%;width:40%;height:11%;background:#B4E9BF}

/* --- ground --- */
.stage .ground{position:absolute;left:0;right:0;bottom:0;height:27%;z-index:1;
  background:linear-gradient(180deg,#83CE94 0%,#66B87A 100%) !important;
  border-top:4px solid #58A96B !important}
.stage .ground:after{content:"";position:absolute;left:0;right:0;top:36%;height:5px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.6) 0 26px,transparent 26px 58px);border-radius:3px}

/* --- trees (fixed: explicit size, no zero-height collapse) --- */
.tree{position:absolute;z-index:2;
  width:clamp(40px,7vh,78px);height:clamp(56px,9.8vh,110px);
  transform-origin:bottom center;animation:sway 5s ease-in-out infinite}
.tree:before{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:22%;height:36%;background:linear-gradient(90deg,#A9713F,#C2884F);border-radius:3px}
.tree:after{content:"";position:absolute;left:50%;bottom:30%;transform:translateX(-50%);
  width:100%;height:74%;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#86D897 0%,#5FB273 72%);
  box-shadow:0 4px 0 rgba(0,0,0,.07)}
.t1{left:3%;bottom:19%}
.t2{right:2.5%;bottom:20%;transform:scale(1.1);animation-duration:6.4s;animation-direction:reverse}
.t3{left:15%;bottom:22%;transform:scale(.66);opacity:.9;animation-duration:7.2s}
@keyframes sway{0%,100%{rotate:-1.8deg}50%{rotate:1.8deg}}

/* --- bushes --- */
.bush{position:absolute;border-radius:50% 50% 38% 38%;z-index:2;background:#4FA463;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.b1{left:28%;bottom:17%;width:clamp(36px,6.2vh,68px);height:clamp(18px,3.1vh,34px)}
.b2{right:24%;bottom:19%;width:clamp(28px,4.8vh,53px);height:clamp(14px,2.4vh,26px);background:#45965A}
.b3{right:38%;bottom:16%;width:clamp(22px,3.8vh,42px);height:clamp(11px,1.9vh,21px);background:#57AC6C}

/* --- flowers --- */
.flower{position:absolute;z-index:3;width:clamp(11px,1.8vh,19px);height:clamp(11px,1.8vh,19px)}
.flower:before{content:"";position:absolute;left:50%;top:100%;width:2px;
  height:clamp(9px,1.5vh,16px);background:#4FA463;transform:translateX(-50%)}
.flower:after{content:"";position:absolute;inset:0;border-radius:50%;

.f1{left:6%;bottom:9%;--pet:#FF8FC3}
.f2{left:17%;bottom:5%;--pet:#FFD62C}
.f3{left:38%;bottom:7%;--pet:#C79BE8}
.f4{right:9%;bottom:8%;--pet:#FFD62C}
.f5{right:20%;bottom:4%;--pet:#FF8FC3}
.f6{right:33%;bottom:10%;--pet:#8FC7F5}

/* --- pebbles --- */
.pebble{position:absolute;border-radius:50%;background:#A8D4B2;z-index:2;opacity:.85}
.p1{left:47%;bottom:5%;width:clamp(10px,1.7vh,18px);height:clamp(6px,1vh,10px)}
.p2{right:44%;bottom:11%;width:clamp(7px,1.2vh,13px);height:clamp(4px,.8vh,8px)}
.p3{left:60%;bottom:3%;width:clamp(8px,1.4vh,15px);height:clamp(5px,.9vh,9px)}

/* --- butterflies --- */
.butterfly{position:absolute;z-index:3;font-size:clamp(13px,2.1vh,22px)}
.butterfly:after{content:"🦋"}
.bf1{left:9%;bottom:34%;animation:flit 9s ease-in-out infinite}

@keyframes flit{0%,100%{transform:translate(0,0) rotate(-8deg)}

  66%{transform:translate(-18px,-9px) rotate(-5deg)}}

/* ================= LIQUID GLASS LAYER (consolidated, final) ================= */
.options{position:relative;border-radius:24px;padding:clamp(10px,1.6vh,16px);isolation:isolate;

  transition:transform .18s cubic-bezier(.2,1.3,.35,1),box-shadow .22s ease,border-color .2s ease,

.option:nth-child(2){animation-delay:.04s}

.option:nth-child(4){animation-delay:.12s}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){

}

  }
  html[data-layout-mode="auto-fit"] .option:nth-child(n){grid-column:auto}
  html[data-layout-mode="auto-fit"] .help{padding:8px 10px 12px}
  html[data-layout-mode="auto-fit"] .choice-actions{display:none!important}
  html[data-layout-mode="auto-fit"] .choice-actions.is-visible{display:contents!important}
  html[data-layout-mode="auto-fit"] .retry{grid-column:1;grid-row:1}
  html[data-layout-mode="auto-fit"] .new-quiz{grid-column:2;grid-row:1}
  html[data-layout-mode="auto-fit"] .help:has(.choice-actions.is-visible){grid-template-columns:repeat(4,minmax(0,1fr))}
  html[data-layout-mode="auto-fit"] .help:has(.choice-actions.is-visible) .hear{grid-column:3;grid-row:1}
  html[data-layout-mode="auto-fit"] .help:has(.choice-actions.is-visible)>.next{grid-column:4;grid-row:1}
}
/* Roomy landscape tablets: larger artwork in a balanced two-column tray. */
@media (orientation:landscape) and (min-width:900px) and (min-height:601px){
  html[data-layout-mode="auto-fit"] .options{grid-template-columns:repeat(2,minmax(0,1fr))}
  html[data-layout-mode="auto-fit"] .option:nth-child(n){grid-column:auto}
  html[data-layout-mode="auto-fit"] .option:nth-child(5){
    grid-column:1 / -1;width:calc(50% - 3px);justify-self:center;
  }
}
@supports (width:1cqw) and (height:1cqh){
  @media (orientation:landscape) and (min-width:900px) and (min-height:601px){
    html[data-layout-mode="auto-fit"] .option{--fit-shape:clamp(20px,min(50cqh,48cqw),110px)}
  }
}
/* Compact portrait phones, including browser chrome taking part of the screen. */
@media (orientation:portrait) and (max-height:600px){
  html[data-layout-mode="auto-fit"] .topbar{height:40px;padding:4px 10px}
  html[data-layout-mode="auto-fit"] .layout{gap:6px;padding:6px}
  html[data-layout-mode="auto-fit"] .stage-card{padding:6px}
  html[data-layout-mode="auto-fit"] .stage{min-height:72px}
  html[data-layout-mode="auto-fit"] .tinyo{height:56%;bottom:11%}
  html[data-layout-mode="auto-fit"] .question-card{padding:6px}
  html[data-layout-mode="auto-fit"] .question-card p{margin-bottom:4px;font-size:11px}
  html[data-layout-mode="auto-fit"] .options{height:clamp(136px,28vh,164px);padding:6px;gap:5px}
  html[data-layout-mode="auto-fit"] .help{gap:5px;padding:6px 8px 10px}
  html[data-layout-mode="auto-fit"] .status{margin-top:4px;padding:5px 7px;gap:6px}
}
/* Landscape phones and smaller tablets: preserve the two-panel arrangement. */
@media (orientation:landscape) and (max-height:540px){
  html[data-layout-mode="auto-fit"] .topbar{height:clamp(36px,10vh,44px);padding:4px 10px}
  html[data-layout-mode="auto-fit"] .brand-logo{height:25px}
  html[data-layout-mode="auto-fit"] h1{font-size:17px}
  html[data-layout-mode="auto-fit"] .layout{gap:6px;padding:6px}
  html[data-layout-mode="auto-fit"] .stage-card{padding:6px}
  html[data-layout-mode="auto-fit"] .question-card{padding:6px}
  html[data-layout-mode="auto-fit"] .question-card>p{display:none}
  html[data-layout-mode="auto-fit"] .options{padding:6px;gap:5px}
  html[data-layout-mode="auto-fit"] .help{gap:5px;padding:6px 7px 10px}
  html[data-layout-mode="auto-fit"] .status{padding:5px 7px;gap:6px}
  html[data-layout-mode="auto-fit"] .speech{font-size:clamp(12px,3.5vh,15px);padding:5px 8px}
}
@media (orientation:landscape) and (max-width:600px){
  html[data-layout-mode="auto-fit"] .layout{grid-template-columns:minmax(0,1fr) minmax(224px,43%)}
  html[data-layout-mode="auto-fit"] .status-icon{display:none}
  html[data-layout-mode="auto-fit"] .help button{font-size:11.5px;padding:6px 4px}
}
/* Very small or heavily zoomed windows may scroll rather than hide a control. */
@media (max-height:300px){
  html[data-layout-mode="auto-fit"] body{overflow-y:auto}
  html[data-layout-mode="auto-fit"] .layout{flex:0 0 auto;min-height:250px;overflow:visible}
  html[data-layout-mode="auto-fit"] .stage-card{min-height:230px}
}
@media (hover:none){
  html[data-layout-mode="auto-fit"] .option:hover:not(.correct):not(.wrong){
    transform:none;box-shadow:inset 0 1.5px 1px #fffffff2,0 0 0 1px #83358c1a,0 4px 10px -6px #5c256361;
  }
  html[data-layout-mode="auto-fit"] .option:hover .mini{transform:none}
  html[data-layout-mode="auto-fit"] .option:active:not(.correct):not(.wrong){transform:scale(.97)}
}

</style>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pattern and Sequence · Smart Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#83358C;--pink:#F01A8C;--yellow:#FFF212;
  --purple-deep:#5C2563;--pink-dk:#B01268;--yellow-dk:#D6C900;
  --ink:#161016;--muted:#4A3A4D;--line:#E7D8EA;
  --ok:#2FBF6D;--ok-deep:#1D7A45;--no:#E0433A;
  --font-display:'Fredoka','SB Display',Boulder,sans-serif;
  --font-text:'Nunito','SB Text',Bariol,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#E6DCEB;overflow:hidden;display:flex;flex-direction:column;font-family:var(--font-text);color:var(--ink)}
button{font:inherit;cursor:pointer}

/* ===================== SHELL ===================== */
.topbar{flex:0 0 auto;height:clamp(62px,8vh,76px);display:flex;align-items:center;gap:16px;
  padding:8px clamp(12px,2vw,24px);border-bottom:3px solid var(--purple);background:var(--yellow)}
.brand-logo{height:34px;width:auto}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(18px,2.8vh,26px);color:#5C2563}
h1 b{color:var(--pink)}
.layout{flex:1;min-height:0;display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:14px;padding:14px clamp(12px,2vw,24px)}
.col{display:flex;flex-direction:column;gap:12px;min-height:0}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;
  box-shadow:0 12px 25px -20px var(--purple-deep);min-height:0}
.stage-card{position:relative;flex:1;display:flex;flex-direction:column;padding:10px;min-height:0}
.stage{position:relative;flex:1;min-height:200px;border-radius:15px;border:1px solid var(--line);overflow:hidden;background:#CDE7FB}

/* ---- task header + progress dots ---- */
.task-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:1px 6px 6px;flex-wrap:nowrap}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.eyebrow{font-family:var(--font-display);font-weight:700;font-size:10.5px;letter-spacing:.11em;color:var(--pink);text-transform:uppercase}
.task-title{font-family:var(--font-display);font-weight:700;font-size:clamp(16px,2.2vh,21px);color:var(--purple-deep);margin:3px 0 0}
.task-title strong{color:var(--pink)}
.progress{display:flex;gap:6px;flex:0 0 auto}
/* the screen dots are little glazed beads — a bright top highlight, a soft
   inner shade and a drop shadow, the same finish the symbol tiles wear */
.progress .dot{position:relative;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;
  color:#AE8FB8;border:1px solid #DCCAE4;font:700 11px var(--font-display);
  text-shadow:0 1px 0 rgba(255,255,255,.85);
  background:radial-gradient(115% 100% at 50% 0%,#FFFFFF 0%,#F8F1FC 46%,#E8DAF0 100%);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.97), inset 0 -2.5px 3px rgba(131,53,140,.13),
             0 2px 0 rgba(92,37,99,.13), 0 5px 9px -5px rgba(92,37,99,.35);
  transition:color .25s,border-color .25s,box-shadow .25s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.progress .dot::after{content:"";position:absolute;left:17%;right:17%;top:9%;height:44%;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(255,255,255,.10));pointer-events:none}
.progress .dot.current{color:#fff;border-color:#D81C86;text-shadow:0 1px 1px rgba(150,10,80,.45);
  background:radial-gradient(115% 105% at 50% 0%,#FF80C5 0%,var(--pink) 52%,#D6167F 100%);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.78), inset 0 -2.5px 3px rgba(140,8,72,.32),
             0 3px 0 rgba(176,18,104,.42), 0 8px 13px -6px rgba(240,26,140,.70);
  transform:scale(1.12)}
.progress .dot.done{color:#188348;border-color:#79CAA0;text-shadow:0 1px 0 rgba(255,255,255,.9);
  background:radial-gradient(115% 100% at 50% 0%,#FFFFFF 0%,#E5FAED 46%,#BDECCF 100%);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.97), inset 0 -2.5px 3px rgba(47,150,90,.17),
             0 2px 0 rgba(47,150,90,.24), 0 5px 9px -5px rgba(47,150,90,.50)}

/* ---- banner ---- */
.banner{margin:0 auto;flex:0 1 auto;min-width:0;background:#fff;border:3px solid var(--purple);
  border-radius:18px;padding:4px 18px;font:700 clamp(13px,2.4vh,19px) var(--font-display);color:var(--purple-deep);
  box-shadow:0 5px 0 rgba(92,37,99,.18);width:max-content;max-width:94%;text-align:center;letter-spacing:.4px}
.banner .target{color:var(--pink)}
.banner.pop{animation:bp .4s cubic-bezier(.22,1,.36,1)}
@keyframes bp{0%{opacity:0;transform:translateY(-10px) scale(.92)}
  60%{opacity:1;transform:translateY(0) scale(1.035)}100%{transform:scale(1)}}
@keyframes holdFill{0%{transform:scaleX(0);opacity:0}12%{opacity:1}to{transform:scaleX(1);opacity:1}}
@keyframes iconIn{0%{transform:scale(.4) rotate(-10deg);opacity:0}60%{transform:scale(1.18) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
@keyframes fadeSlide{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ===================== AUTO-FIT SHELL (non-laptop devices) =====================
   Same idea as distance_explorer2.0: the laptop build keeps the authored sizes,
   every other device compacts the shell so the whole activity fits one screen. */
html[data-layout-mode="auto-fit"] .topbar{height:clamp(50px,7vh,62px);gap:12px;padding:6px clamp(10px,1.6vw,18px)}
html[data-layout-mode="auto-fit"] .brand h1{font-size:clamp(17px,2.4vh,22px)}
html[data-layout-mode="auto-fit"] .brand-logo{height:clamp(26px,3.6vh,31px)}
html[data-layout-mode="auto-fit"] .layout{padding:12px;gap:12px}
html[data-layout-mode="auto-fit"] .card{border-radius:18px}
html[data-layout-mode="auto-fit"] .stage-card{padding:10px}
html[data-layout-mode="auto-fit"] .task-header{padding-bottom:8px}
html[data-layout-mode="auto-fit"] .eyebrow{font-size:10px}
html[data-layout-mode="auto-fit"] .task-title{font-size:clamp(17px,2.3vh,21px)}
html[data-layout-mode="auto-fit"] .dot{width:22px;height:22px;font-size:11px}
html[data-layout-mode="auto-fit"] .dots{gap:4px}
html[data-layout-mode="auto-fit"] .banner{font-size:clamp(14px,2vh,17px);padding:5px 14px}
html[data-layout-mode="auto-fit"] .ctrl{padding:11px 13px 13px}
html[data-layout-mode="auto-fit"] .card-title{font-size:14px;padding-bottom:7px}
html[data-layout-mode="auto-fit"] .conn{font-size:12.5px;padding:6px 10px}
html[data-layout-mode="auto-fit"] .btn{padding:8px 10px;font-size:13px}
html[data-layout-mode="auto-fit"] .btn-yellow.big{min-height:40px;font-size:16px;box-shadow:0 5px 0 var(--yellow-dk)}
html[data-layout-mode="auto-fit"] .hint{font-size:11px;margin-top:7px}
html[data-layout-mode="auto-fit"] .ov-box{padding:24px 30px}
html[data-layout-mode="auto-fit"] .ov-box h2{font-size:clamp(22px,4vh,32px)}
html[data-layout-mode="auto-fit"] .ov-box p{font-size:19px;margin:14px 0 20px}
html[data-layout-mode="auto-fit"] .ov-icons svg{width:88px;height:88px}
html[data-layout-mode="auto-fit"] .ov-start{padding:11px 30px;font-size:19px}
html[data-layout-mode="auto-fit"] .final-box{padding:22px 26px}
html[data-layout-mode="auto-fit"] .tally{font-size:44px}
/* portrait phones: stack the scene over the controls, exactly like explorer 2.0 */
@media(max-width:760px){
  /* phones and tablets: the scene takes the space that is left over, and the
     two cards underneath it always keep their natural height */
  html[data-layout-mode="auto-fit"] .layout{grid-template-columns:minmax(0,1fr);
    grid-template-rows:minmax(0,1fr) auto;gap:10px;padding:10px}
  html[data-layout-mode="auto-fit"] .rightcol{display:grid;grid-template-columns:minmax(0,1fr);
    grid-template-rows:auto auto;gap:8px;align-content:start}
  html[data-layout-mode="auto-fit"] .metercard{flex:0 0 auto;min-height:0;justify-content:center}
  html[data-layout-mode="auto-fit"] .ctrl>*{flex:0 0 auto}
  html[data-layout-mode="auto-fit"] .stage{min-height:0}
}
@media(max-width:480px){
  /* small phones: everything shrinks one more notch so nothing scrolls */
  html[data-layout-mode="auto-fit"] .layout{gap:8px;padding:8px 8px 4px}
  html[data-layout-mode="auto-fit"] .rightcol{gap:6px}
  html[data-layout-mode="auto-fit"] .task-title{font-size:16px}
  html[data-layout-mode="auto-fit"] .eyebrow{font-size:8.9px}
  html[data-layout-mode="auto-fit"] .dot{width:19px;height:19px;font-size:10px}
  html[data-layout-mode="auto-fit"] .banner{font-size:12.5px;padding:4px 11px}
  html[data-layout-mode="auto-fit"] .ctrl{padding:9px 11px 11px}
  html[data-layout-mode="auto-fit"] .card-title{font-size:12.5px;padding-bottom:5px}
  html[data-layout-mode="auto-fit"] .conn{font-size:11px;padding:5px 9px}
  html[data-layout-mode="auto-fit"] .btn{padding:7px 9px;font-size:12px}
  html[data-layout-mode="auto-fit"] .btn-yellow.big{min-height:36px;font-size:15px;box-shadow:0 4px 0 var(--yellow-dk)}
  html[data-layout-mode="auto-fit"] .btn-row{margin-top:6px}
  html[data-layout-mode="auto-fit"] .hint{font-size:10.4px;margin-top:5px}
}
@media(max-width:760px) and (max-height:720px){
  /* short phones (640–720 px tall): trim one more notch so the whole scene,
     the read-out and the buttons still fit on one screen */
  html[data-layout-mode="auto-fit"] .layout{gap:7px;padding:7px 7px 3px}
  html[data-layout-mode="auto-fit"] .board{gap:5px;padding:6px}
  html[data-layout-mode="auto-fit"] .rightcol{gap:6px}
  html[data-layout-mode="auto-fit"] .task-head{padding:8px 11px 6px}
  html[data-layout-mode="auto-fit"] .ctrl{padding:8px 10px 9px}
  html[data-layout-mode="auto-fit"] .card-title{font-size:12px;padding:0 2px 4px}
  html[data-layout-mode="auto-fit"] .conn{font-size:10.6px;padding:4px 8px;margin-bottom:6px}
  html[data-layout-mode="auto-fit"] .conn .dot{width:8px;height:8px}
  html[data-layout-mode="auto-fit"] .btn{padding:6px 8px;font-size:11.5px;border-radius:10px}
  html[data-layout-mode="auto-fit"] .btn-yellow.big{min-height:33px;font-size:14px;box-shadow:0 3px 0 var(--yellow-dk)}
  html[data-layout-mode="auto-fit"] .btn-row{margin-top:5px}
  html[data-layout-mode="auto-fit"] .hint{font-size:9.6px;margin-top:4px;line-height:1.4}
}
/* ===================== RIGHT COLUMN ===================== */
.rightcol{display:flex;flex-direction:column;gap:12px;min-height:0}
.card-title{font-family:var(--font-display);font-weight:700;font-size:15.5px;color:var(--purple);padding:2px 4px 10px}
.ctrl{flex:0 0 auto;display:flex;flex-direction:column;padding:14px 16px 16px}

.conn{display:flex;align-items:center;gap:8px;background:#F7F2F8;border-radius:10px;padding:6px 12px;
  font:700 12.5px var(--font-display);color:var(--muted);margin:0 0 8px;border:1px solid #EBE2EE}
.conn .dot{width:10px;height:10px}
.dot{width:11px;height:11px;border-radius:50%;background:#C9C2D6;box-shadow:inset 0 -2px 3px rgba(0,0,0,.15);transition:background .25s}
.dot.on{background:var(--ok);box-shadow:0 0 9px rgba(47,191,109,.85)}

.btn{border:none;border-radius:12px;padding:9px 12px;font:700 14px var(--font-display);width:100%;cursor:pointer;
  transition:transform .16s cubic-bezier(.22,1,.36,1),filter .16s cubic-bezier(.22,1,.36,1),box-shadow .16s cubic-bezier(.22,1,.36,1)}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:translateY(2px)}
.btn:disabled{filter:grayscale(.5) brightness(.92);cursor:default;transform:none}
.btn-pink{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pink-dk)}
.btn-pink:active{box-shadow:0 1px 0 var(--pink-dk)}
.btn-yellow{background:var(--yellow);color:var(--ink);box-shadow:0 4px 0 var(--yellow-dk)}
.btn-yellow.big{min-height:45px;font-size:17px;box-shadow:0 6px 0 var(--yellow-dk);letter-spacing:.3px}
.btn-yellow.big:active{box-shadow:0 2px 0 var(--yellow-dk)}
.btn-ghost{background:#F0E8F2;color:var(--purple-deep);box-shadow:0 3px 0 #DCC6E4}
.btn-ghost:active{box-shadow:0 1px 0 #DCC6E4}
.ctrl .btn{position:relative;overflow:hidden;-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
.ctrl .btn::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.10) 40%,rgba(255,255,255,0) 60%)}
.ctrl .btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.12)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.hint{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.55;font-weight:600}
#connBtn.attn{animation:connPing 2.2s cubic-bezier(.45,0,.55,1) infinite}
@keyframes connPing{0%{box-shadow:0 4px 0 var(--pink-dk),0 0 0 0 rgba(240,26,140,.42)}
  70%,100%{box-shadow:0 4px 0 var(--pink-dk),0 0 0 14px rgba(240,26,140,0)}}

/* ===================== OVERLAYS ===================== */
.ov{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px}
.ov.hide{opacity:0;pointer-events:none;transition:opacity .35s}
.ov-box{background:var(--yellow);border:5px solid var(--purple);border-radius:28px;padding:30px 42px;text-align:center;
  max-width:560px;transition:transform .35s cubic-bezier(.22,1,.36,1)}
.ov.hide .ov-box{transform:scale(.9) translateY(10px)}
.ov-box h2{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,4.6vh,40px);color:var(--purple-deep)}
.ov-box h2 b{color:inherit}
.ov-box p{font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--pink);margin:16px 0 24px;
  line-height:1.45;letter-spacing:.4px}
.ov-icons{display:flex;gap:20px;justify-content:center;margin:6px 0 16px}
.ov-icons svg{width:clamp(84px,12vh,112px);height:clamp(84px,12vh,112px);filter:drop-shadow(0 6px 10px rgba(92,37,99,.3));
  animation:iconIn2 .6s cubic-bezier(.34,1.56,.64,1) both, iconFloat 3.4s ease-in-out infinite}
.ov-icons svg:nth-child(1){animation-delay:.05s,1.0s}
.ov-icons svg:nth-child(2){animation-delay:.18s,1.5s}
@keyframes iconIn2{from{opacity:0;transform:translateY(16px) scale(.45)}to{opacity:1;transform:none}}
@keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.ov-box.task-in h2{animation:ovRise .5s cubic-bezier(.22,1,.36,1) backwards}
.ov-box.task-in p{animation:ovRise .5s .1s cubic-bezier(.22,1,.36,1) backwards}
.ov-box.task-in .ov-start{animation:ovRise .5s .2s cubic-bezier(.22,1,.36,1) backwards}
@keyframes ovRise{from{opacity:0;transform:translateY(14px)}}
.ov-start{background:var(--pink);color:#fff;border:none;border-radius:18px;padding:13px 36px;
  font:700 21px var(--font-display);box-shadow:0 7px 0 var(--pink-dk);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.ov-start:hover{transform:translateY(-3px);box-shadow:0 10px 0 var(--pink-dk)}
.ov-start:active{transform:translateY(4px);box-shadow:0 3px 0 var(--pink-dk)}
.ov-start{position:relative;overflow:hidden;-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
.ov-start::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.10) 40%,rgba(255,255,255,0) 60%)}
.ov-start::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.12)}

.final{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  background:rgba(22,16,22,.45);backdrop-filter:blur(4px)}
.final.show{display:flex}
.final-box{background:#fff;border:5px solid var(--purple);border-radius:28px;padding:32px 42px;text-align:center;max-width:440px;
  animation:finIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes finIn{from{opacity:0;transform:scale(.82) translateY(16px)}to{opacity:1;transform:none}}
.trophy{font-size:62px;animation:tp .7s cubic-bezier(.3,1.6,.4,1)}
@keyframes tp{0%{transform:scale(.3) rotate(-20deg)}100%{transform:scale(1)}}
.final-box h2{font-family:var(--font-display);color:var(--purple);font-size:30px;margin:6px 0}
.tally{font:800 52px var(--font-display);color:var(--pink);line-height:1}
.tally small{font-size:22px;color:var(--purple-deep)}
.final-box p{margin:10px 0 16px;color:var(--muted);font-weight:700}
.again{background:var(--pink);color:#fff;border:none;border-radius:16px;padding:12px 28px;font:700 18px var(--font-display);
  box-shadow:0 6px 0 var(--pink-dk);transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.again:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--pink-dk)}
.again:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-dk)}


.confetti{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden;contain:layout paint}
.confetti i{position:absolute;top:-14px;width:10px;height:14px;border-radius:2px;
  will-change:transform,opacity;backface-visibility:hidden}
#kidWorld{cursor:grab;touch-action:none;outline:none;will-change:transform}
#kidBob{will-change:transform}
#kidWorld:active{cursor:grabbing}
/* the watering can that lies on the plot: lifts off the soil and tips over the pot */
/* the buried chest: the dust, the mound, the lid and the loot */
#digMound{transform-box:fill-box;transform-origin:50% 100%}
#chestWrap{transform-box:fill-box;transform-origin:50% 100%}
#chestLid{transform-box:fill-box;transform-origin:0% 100%}
#chestLidCap{transform-box:fill-box;transform-origin:0% 100%}
#chestLidInner{transform-box:fill-box;transform-origin:50% 100%}
#chestTilt{transform-box:fill-box;transform-origin:50% 100%}
#chestLock{transform-box:fill-box;transform-origin:50% 50%}
#chestLoot{transform-box:fill-box;transform-origin:50% 100%}
#chestBeam{transform-box:fill-box;transform-origin:50% 100%}
.d2{animation-delay:-.22s}.d3{animation-delay:-.44s}.d4{animation-delay:-.66s}.d5{animation-delay:-.88s}
#chestShine{transform-box:fill-box;transform-origin:50% 100%;
            filter:drop-shadow(0 0 5px rgba(255,242,196,.95)) drop-shadow(0 0 12px rgba(255,225,150,.65))}
/* breathing while standing, a walking cycle the moment the player starts moving */
#kidBob{transform-box:fill-box;transform-origin:50% 100%}
/* the hoop answers every made shot */
#net{transform-box:fill-box;transform-origin:50% 0%}
#net.swish{animation:netSwish .46s cubic-bezier(.22,1,.36,1)}
.m2{animation-delay:-1.4s}
.m3{animation-delay:-2.6s}
.m4{animation-delay:-3.4s}
.m5{animation-delay:-4.2s}
#ball{will-change:transform}



.dc1{animation:cldA 118s linear infinite;animation-delay:-26s}
.dc2{animation:cldB 142s linear infinite;animation-delay:-72s}
.dc3{animation:cldC 104s linear infinite;animation-delay:-48s}

.db1{animation:birdL1 62s linear infinite;animation-delay:-16s}
.db2{animation:birdL2 78s linear infinite;animation-delay:-52s}
.db3{animation:birdL3 96s linear infinite;animation-delay:-14s}
.wingB{transform-box:fill-box;transform-origin:0% 60%;animation:flap .5s ease-in-out infinite alternate}
.db2 .wingB{animation-delay:-.22s}

@media (prefers-reduced-motion:reduce){
  .sonar-wave{animation:none;opacity:0}
  .confetti{display:none}
}

/* ===================== THE PATTERN BOARD (6.0) ===================== */
.stage{background:
  radial-gradient(120% 90% at 50% -10%, #FDF6FF 0%, #F1E6FA 46%, #E5D6F4 100%)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(78% 58% at 50% 118%, rgba(131,53,140,.09), transparent 72%)}
.board{position:absolute;inset:0;display:flex;flex-direction:column;gap:clamp(4px,1vh,9px);
  padding:clamp(6px,1.2vh,12px);overflow:hidden}
.board{will-change:opacity,transform}
.board.out{animation:boardOut .34s cubic-bezier(.4,0,.7,.2) forwards}
.board.in{animation:boardIn .56s cubic-bezier(.22,1,.36,1)}
@keyframes boardOut{to{opacity:0;transform:translateY(-14px) scale(.99)}}
@keyframes boardIn{from{opacity:0;transform:translateY(16px) scale(.99)}}

let PAGES=[];                             /* the questions on each screen          */
function buildPages(){
  PAGES=[]; let cur=[];
  const flush=()=>{if(cur.length){PAGES.push(cur);cur=[];}};
  QS.forEach((q,i)=>{
    if(!cur.length){cur=[i];return;}
    const hasMulti=cur.some(n=>isMulti(QS[n]));
    const limit=(isMulti(q)||hasMulti)?MULTI_PAGE:SHORT_PAGE;
    if(cur.length>=limit){flush();cur=[i];return;}
    cur.push(i);
  });
  flush();
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}
function shuffleOptions(){ QS.forEach(q=>{ q.order=shuffle(q.opts.map((_,i)=>i)); }); }

function ensureAudio(){
  if(audio)return audio;
  try{audio=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  return audio;
}
function tone(freq,dur,delay=0,type='sine',vol=.08){
  const a=ensureAudio(); if(!a)return;
  const t0=a.currentTime+delay;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+dur+.05);
}

document.body.appendChild(cLayer);
const CONF_COLS=['#F01A8C','#83358C','#FFF212','#2FBF6D','#FFD34D','#63C8E8','#FF8A3D'];
function confetti(n=26,fromEl){
  const r=fromEl?fromEl.getBoundingClientRect():{x:innerWidth/2,y:innerHeight*.4,width:0,height:0};
  for(let i=0;i<n;i++){
    const d=document.createElement('i');
    d.className='cf';
    d.style.background=CONF_COLS[i%CONF_COLS.length];
    d.style.left=(r.x+r.width/2+(Math.random()-.5)*Math.min(420,innerWidth*.6))+'px';
    d.style.top=(r.y+r.height/2)+'px';
    d.style.width=(6+Math.random()*6)+'px';
    d.style.height=(8+Math.random()*8)+'px';
    d.style.borderRadius=Math.random()<.4?'50%':'2px';
    cLayer.appendChild(d);
    const dx=(Math.random()-.5)*260, dy=180+Math.random()*260, rot=Math.random()*720-360;
    d.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},
               {transform:`translate(${dx*.6}px,${dy*.55}px) rotate(${rot*.6}deg)`,opacity:1,offset:.55},
               {transform:`translate(${dx}px,${dy}px) rotate(${rot}deg)`,opacity:0}],
              {duration:900+Math.random()*700,easing:'cubic-bezier(.25,.7,.5,1)'})
      .finished.then(()=>d.remove()).catch(()=>d.remove());
  }
}
const ICONS={
  pattern:`<g>
      <circle cx="17" cy="54" r="13" fill="url(#gRed)"/><circle cx="41" cy="54" r="13" fill="url(#gBlue)"/>
      <circle cx="65" cy="54" r="13" fill="url(#gYellow)"/>
      <rect x="80" y="41" width="17" height="26" rx="6" fill="#F4EAFB" stroke="#83358C" stroke-width="3"/>
      <text x="88.5" y="61" text-anchor="middle" font-size="19" font-weight="700" fill="#83358C"
            font-family="Fredoka, Trebuchet MS, sans-serif">?</text></g>`,
  correct:`<circle cx="50" cy="52" r="38" fill="url(#gGreen)"/>
      <path d="M32 54 l13 13 l24 -29" fill="none" stroke="#fff" stroke-width="9.5"
            stroke-linecap="round" stroke-linejoin="round"/>`,
  again:`<circle cx="50" cy="52" r="38" fill="url(#gYellow)"/>
      <text x="50" y="70" text-anchor="middle" font-size="48" font-weight="700" fill="#7A5400"
            font-family="Fredoka, Trebuchet MS, sans-serif">?</text>`,
  trophy:`<g>
      <path d="M26 16 h48 v20 q0 26 -24 30 q-24 -4 -24 -30 Z" fill="url(#gGold)" stroke="#C88E00" stroke-width="3"/>
      <path d="M24 18 h-9 q-5 0 -5 6 q0 16 14 19" fill="none" stroke="#C88E00" stroke-width="5" stroke-linecap="round"/>
      <path d="M76 18 h9 q5 0 5 6 q0 16 -14 19" fill="none" stroke="#C88E00" stroke-width="5" stroke-linecap="round"/>
      <rect x="43" y="65" width="14" height="12" fill="url(#gGold)" stroke="#C88E00" stroke-width="2.6"/>
      <rect x="30" y="77" width="40" height="12" rx="5" fill="url(#gGold)" stroke="#C88E00" stroke-width="2.6"/>
      <ellipse cx="40" cy="28" rx="6" ry="8" fill="#fff" opacity=".45"/></g>`,
  medal:`<g>
      <path d="M34 6 l13 24 M66 6 l-13 24" fill="none" stroke="#2F7FEE" stroke-width="9" stroke-linecap="round"/>
      <circle cx="50" cy="62" r="30" fill="url(#gGold)" stroke="#C88E00" stroke-width="3"/>
      <circle cx="50" cy="62" r="20" fill="none" stroke="#C88E00" stroke-width="2.4" opacity=".5"/>
      <path d="M50 50 l4.4 9.2 l10 1.4 l-7.2 7 l1.7 10 l-8.9 -4.7 l-8.9 4.7 l1.7 -10 l-7.2 -7 l10 -1.4 Z" fill="#fff" opacity=".55"/></g>`,
  spark:SYM.star()
};
function setIc(el,name){
  if(!el||!ICONS[name])return;
  el.innerHTML=`<svg class="ic-svg" viewBox="0 0 100 100" aria-hidden="true" focusable="false">${ICONS[name]}</svg>`;
  pop(el,[{transform:'scale(.4)'},{transform:'scale(1.18)',offset:.7},{transform:'scale(1)'}],420);
}
function pop(el,frames,dur=300,ease='cubic-bezier(.34,1.56,.64,1)'){
  if(!el)return;
  try{el.animate(frames,{duration:dur,easing:ease});}catch(e){}
}

/* ---------------- speech ---------------- */
let speech=null;
function stopSpeech(){
  if(speech){speech.onend=speech.onerror=null;speech=null;}
  if('speechSynthesis' in window)try{speechSynthesis.cancel();}catch(e){}
}
function speak(text){
  if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window))return;
  stopSpeech();
  const u=new SpeechSynthesisUtterance(text);
  speech=u;u.lang='en';u.rate=.92;u.pitch=1.06;
  const done=()=>{if(speech===u)speech=null;};
  u.onend=u.onerror=done;
  try{speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){done();}
}
const sayQuestion=()=>speak(QS[quest].say);

/* ---------------- rendering ---------------- */
function chip(t,filled){
  if(t==='?')return `<span class="chip blank" aria-label="missing">?</span>`;
  if(filled&&typeof t==='object')return `<span class="chip filled" aria-label="${tokenName(t)}">${symHtml(t)}</span>`;
  if(filled&&isNum(t))return `<span class="chip num filled" aria-label="${t}">${t}</span>`;
  if(t==='→')return `<span class="arrow">→</span>`;
  if(isNum(t))return `<span class="chip num">${t}</span>`;
  return `<span class="chip" aria-label="${tokenName(t)}">${symHtml(t)}</span>`;
}
function optionInner(o){
  const toks=Array.isArray(o)?o:[o];
  return toks.map(t=>isNum(t)?`<span class="ochip num">${t}</span>`:`<span class="ochip">${symHtml(t)}</span>`).join('');
}
function answerTokens(q){
  const a=q.opts[q.ans];
  return Array.isArray(a)?a:[a];
}
/* rowHTML(q, done, filled): filled puts the right answer into the "?" slots, which
   is how the row really looks once it has been answered — and it is a little wider
   than the empty slot, so the fit is measured with it in place */
function rowHTML(q,done,filled){
  const order=orderOf(q);
  const rows=q.rows.map(r=>r.slice());
  if(filled){
    const ans=answerTokens(q); let k=0;
    rows.forEach(r=>r.forEach((t,i)=>{if(t==='?'&&k<ans.length)r[i]=ans[k++];}));
  }
  const tried=TRIED[q.n]||[];
  const opts=`<div class="popts">${
     done?'':order.map((oi,slot)=>{
        const o=q.opts[oi], toks=Array.isArray(o)?o:[o];
        const wide=toks.length>=4?(toks.length>=6?'.7':toks.length>=5?'.78':'.86'):'1';
        const used=tried.indexOf(oi)>=0;
        return `<button class="opt${used?' used':''}" data-opt="${oi}" data-slot="${slot}" style="--ok:${wide}"
          ${used?'disabled':''} aria-label="Option ${slot+1}: ${toks.map(tokenName).join(', ')}">${optionInner(o)}</button>`;
     }).join('')
  }</div>`;
  const mark=done?'<span class="pmark ok">✓</span>':'<span class="pmark"></span>';
  return `<span class="pnum">${q.n}</span>
    <div class="pbody">
      <div class="pblock">${rows.map(r=>`<span class="pgroup">${r.map(t=>chip(t,filled)).join('')}</span>`).join('')}</div>
    </div>
    ${opts}${mark}`;
}
/* a row shows its answer in the slot as soon as it is solved, whether it was
   solved a moment ago or before the fit was re-measured */
const filled_for=(idx,done,answeredN)=>done||idx<answeredN;
function paint(pageIdx,activeN,answeredN){
  if(answeredN===undefined)answeredN=activeN;
  board.innerHTML='';
  const page=PAGES[pageIdx]||[];
  for(const idx of page){
    const q=QS[idx];
    if(!q)continue;
    const done=idx<activeN||!!SOLVED[idx], active=idx===activeN&&!done;
    const el=document.createElement('div');
    el.className='prow'+(done?' done':(active?' active':''));
    el.dataset.n=idx;
    el.innerHTML=rowHTML(q,done,filled_for(idx,done,answeredN));
    board.appendChild(el);
  }
}
function renderScreen(){
  paint(pageOf(quest), quest, quest);
  board.classList.remove('out');
  board.classList.add('in');
  setTimeout(()=>board.classList.remove('in'),980);
  updateHeader();
  applyFit();
}
function updateHeader(){
  const pi=pageOf(quest), page=PAGES[pi]||[];
  $('taskCount').textContent=`SCREEN ${pi+1} / ${PAGES.length}`;
  $('banner').textContent=`Question ${Math.min(quest+1,QS.length)} of ${QS.length}`;
  $('progress').innerHTML=page.map(i=>{
    const done=i<quest||!!SOLVED[i], cur=i===quest&&!done, fresh=i===JUST;
    return `<span class="dot ${done?'done':cur?'current':''}${fresh?' pop':''}" title="Question ${i+1}">${done?'✓':i+1}</span>`;
  }).join('');
  JUST=null;                                  /* one hop per solved question */
  updateScore();
}
function updateScore(){
  const el=$('scoreChip');
  if(el)el.innerHTML=`<b>${score}</b><small> / ${QS.length}</small>`;
}
/* the feedback floats inside the row that was just answered: always in view,
   never over the question that comes next */
function toast(kind,title,text,rowEl){
  const live=$('toast');
  if(live)live.textContent=`${title} ${text}`;
  if(!rowEl)return;
  const old=rowEl.querySelector('.rowToast');
  if(old)old.remove();
  const t=document.createElement('div');
  t.className='rowToast '+kind;
  t.setAttribute('aria-hidden','true');
  t.innerHTML=`<span class="tic"><svg viewBox="0 0 100 100" aria-hidden="true">${ICONS[kind]||''}</svg></span>`
             +`<b>${title}</b><span class="ttx">${text}</span>`;
  rowEl.appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300);},1080);
}
buildPages();
shuffleOptions();

const LADDER=['dense','fit1','fit2','fit3','fit4','fit5'];   /* dense trims spacing, not symbols */
let FIT=null;                       /* the one scale that suits every screen */
function applyFit(){
  LADDER.forEach(c=>board.classList.remove(c));
  if(FIT)board.classList.add(FIT);
}
/* walk every screen at every scale and keep the largest scale that fits them all,
   so the symbols never change size from one question to the next */
function measureFit(){
  const back=quest;
  LADDER.forEach(c=>board.classList.remove(c));
  board.classList.remove('in','out');
  board.style.visibility='hidden';
  /* every question is tried live and answered, on the screen it belongs to */
  const states=[];
  PAGES.forEach((page,pi)=>page.forEach(idx=>{
    states.push([pi,idx]);        /* the question as it is being asked  */
    states.push([pi,idx+1]);      /* and as it looks once it is answered */
  }));
  let chosen=null;
  for(const lvl of [null].concat(LADDER)){
    if(lvl)board.classList.add(lvl);
    let ok=true;
    for(const [pi,active] of states){
      paint(pi,active,active);
      if(board.scrollHeight>board.clientHeight+2){ok=false;break;}
    }
    if(ok){chosen=lvl;break;}
    if(lvl)board.classList.remove(lvl);
  }
  FIT=chosen;
  board.style.visibility='';
  quest=back;
  if(started){
    paint(pageOf(quest), quest, quest);
    board.classList.add('in');
    setTimeout(()=>board.classList.remove('in'),980);
  }else{
    board.innerHTML='';
  }
  applyFit();
  return FIT;
}
const autoFit=applyFit;   /* kept for the render paths: nothing to re-measure mid-play */
function activeRow(){return board.querySelector('.prow.active');}
function rowFor(n){return board.querySelector(`.prow[data-n="${n}"]`);}
function blanksOf(rowEl){return [...rowEl.querySelectorAll('.chip.blank')];}

/* the chosen chip flies from the option button into the "?" slot */
function fly(btn,blanks,toks){
  const jobs=[];
  const br=btn.getBoundingClientRect();
  toks.forEach((t,i)=>{
    const target=blanks[i]; if(!target)return;
    const tr=target.getBoundingClientRect();
    const ghost=document.createElement('span');
    ghost.className='fly-chip'+(isNum(t)?' num':'');
    if(isNum(t))ghost.textContent=t; else ghost.innerHTML=symHtml(t);
    ghost.style.left=(br.x+br.width/2)+'px';
    ghost.style.top=(br.y+br.height/2)+'px';
    document.body.appendChild(ghost);
    const a=ghost.animate([
      {transform:'translate(-50%,-50%) scale(1)',opacity:1},
      {transform:`translate(calc(-50% + ${(tr.x+tr.width/2-br.x-br.width/2)*.55}px), calc(-50% + ${(tr.y+tr.height/2-br.y-br.height/2)*.55}px)) scale(1.22)`,opacity:1,offset:.55},
      {transform:`translate(calc(-50% + ${tr.x+tr.width/2-br.x-br.width/2}px), calc(-50% + ${tr.y+tr.height/2-br.y-br.height/2}px)) scale(.82)`,opacity:.95}
    ],{duration:460+i*60,easing:'cubic-bezier(.3,1.16,.45,1)',fill:'forwards'});
    jobs.push(a.finished.then(()=>ghost.remove()).catch(()=>ghost.remove()));
  });
  return Promise.all(jobs);
}

/* ---------------- answering ---------------- */
const motionOk=()=>!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);

async function choose(btn){
  if(locked)return; locked=true;
  const qi=quest;
  const q=QS[qi], rowEl=activeRow();
  if(!rowEl){locked=false;return;}
  const idx=+btn.dataset.opt;
  const toks=Array.isArray(q.opts[idx])?q.opts[idx]:[q.opts[idx]];
  const correct=idx===q.ans;
  btn.classList.add('picked');
  /* a right answer flies into the slot; a wrong one never does */
  if(correct){ slotSnd(); if(motionOk())await fly(btn,blanksOf(rowEl),toks); }

  /* the board can be rebuilt while the chip is in the air — a window resize
     re-measures the fit — so every finish line is drawn on the row that is
     really on screen, never on a node that has just been replaced */
  const row=rowFor(qi)||rowEl;

  if(correct){
    SOLVED[qi]=true; JUST=qi; delete TRIED[q.n];
    blanksOf(row).forEach((b,i)=>{
      b.classList.remove('blank');b.classList.add('filled');
      b.innerHTML=toks[i]!==undefined?(isNum(toks[i])?toks[i]:symHtml(toks[i])):'';
    });
    row.classList.add('done','fresh');row.classList.remove('active','shake','wrongFx');
    setTimeout(()=>row.classList.remove('fresh'),780);
    const mark=row.querySelector('.pmark');mark.classList.add('ok');mark.textContent='✓';
    pop(mark,[{transform:'scale(0)',opacity:0},{transform:'scale(1.25)',opacity:1,offset:.7},{transform:'scale(1)',opacity:1}],420);
    row.querySelectorAll('.opt').forEach(o=>o.classList.add('used'));
    rightSnd(); confetti(18,row);
    toast('correct','Correct!',tries===0?'Well spotted!':'Got it!',row);
    if(tries===0)score++;
    updateScore();
    tries=0;
    setTimeout(nextQuestion,780);
  }else{
    tries++;
    (TRIED[q.n]=TRIED[q.n]||[]).push(idx);
    btn.classList.add('used','nope');btn.disabled=true;
    setTimeout(()=>btn.classList.remove('nope'),560);
    wrongSnd();
    row.classList.add('shake','wrongFx');
    setTimeout(()=>row.classList.remove('shake'),460);
    const slot=row.querySelector('.chip.blank');
    if(slot){slot.classList.add('wrong');setTimeout(()=>slot.classList.remove('wrong'),620);}
    toast('again','Try again!','Look at the pattern once more.',row);
    locked=false;
  }
}

function nextQuestion(){
  quest++;
  if(quest>=QS.length){finish();return;}
  if(pageOf(quest)!==pageOf(quest-1)){newScreen();return;}
  activate();
}
function newScreen(){
  locked=true;
  board.classList.add('out');
  screenSnd();
  setTimeout(()=>{
    renderScreen();
    activate();
    confetti(26,$('banner'));
    pop($('banner'),[{transform:'scale(.86)'},{transform:'scale(1.06)',offset:.6},{transform:'scale(1)'}],460);
  },300);
}
function activate(){
  locked=false;
  const rowEl=rowFor(quest);
  if(!rowEl)return;
  rowEl.querySelectorAll('.opt').forEach(b=>{b.disabled=false;});   /* the live row is always answerable */
  updateHeader();
  board.querySelectorAll('.prow').forEach(r=>r.classList.toggle('active',r===rowEl));
  pop(rowEl,[{transform:'translateY(10px)',opacity:.55},{transform:'translateY(0)',opacity:1}],420);
  requestAnimationFrame(()=>{autoFit();requestAnimationFrame(autoFit);});
  setTimeout(sayQuestion,420);
}
function finish(){
  locked=true;
  board.classList.add('out');
  cheerSnd(); confetti(110);
  setIc($('fi'),score>=18?'trophy':score>=13?'medal':'spark');
  $('fh').textContent=score>=18?'Pattern master!':score>=13?'Great work!':'Well done!';
  $('fs').textContent=score;
  $('ftotal').textContent=` / ${QS.length}`;
  $('fmsg').textContent=`You finished all ${QS.length} pattern questions.`;
  $('final').classList.add('show');
}

/* ---------------- wiring ---------------- */
/* ---- the finger path: the tile dips the instant the finger lands, and the
   answer is taken the moment the finger lifts, without waiting for the
   browser's synthesised click. The mouse and the keyboard keep the click
   path, and a click that merely follows a touch is ignored. ---- */
function pickable(t){
  const b=t&&t.closest?t.closest('.opt'):null;
  const row=b&&b.closest('.prow');
  return (b&&!b.disabled&&row&&row.classList.contains('active'))?b:null;
}
let touchPick=null;
board.addEventListener('pointerdown',e=>{
  const b=pickable(e.target);
  if(!b||(e.button!==undefined&&e.button!==0))return;
  b.classList.add('press');
  const off=()=>{
    b.classList.remove('press');
    b.removeEventListener('pointerup',off);
    b.removeEventListener('pointercancel',off);
    b.removeEventListener('pointerleave',off);
  };
  b.addEventListener('pointerup',off);
  b.addEventListener('pointercancel',off);
  b.addEventListener('pointerleave',off);
},{passive:true});
/* a finger that lifts anywhere always releases the press state, even if the
   gesture ended far from the tile it started on */
const clearPress=()=>document.querySelectorAll('.opt.press').forEach(o=>o.classList.remove('press'));
window.addEventListener('pointerup',clearPress,true);
window.addEventListener('pointercancel',clearPress,true);
board.addEventListener('pointerup',e=>{
  if(e.pointerType==='mouse')return;                /* the mouse keeps the click path */
  const b=pickable(e.target);
  if(!b)return;
  b.classList.remove('press');
  touchPick={el:b,t:performance.now()};             /* …so the click that follows is a no-op */
  choose(b);
},{passive:true});
board.addEventListener('click',e=>{
  const b=pickable(e.target);
  if(!b)return;
  if(touchPick&&touchPick.el===b&&performance.now()-touchPick.t<800){touchPick=null;return;}
  choose(b);
});
document.addEventListener('keydown',e=>{
  if(!started)return;
  const n=parseInt(e.key,10);
  if(n>=1&&n<=9){
    const rowEl=activeRow(); if(!rowEl)return;
    const b=rowEl.querySelector(`.opt[data-slot="${n-1}"]`);
    if(b&&!b.disabled)choose(b);
  }
  if(e.key==='h'||e.key==='H')sayQuestion();
});
function begin(){
  document.documentElement.classList.add('playing');
  buildPages();
  shuffleOptions();
  SOLVED=[];TRIED={};
  measureFit();
  $('ov').classList.add('hide');
  setTimeout(()=>{$('ov').style.display='none';},360);
  quest=0;score=0;tries=0;locked=false;
  board.classList.remove('out');
  $('final').classList.remove('show');
  renderScreen();activate();
}
$('start').onclick=()=>{
  if(started)return; started=true;
  ensureAudio(); pickSnd();
  begin();
};
$('restart').onclick=()=>{begin();};
/* the question is read out on arrival; tapping the banner repeats it,
   and the H key repeats it from the keyboard */
$('banner').title='Tap to hear the question again';
$('banner').setAttribute('role','button');
$('banner').setAttribute('tabindex','0');
$('banner').onclick=()=>{sayQuestion();pop($('banner'),[{transform:'scale(1)'},{transform:'scale(.95)',offset:.5},{transform:'scale(1)'}],260);};
$('banner').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('banner').click();}};
/* R restarts a round — but only once the round has begun */
document.addEventListener('keydown',e=>{if((e.key==='r'||e.key==='R')&&started){begin();}});
/* the scale is settled once, before question 1, and only ever revisited when the
   window itself really changes size — never while the questions are moving */
let rzT=null, lastW=innerWidth, lastH=innerHeight;
window.addEventListener('resize',()=>{
  if(Math.abs(innerWidth-lastW)<24&&Math.abs(innerHeight-lastH)<48)return;
  lastW=innerWidth;lastH=innerHeight;
  clearTimeout(rzT);
  rzT=setTimeout(()=>{measureFit();},200);
},{passive:true});

</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <script>
  /* SmartBlock pre-paint helper for the language page (page itself is not translated).
     Preloads + caches the chosen language translation and prefetches the next page so
     navigation to mode.html is instant. Language choice is session-only (sessionStorage). */
  (function () {
    try {
      var SB = window.SB = window.SB || {};
      SB.TRANS_PREFIX = 'smartblock_translations_';
      SB._cacheTrans = function (obj, lang) {
        if (!obj) return;
        try { localStorage.setItem(SB.TRANS_PREFIX + lang, JSON.stringify(obj)); } catch (e) {}
      };
      SB.preloadTrans = function (lang) {
        if (!lang) return null;
        if (SB['_tp_' + lang]) return SB['_tp_' + lang];
        // Warm the browser cache for the NEXT page (mode.html): it loads global + mode files.
        function get(f) { return fetch(f, { cache: 'default' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).catch(function () { return null; }); }
        SB['_tp_' + lang] = Promise.all([
          get('../translations/global/' + lang + '.json'),
          get('../translations/mode/' + lang + '.json')
        ]);
        return SB['_tp_' + lang];
      };
      SB.preloadPage = function (href) { try { if (!href) return; var l = document.createElement('link'); l.rel = 'prefetch'; l.as = 'document'; l.href = href; document.head.appendChild(l); } catch (e) {} };
      /* Likely next page in the flow. */
      SB.preloadPage('mode.html');
    } catch (e) {}
  })();
  </script>
  <title>SmartBlock - Choose Your Language</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #83358C;
      --purple-deep: #5B2463;
      --pink: #F01A8C;
      --yellow: #FFF212;
      --black: #000000;
      --white: #FFFFFF;
      --dark-white: #FAF8FC;
      --border: #E7D9EA;
      --text: #171217;
      --muted: #6B626D;
      --shadow: 0 12px 30px -18px rgba(131, 53, 140, 0.28);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--white);
      color: var(--text);
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Exact shared activity header dimensions and brand asset. */
    .topbar {
      flex: 0 0 auto;
      height: clamp(62px, 8vh, 76px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 8px clamp(12px, 2vw, 24px);
      border-bottom: 3px solid var(--purple);
      background: var(--yellow);
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
    }

    .topbar .brand {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-shrink: 0;
      text-decoration: none;
      cursor: pointer;
    }
    .topbar .brand:focus-visible {
      outline: 2px solid var(--purple);
      outline-offset: 4px;
      border-radius: 4px;
    }
    .topbar .brand-logo {
      height: 34px;
      width: auto;
      display: block;
    }

    /* Matching softly squared glass labels; informational, not buttons. */
    .progress-mini, .eyebrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid rgba(131,53,140,.18);
      -webkit-backdrop-filter: blur(12px) saturate(1.15);
      backdrop-filter: blur(12px) saturate(1.15);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9),
        inset 0 -1px 0 rgba(131,53,140,.045),
        0 3px 8px -5px rgba(92,37,99,.2);
    }
    .progress-mini {
      min-height: 30px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 12px;
      line-height: 1.35;
      color: var(--purple-deep);
      background: linear-gradient(155deg, rgba(255,255,255,.88),
        rgba(255,253,207,.76) 65%, rgba(255,255,255,.64));
      padding: 6px 12px;
      white-space: nowrap;
    }

    .wrap {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 20px 24px;
    }

    .hero-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 26px;
      padding: 34px 28px;
      box-shadow: var(--shadow);
      text-align: center;
      max-width: 620px;
      margin: 0 auto;
      position: relative;
    }

    .eyebrow {
      gap: 9px;
      min-height: 32px;
      max-width: 100%;
      font-family: 'Fredoka', sans-serif;
      font-size: 11.5px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      background: linear-gradient(155deg, rgba(251,246,253,.96),
        rgba(238,219,245,.88) 65%, rgba(245,232,249,.94));
      color: var(--purple-deep);
      padding: 7px 14px;
      margin-bottom: 12px;
    }
    .eyebrow .badge-dot {
      flex: 0 0 8px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(150deg, #ff73b9, var(--pink) 62%, #bc126e);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.45),
        0 0 0 3px rgba(240,26,140,.065);
      display: inline-block;
    }

    .hero-card h1 {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(24px, 4.5vw, 32px);
      color: var(--purple);
      margin-bottom: 6px;
    }

    .hero-card .hero-desc {
      color: #000000;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .dropdown-container {
      max-width: 440px;
      margin: 0 auto;
      position: relative;
      text-align: left;
    }

    .custom-dropdown-trigger {
      width: 100%;
      min-height: 54px;
      background: var(--white);
      border: 2px solid var(--purple);
      border-radius: 16px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: 0 8px 20px -8px rgba(131, 53, 140, 0.22);
      transition: border-color 160ms ease;
      user-select: none;
      outline: none;
    }

    .custom-dropdown-trigger:hover {
      border-color: var(--pink);
      box-shadow: 0 10px 24px -8px rgba(240, 26, 140, 0.28);
    }

    .custom-dropdown-trigger:focus-visible {
      outline: 2px solid var(--pink);
      outline-offset: 2px;
    }

    .trigger-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Fredoka', sans-serif;
      font-size: 17px;
      font-weight: 600;
      color: var(--purple-deep);
    }

    .trigger-globe {
      font-size: 20px;
      line-height: 1;
    }

    .trigger-text {
      display: inline-block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .trigger-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .trigger-check {
      color: #2E8B57;
      font-size: 16px;
      font-weight: 700;
      display: none;
    }

    .trigger-arrow {
      color: var(--purple);
      font-size: 13px;
      transition: transform 0.25s ease;
      display: inline-block;
    }

    .dropdown-container.open .trigger-arrow {
      transform: rotate(180deg);
      color: var(--pink);
    }

    .custom-dropdown-menu {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-5px);
      transition: opacity 150ms ease, transform 180ms cubic-bezier(.22,1,.36,1),
        visibility 0s linear 180ms;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: var(--white);
      border: 2px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 16px 36px -8px rgba(91, 36, 99, 0.32);
      padding: 8px;
      max-height: 290px;
      overflow-y: auto;
      z-index: 200;
      overscroll-behavior-y: contain;
      scrollbar-gutter: stable;
      touch-action: pan-y;
    }

    .dropdown-container.open .custom-dropdown-menu {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
      transition-delay: 0s;
    }
    .trigger-left { min-width: 0; }
    .trigger-right { flex-shrink: 0; }
    @media (prefers-reduced-motion: reduce) {
      .custom-dropdown-menu, .trigger-arrow, .custom-dropdown-trigger { transition: none; }
      .custom-dropdown-menu, .dropdown-container.open .custom-dropdown-menu { transform: none; }
    }

    .dropdown-option {
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 46px;
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: var(--purple-deep);
      margin-bottom: 2px;
      outline: none;
      background: transparent;
      transition: transform 180ms cubic-bezier(.22,1,.36,1), color 160ms ease;
    }
    /* Fade a glass surface in, rather than abruptly swapping row colours. */
    .dropdown-option::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(ellipse at 18% 0%, rgba(255,255,255,.85), transparent 68%),
        linear-gradient(155deg, rgba(246,232,252,.92), rgba(225,197,239,.68) 64%, rgba(243,224,250,.87));
      box-shadow: inset 0 1.5px 0 rgba(255,255,255,.95),
        inset 0 -1px 0 rgba(131,53,140,.12),
        inset 0 0 0 1px rgba(255,255,255,.72),
        0 4px 10px -6px rgba(92,37,99,.28);
      transition: opacity 180ms ease;
    }
    @media (hover: hover) and (pointer: fine) {
      .dropdown-option:hover::before { opacity: 1; }
      .dropdown-option:hover { transform: translateY(-1px); }
    }
    .dropdown-option:focus-visible::before,
    .dropdown-option:active::before { opacity: 1; }
    .dropdown-option:focus-visible {
      outline: 2px solid var(--purple);
      outline-offset: -2px;
    }
    .dropdown-option:active { transform: scale(.992); }
    .dropdown-option.selected {
      background: linear-gradient(155deg, #773080, #702578 48%, #762171);
      color: var(--white);
      font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(244,202,255,.3),
        inset 0 -2px 3px rgba(39,8,46,.18);
    }
    .dropdown-option.selected::before {
      background: linear-gradient(160deg, rgba(255,255,255,.12),
        rgba(255,255,255,.025) 50%, rgba(221,117,215,.07));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.3),
        inset 0 0 0 1px rgba(232,188,243,.24);
    }
    .dropdown-option.selected:focus-visible { outline-color: var(--yellow); }
    /* Lift just the language label without shifting adjacent options. */
    .dropdown-option > span:first-child {
      display: inline-block;
      transform-origin: left center;
      transition: transform 200ms cubic-bezier(.22,1,.36,1);
    }
    @media (hover: hover) and (pointer: fine) {
      .dropdown-option:hover > span:first-child {
        transform: translateY(-1px) scale(1.045);
      }
    }
    .dropdown-option:focus-visible > span:first-child,
    .dropdown-option:active > span:first-child {
      transform: translateY(-1px) scale(1.045);
    }
    @media (prefers-reduced-motion: reduce) {
      .dropdown-option > span:first-child { transition: none; }
      .dropdown-option:hover > span:first-child,
      .dropdown-option:focus-visible > span:first-child,
      .dropdown-option:active > span:first-child { transform: none; }
    }
    .dropdown-option .opt-check {
      font-size: 15px;
      font-weight: 700;
      opacity: 0;
      color: var(--yellow);
      transition: opacity 160ms ease;
    }
    .dropdown-option.selected .opt-check { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .dropdown-option, .dropdown-option::before, .dropdown-option .opt-check { transition: none; }
      .dropdown-option:hover, .dropdown-option:active { transform: none; }
    }

    .dropdown-subtext {
      font-family: 'Poppins', sans-serif;
      font-size: 13.5px;
      color: #000000;
      margin-top: 14px;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    @media (max-width: 768px) {
      .wrap { padding: 16px 16px; }
      .progress-mini { font-size: 11px; }
      .hero-card { padding: 26px 18px; border-radius: 20px; }
      .custom-dropdown-trigger { min-height: 50px; padding: 10px 14px; }
      .trigger-left { font-size: 15px; gap: 10px; }

    }
    .glass-btn {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 17.85px;
      min-height: 68.25px;
      max-width: 100%;
      padding: 12.6px 15.75px 12.6px 30.45px;
      overflow: hidden;
      border: 1px solid rgba(232,188,243,.45);
      border-radius: 999px;
      background:
        radial-gradient(ellipse at 85% 100%, rgba(183,37,135,.2), transparent 65%),
        linear-gradient(155deg, #773080 0%, #702578 48%, #762171 100%);
      color: var(--white);
      font: 600 19.215px/1.3 'Fredoka', sans-serif;
      text-shadow: 0 1px 2px rgba(39,8,46,.2);
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow:
        inset 0 1px 0 rgba(244,202,255,.30),
        inset 0 -2px 4px rgba(39,8,46,.24),
        0 5px 0 #46154F,
        0 13px 23px -9px rgba(92,26,105,.42);
      transition: transform 180ms cubic-bezier(.22,1,.36,1);
    }
    /* Fixed glass highlight: no expensive continuously animated blur. */
    .glass-btn::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 25% 0%, rgba(255,255,255,.035), transparent 68%),
        linear-gradient(180deg, rgba(255,255,255,.07),
          rgba(255,255,255,.018) 42%, transparent 60%);
      box-shadow: inset 0 0 0 1px rgba(235,176,246,.12);
    }
    .glass-btn::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: -60% -25%;
      pointer-events: none;
      background: linear-gradient(110deg, transparent 38%, rgba(255,255,255,.13) 50%, transparent 62%);
      transform: translateX(-100%);
    }
    @media (hover: hover) and (pointer: fine) {
      .glass-btn:not(:disabled):hover {
        transform: translateY(-3px);
        box-shadow: inset 0 1px 0 rgba(244,202,255,.3),
          inset 0 -2px 4px rgba(39,8,46,.24), 0 8px 0 #46154F,
          0 18px 28px -10px rgba(92,26,105,.45);
      }
      .glass-btn:not(:disabled):hover::after { animation: glassSweep 650ms ease-out; }
      .glass-btn:not(:disabled):hover .arr { transform: translateX(3px); }
    }
    @keyframes glassSweep { to { transform: translateX(100%); } }
    .glass-btn:focus-visible {
      outline: 3px solid var(--purple-deep);
      outline-offset: 6px;
    }
    .glass-btn:not(:disabled):active, .glass-btn.is-leaving {
      transform: translateY(3px) scale(.98);
      box-shadow: inset 0 1px 0 rgba(244,202,255,.2),
        inset 0 -1px 3px rgba(39,8,46,.24), 0 2px 0 #46154F,
        0 6px 14px -5px rgba(131,53,140,.3);
    }
    .glass-btn:disabled { cursor: wait; }
    .glass-btn .arr {
      flex: 0 0 39.9px;
      width: 39.9px;
      height: 39.9px;
      display: grid;
      place-items: center;
      padding: 5px;
      border-radius: 50%;
      border: 1px solid rgba(255,252,193,.88);
      background: radial-gradient(circle at 32% 20%, #fff76b, #FFF212 56%, #e2c712 100%);
      box-shadow: inset 0 1.5px 1px rgba(255,255,238,.9),
        inset 0 -2px 3px rgba(172,126,0,.22),
        0 2px 0 #c7a812, 0 4px 8px rgba(37,8,42,.28);
      transition: transform 220ms cubic-bezier(.22,1,.36,1);
    }
    .glass-btn .arr svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .glass-btn.is-leaving .arr { transform: translateX(3px); }

    /* Entrance motion belongs to wrappers so hover and press stay responsive. */
    .nav-reveal { display: inline-block; max-width: 100%; vertical-align: middle;
      animation: navPop 560ms cubic-bezier(.22,1,.36,1) both; }
    .back-reveal { margin-bottom: 16px; }
    .continue-reveal { animation-delay: 90ms; }
    @keyframes navPop {
      0% { opacity: 0; transform: translateY(12px) scale(.88); }
      62% { opacity: 1; transform: translateY(-3px) scale(1.035); }
      82% { transform: translateY(1px) scale(.99); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .back-btn { min-height: 46px; gap: 9px; padding: 7px 18px 7px 9px;
      font-size: 14px; }
    .back-btn .arr { flex-basis: 28px; width: 28px; height: 28px; padding: 4px; }
    .back-btn .arr svg { transform: rotate(180deg); }
    .continue-btn { min-height: 60px; gap: 16px; padding: 11px 14px 11px 28px;
      font-size: 18px; }
    .continue-btn .arr { flex-basis: 36px; width: 36px; height: 36px; }
    .back-btn.is-leaving .arr { transform: translateX(-3px); }
    @media (hover: hover) and (pointer: fine) {
      .back-btn:not(:disabled):hover .arr { transform: translateX(-3px); }
    }
    @media (max-width: 768px) {
      .continue-reveal { width: 100%; max-width: 320px; }
      .continue-btn { width: 100%; font-size: 17px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .nav-reveal { animation: none; }
      .glass-btn:not(:disabled):hover::after { animation: none; }
      .glass-btn, .glass-btn .arr { transition: none; }
      .glass-btn:not(:disabled):hover, .glass-btn:not(:disabled):active,
      .glass-btn.is-leaving, .glass-btn:not(:disabled):hover .arr,
      .glass-btn.is-leaving .arr { transform: none; }
    }
    /* Frosted lavender surfaces: the full language panel, matching the mode page. */
    .hero-card {
      background: #EEE7F4;
      background:
        radial-gradient(ellipse at 16% 0%, rgba(255,255,255,.4), transparent 64%),
        linear-gradient(145deg, rgba(240,232,247,.9), rgba(231,220,240,.76) 62%, rgba(238,229,246,.9));
      border-color: #C5AED2;
      -webkit-backdrop-filter: blur(12px) saturate(1.12);
      backdrop-filter: blur(12px) saturate(1.12);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.9),
        inset 0 0 0 1px rgba(131,53,140,.075),
        inset 0 -12px 22px -22px rgba(92,37,99,.15),
        0 0 0 1px rgba(131,53,140,.1),
        0 12px 26px -20px rgba(92,37,99,.25);
    }
    /* The secondary navigation is lighter; main action buttons stay dark purple. */
    .back-btn.glass-btn {
      color: var(--purple-deep);
      text-shadow: none;
      border-color: rgba(255,255,255,.8);
      background:
        radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.42), transparent 68%),
        linear-gradient(155deg, #DDC8E9, #CDB0DD 62%, #DAC0E7);
      box-shadow:
        inset 0 1.5px 0 rgba(255,255,255,.85),
        inset 0 -2px 4px rgba(92,37,99,.08),
        0 3px 0 #B896C6,
        0 9px 18px -10px rgba(92,37,99,.3);
    }
    .back-btn.glass-btn::before {
      background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.03) 48%, transparent 66%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.2);
    }
    @media (hover: hover) and (pointer: fine) {
      .back-btn.glass-btn:not(:disabled):hover {
        box-shadow:
          inset 0 1.5px 0 rgba(255,255,255,.95),
          inset 0 -2px 4px rgba(92,37,99,.08),
          0 6px 0 #B896C6,
          0 13px 22px -11px rgba(92,37,99,.33);
      }
    }
    .back-btn.glass-btn:not(:disabled):active,
    .back-btn.glass-btn.is-leaving {
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.65),
        inset 0 -1px 3px rgba(92,37,99,.1),
        0 1px 0 #B896C6,
        0 4px 10px -7px rgba(92,37,99,.25);
    }
    @media (prefers-reduced-transparency: reduce) {
      .hero-card {
        background: #EEE7F4;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
    }


    /* Same pale page canvas, golden section label and lighter frosted selector. */
    html, body { background: var(--dark-white); }
    .eyebrow {
      background:
        linear-gradient(155deg, rgba(255,255,255,.70),
          rgba(255,241,159,.62) 65%, rgba(255,255,255,.40)),
        #F3D643;
    }
    .custom-dropdown-trigger {
      background: linear-gradient(145deg, rgba(252,249,255,.95), rgba(237,225,246,.92));
      border-color: #C5AED2;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9),
        inset 0 -1px 0 rgba(131,53,140,.07), 0 8px 20px -12px rgba(92,37,99,.24);
    }
    .custom-dropdown-trigger:hover { border-color: var(--purple); }
    .dropdown-container.open .custom-dropdown-trigger { border-color: var(--purple); }
    .custom-dropdown-menu {
      background: linear-gradient(145deg, #FCF9FE, #F3ECF8);
      border-color: #C5AED2;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 16px 30px -12px rgba(92,37,99,.28);
    }
    .trigger-globe { display: inline-flex; align-items: center; justify-content: center;
      flex: 0 0 28px; width: 28px; height: 28px; line-height: 1; }

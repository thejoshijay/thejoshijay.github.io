<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>SmartBlock Level 1 - Observe &amp; Sense</title>
  <link id="nextPagePrefetch" rel="prefetch" href="language.html" as="document">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #83358C;
      --purple-deep: #5B2463;
      --pink: #F01A8C;
      --yellow: #FFF212;
      --black: #000000;
      --white: #FFFFFF;
      --border: #E7D9EA;
      --text: #171217;
      --muted: #6B626D;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      background: var(--white);
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      overflow: hidden !important;
      position: fixed;
      inset: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: manipulation;
    }

    #page1 {
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background: var(--white);
      overflow: hidden;
    }

    .splash-logo {
      width: 396.9px;
      max-width: 82vw;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .title-primary {
      margin-top: 15.75px;
      font-family: 'Fredoka', sans-serif;
      color: var(--purple);
      font-weight: 700;
      font-size: 15.435px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .title-secondary {
      margin-top: 5.25px;
      font-family: 'Poppins', sans-serif;
      font-size: 13.86px;
      color: #000000;
      font-weight: 400;
    }

    .loading-box {
      width: 352.8px;
      max-width: 82vw;
    }

    .loading-bar {
      height: 14px;
      background: #F3EAF5;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .loading-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--purple), var(--pink));
      border-radius: 999px;
      transition: width 0.1s linear;
    }

    .loading-text {
      margin-top: 10.5px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      color: var(--purple);
      font-size: 14.385px;
      min-height: 20px;
    }

    /* Keep the logo and titles still when the loader changes to the CTA. */
    .splash-action {
      position: relative;
      display: grid;
      place-items: center;
      width: min(100%, 396.9px);
      min-height: 84px;
      margin-top: 22.05px;
      flex-shrink: 0;
    }
    .loading-box, .explore-reveal { grid-area: 1 / 1; }
    .loading-box {
      transition: opacity 180ms ease, visibility 180ms ease;
    }
    .splash-action.is-ready .loading-box { opacity: 0; visibility: hidden; }
    .explore-reveal { max-width: 100%; visibility: hidden; pointer-events: none; }
    .splash-action.is-ready .explore-reveal {
      visibility: visible;
      pointer-events: auto;
      animation: explorePop 560ms cubic-bezier(.22, 1, .36, 1) both;
    }
    /* Animate the wrapper, not the button: hover/press transforms stay independent. */
    @keyframes explorePop {
      0% { opacity: 0; transform: translateY(12px) scale(.88); }
      62% { opacity: 1; transform: translateY(-3px) scale(1.035); }
      82% { transform: translateY(1px) scale(.99); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .explore-btn {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 17.85px;
      min-height: 68.25px;
      max-width: 100%;
      padding: 12.6px 15.75px 12.6px 30.45px;
      overflow: hidden;
      border: 1px solid rgba(232,188,243,.45);
      border-radius: 999px;
      background:
        radial-gradient(ellipse at 85% 100%, rgba(183,37,135,.2), transparent 65%),
        linear-gradient(155deg, #773080 0%, #702578 48%, #762171 100%);
      color: var(--white);
      font: 600 19.215px/1.3 'Fredoka', sans-serif;
      text-shadow: 0 1px 2px rgba(39,8,46,.2);
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-backdrop-filter: blur(14px) saturate(1.3);
      backdrop-filter: blur(14px) saturate(1.3);
      box-shadow:
        inset 0 1px 0 rgba(244,202,255,.30),
        inset 0 -2px 4px rgba(39,8,46,.24),
        0 5px 0 #46154F,
        0 13px 23px -9px rgba(92,26,105,.42);
      transition: transform 180ms cubic-bezier(.22,1,.36,1),
        box-shadow 180ms ease, filter 180ms ease;
    }
    /* Fixed glass highlight: no expensive continuously animated blur. */
    .explore-btn::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 25% 0%, rgba(255,255,255,.035), transparent 68%),
        linear-gradient(180deg, rgba(255,255,255,.07),
          rgba(255,255,255,.018) 42%, transparent 60%);
      box-shadow: inset 0 0 0 1px rgba(235,176,246,.12);
    }
    .explore-btn::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: -60% -25%;
      pointer-events: none;
      background: linear-gradient(110deg, transparent 38%, rgba(255,255,255,.13) 50%, transparent 62%);
      transform: translateX(-100%);
    }
    @media (hover: hover) and (pointer: fine) {
      .explore-btn:not(:disabled):hover {
        transform: translateY(-3px);
        filter: brightness(1.035);
        box-shadow: inset 0 1px 0 rgba(244,202,255,.3),
          inset 0 -2px 4px rgba(39,8,46,.24), 0 8px 0 #46154F,
          0 18px 28px -10px rgba(92,26,105,.45);
      }
      .explore-btn:not(:disabled):hover::after { animation: glassSweep 650ms ease-out; }
      .explore-btn:not(:disabled):hover .arr { transform: translateX(3px); }
    }
    @keyframes glassSweep { to { transform: translateX(100%); } }
    .explore-btn:focus-visible {
      outline: 3px solid var(--purple-deep);
      outline-offset: 6px;
    }
    .explore-btn:not(:disabled):active, .explore-btn.is-leaving {
      transform: translateY(3px) scale(.98);
      box-shadow: inset 0 1px 0 rgba(244,202,255,.2),
        inset 0 -1px 3px rgba(39,8,46,.24), 0 2px 0 #46154F,
        0 6px 14px -5px rgba(131,53,140,.3);
    }
    .explore-btn:disabled { cursor: wait; }
    .explore-btn .arr {
      flex: 0 0 39.9px;
      width: 39.9px;
      height: 39.9px;
      display: grid;
      place-items: center;
      padding: 5px;
      border-radius: 50%;
      border: 1px solid rgba(255,252,193,.88);
      background: radial-gradient(circle at 32% 20%, #fff76b, #FFF212 56%, #e2c712 100%);
      box-shadow: inset 0 1.5px 1px rgba(255,255,238,.9),
        inset 0 -2px 3px rgba(172,126,0,.22),
        0 2px 0 #c7a812, 0 4px 8px rgba(37,8,42,.28);
      transition: transform 220ms cubic-bezier(.22,1,.36,1);
    }
    .explore-btn .arr svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .explore-btn.is-leaving .arr { transform: translateX(3px); }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
    /* Only the new CTA motion is reduced; the original logo asset is untouched. */
    @media (prefers-reduced-motion: reduce) {
      .splash-action.is-ready .explore-reveal,
      .explore-btn:not(:disabled):hover::after { animation: none; }
      .explore-btn, .explore-btn .arr, .loading-box { transition: none; }
      .explore-btn:not(:disabled):hover, .explore-btn:not(:disabled):active,
      .explore-btn.is-leaving, .explore-btn:not(:disabled):hover .arr,
      .explore-btn.is-leaving .arr { transform: none; }
    }
    @media (max-height: 480px) {
      html, body { overflow: auto !important; position: static; }
      #page1 { height: auto; min-height: 100dvh; overflow: visible; }
    }

    @media (max-width: 480px) {
      .splash-logo {
        width: 308.7px;
      }
      .title-primary {
        font-size: 14.385px;
      }
      .title-secondary {
        font-size: 12.705px;
      }
      .loading-box {
        width: 298.2px;
      }
      .explore-btn {
        padding: 12.6px 16.8px 12.6px 26.25px;
        font-size: 18.165px;
      }
    }
  </style>
</head>
<body>

  <main id="page1">
    <!-- DYNAMICALLY POPULATED FROM data/site.json -->
    <img id="splashLogo" src="../assets/images/sb_logo_animation.png" alt="SmartBlock" class="splash-logo">
    <div id="logoFallback" hidden style="font-family:Fredoka,sans-serif;font-size:42px;font-weight:700;color:var(--purple);">Smart<span style="color:var(--pink)">Block</span></div>

    <div class="title-primary" id="splashTitle">OBSERVE • EXPLORE • LEARN</div>
    <div class="title-secondary" id="splashSubtitle">Level 1 STEM Learning Kit</div>

    <div class="splash-action" id="splashAction">
    <div class="loading-box" id="loadingBox">
      <div class="loading-bar" id="loadingBar" role="progressbar" aria-label="Getting ready to explore" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="loading-fill" id="loadingFill"></div>
      </div>
      <div class="loading-text" id="loadingText" role="status" aria-live="polite">Getting Ready...</div>
    </div>

    <div class="explore-reveal">
      <button class="explore-btn" id="exploreBtn" type="button" disabled>
        <span id="exploreBtnText">Start Exploring</span> <span class="arr" aria-hidden="true"><svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="ctaArrowFace" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#B775CE"/>
              <stop offset=".48" stop-color="#83358C"/>
              <stop offset="1" stop-color="#50205E"/>
            </linearGradient>
            <linearGradient id="ctaArrowGloss" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
              <stop offset=".52" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="M87 47 L55 17 L55 33 L15 33 L15 61 L55 61 L55 77 Z"
            transform="translate(0 5)" fill="#3E1249" stroke="#3E1249" stroke-width="6" stroke-linejoin="round"/>
          <path d="M87 47 L55 17 L55 33 L15 33 L15 61 L55 61 L55 77 Z"
            fill="url(#ctaArrowFace)" stroke="url(#ctaArrowFace)" stroke-width="6" stroke-linejoin="round"/>
          <path d="M87 47 L55 17 L55 33 L15 33 L15 61 L55 61 L55 77 Z"
            fill="url(#ctaArrowGloss)"/>
          <path d="M21 36 H56 V25 L72 40" fill="none" stroke="#E7C8F2" stroke-opacity=".68"
            stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg></span>
      </button>
    </div>
    </div>
    <p class="sr-only" id="navigationStatus" role="status" aria-live="polite"></p>
  </main>

  <script>
    (() => {
      'use strict';
      const defaults = {
        site: { animatedLogo: '../assets/images/sb_logo_animation.png' },
        splash: {
          title: 'OBSERVE • EXPLORE • LEARN',
          subtitle: 'Level 1 STEM Learning Kit',
          exploreButtonText: 'Start Exploring',
          nextPage: 'language.html',
          loadingMessages: [
            { progress: 0, text: 'Getting Ready...' },
            { progress: 35, text: 'Setting Up Your Adventure...' },
            { progress: 75, text: 'Almost Ready...' },
            { progress: 100, text: 'Ready to Explore! 🚀' }
          ]
        }
      };
      const $ = id => document.getElementById(id);
      const btn = $('exploreBtn');
      const logo = $('splashLogo');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let nextPageUrl = defaults.splash.nextPage;
      let messages = defaults.splash.loadingMessages;
      let ready = false;
      let navigating = false;
      let navigationTimer;
      let frameId;
      let lastProgress = -1;

      // Permit website-relative destinations, including local-file previews,
      // but reject executable schemes and unexpected cross-origin navigation.
      function safeUrl(value, fallback) {
        if (typeof value !== 'string' || !value.trim()) return fallback;
        try {
          const url = new URL(value, document.baseURI);
          const localFile = location.protocol === 'file:' && url.protocol === 'file:';
          const sameSite = /^https?:$/.test(url.protocol) && url.origin === location.origin;
          return localFile || sameSite ? value : fallback;
        } catch (_) { return fallback; }
      }
      function showLogoFallback() {
        logo.hidden = true;
        logo.style.display = 'none';
        $('logoFallback').hidden = false;
      }
      logo.addEventListener('error', showLogoFallback);
      logo.addEventListener('load', () => {
        logo.hidden = false;
        logo.style.removeProperty('display');
        $('logoFallback').hidden = true;
      });
      if (logo.complete && !logo.naturalWidth) showLogoFallback();

      function normaliseMessages(value) {
        if (!Array.isArray(value)) return defaults.splash.loadingMessages;
        const valid = value.filter(m => m && Number.isFinite(m.progress) &&
          m.progress >= 0 && m.progress <= 100 && typeof m.text === 'string' && m.text.trim());
        return valid.length ? [...defaults.splash.loadingMessages, ...valid]
          .sort((a, b) => a.progress - b.progress) : defaults.splash.loadingMessages;
      }
      function renderConfig(data) {
        if (!data || typeof data !== 'object' || Array.isArray(data)) return;
        const sp = data.splash || {};
        for (const [key, id] of [['title', 'splashTitle'], ['subtitle', 'splashSubtitle'],
          ['exploreButtonText', 'exploreBtnText']]) {
          if (typeof sp[key] === 'string' && sp[key].trim()) $(id).textContent = sp[key];
        }
        nextPageUrl = safeUrl(sp.nextPage, defaults.splash.nextPage);
        $('nextPagePrefetch').href = nextPageUrl;
        messages = normaliseMessages(sp.loadingMessages);
        const source = safeUrl(data.site?.animatedLogo, defaults.site.animatedLogo);
        // Assigning the same animated src again can restart its animation.
        if (new URL(source, document.baseURI).href !== logo.src) logo.src = source;
      }
      async function loadSiteData() {
        // Configuration cannot hold the splash hostage on a slow/offline network.
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 2000);
        try {
          const response = await fetch('../data/site.json', { signal: controller.signal });
          if (response.ok) renderConfig(await response.json());
        } catch (_) {
          // Embedded defaults remain fully usable, including file:// launches.
        } finally { window.clearTimeout(timeout); }
      }

      function updateProgress(progress) {
        if (progress === lastProgress) return;
        lastProgress = progress;
        $('loadingFill').style.width = progress + '%';
        $('loadingBar').setAttribute('aria-valuenow', String(progress));
        let message = defaults.splash.loadingMessages[0].text;
        for (const item of messages) if (progress >= item.progress) message = item.text;
        if ($('loadingText').textContent !== message) $('loadingText').textContent = message;
      }
      function revealButton() {
        ready = true;
        btn.disabled = false;
        $('loadingBox').setAttribute('aria-hidden', 'true');
        $('splashAction').classList.add('is-ready');
        $('navigationStatus').textContent = 'Ready to explore. Start Exploring is available.';
      }
      // Preserve the original 2.8-second progress animation + 300ms end pause.
      // Elapsed time avoids setInterval drift and catches up after a hidden tab.
      const startTime = performance.now();
      function tick(now) {
        const elapsed = now - startTime;
        updateProgress(Math.min(100, Math.floor(elapsed / 28)));
        if (elapsed >= 3100) revealButton();
        else frameId = requestAnimationFrame(tick);
      }
      function resetNavigation() {
        window.clearTimeout(navigationTimer);
        navigating = false;
        btn.disabled = !ready;
        btn.classList.remove('is-leaving');
        btn.removeAttribute('aria-busy');
      }
      btn.addEventListener('click', () => {
        if (!ready || navigating) return;
        navigating = true;
        btn.disabled = true;
        btn.classList.add('is-leaving');
        btn.setAttribute('aria-busy', 'true');
        $('navigationStatus').textContent = 'Opening your next adventure…';
        // A brief press response, rather than a long exit animation or double-click.
        navigationTimer = window.setTimeout(() => {
          try { window.location.assign(nextPageUrl); }
          catch (_) {
            resetNavigation();
            $('navigationStatus').textContent = 'Unable to open the next page. Please try again.';
          }
        }, reducedMotion.matches ? 0 : 160);
      });
      window.addEventListener('pagehide', () => {
        cancelAnimationFrame(frameId);
        window.clearTimeout(navigationTimer);
      });
      window.addEventListener('pageshow', event => {
        if (!event.persisted) return;
        resetNavigation();
        $('navigationStatus').textContent = ready ? 'Ready to explore.' : '';
        if (!ready) frameId = requestAnimationFrame(tick);
      });
      frameId = requestAnimationFrame(tick);
      loadSiteData();
    })();
  </script>
